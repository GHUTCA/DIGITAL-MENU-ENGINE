<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#0A0A14; --surface:#15152A; --surface-2:#1F1F38; --surface-3:#2A2A48;
    --text:#F5F5F5; --text-muted:rgba(255,255,255,0.6); --border:rgba(255,255,255,0.12); --border-strong:rgba(255,255,255,0.22);
    --accent:#E94560; --accent-soft:rgba(233,69,96,0.16); --accent-line:rgba(233,69,96,0.45);
    --success:#3DAA68; --success-soft:rgba(61,170,104,0.15); --gold:#D4A574; --gold-soft:rgba(212,165,116,0.16);
    color-scheme:dark;
  }
  html,body { background:var(--bg); color:var(--text); }
  body { font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased; min-height:100dvh; }
  button,input,select { font-family:inherit; font-size:14px; color:inherit; }
  .mono, .fin, .hh { font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; }
  [hidden] { display:none !important; }

  /* ── ingresso ── */
  #vPin { min-height:100dvh; display:flex; align-items:center; justify-content:center; padding-block:24px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
    background:radial-gradient(ellipse at top,#1F1F38 0%,var(--bg) 60%); }
  .pin { width:100%; max-width:340px; display:flex; flex-direction:column; align-items:center; gap:20px; }
  .pin h1 { font-size:26px; font-weight:700; letter-spacing:-.02em; text-align:center; }
  .pin .sub { color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.18em; text-align:center; margin-top:4px; }
  .dots { display:flex; gap:14px; }
  .dots i { width:14px; height:14px; border-radius:50%; border:2px solid var(--border-strong); }
  .dots i.on { background:var(--text); border-color:var(--text); }
  .dots.err i { border-color:var(--accent); background:var(--accent); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; }
  .pad button { height:62px; border-radius:14px; border:1px solid var(--border); background:var(--surface); font-size:22px; font-weight:600; cursor:pointer; }
  .pad button:active { background:var(--surface-3); }
  .pad .x { font-size:14px; color:var(--text-muted); }
  .pmsg { min-height:20px; font-size:13px; color:var(--text-muted); text-align:center; }
  .pmsg.err { color:var(--accent); }

  /* ── guscio ── */
  #vApp { min-height:100dvh; display:flex; flex-direction:column; }
  .top { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--border); }
  .top-in { max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding-block:10px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
  .brand { font-weight:700; font-size:16px; margin-right:auto; }
  .brand small { display:block; font-size:11px; font-weight:600; color:var(--text-muted); letter-spacing:.04em; }
  .tabs { display:flex; gap:6px; }
  .tab { border:1px solid var(--border-strong); background:var(--surface-2); border-radius:99px; padding:7px 14px; font-weight:700; cursor:pointer; }
  .tab.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  .who { font-size:12px; color:var(--text-muted); }
  .who b { color:var(--text); }
  .main { width:100%; max-width:1180px; margin:0 auto; padding-block:14px 56px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:12px; }
  #ver { font-size:10.5px; color:var(--text-muted); text-align:center; padding-bottom:16px; }

  /* ── pezzi comuni ── */
  .main h1 { font-size:22px; font-weight:700; text-wrap:balance; }
  .main h2 { font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
  .ptop { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .pbox { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; min-width:0; }
  .pban { border-radius:10px; padding:9px 12px; font-size:13px; font-weight:600; border:1px solid var(--gold); background:var(--gold-soft); }
  .pban.err { border-color:var(--accent-line); background:var(--accent-soft); }
  .perr { margin-top:8px; border-radius:8px; padding:8px 10px; background:var(--accent-soft); color:var(--text); font-size:13px; font-weight:600; }
  .main input, .main select { background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px; padding:7px 9px; min-width:0; }
  .main input:disabled, .main select:disabled { opacity:.45; }
  .main input[type=date] { color-scheme:dark; }
  .hh { width:84px; text-align:center; letter-spacing:.04em; }
  .hh.bad { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .pbt { border:1px solid var(--border-strong); background:var(--surface-2); border-radius:9px; padding:8px 12px; font-weight:700; font-size:13px; cursor:pointer; }
  .pbt.pri { background:var(--success); border-color:var(--success); color:#fff; }
  .pbt.peq { padding:5px 9px; font-size:12px; }
  .pbt:disabled { opacity:.4; cursor:default; }
  .vuoto, .nota { color:var(--text-muted); font-size:12.5px; line-height:1.45; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
  .fld { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
  .fld label { font-size:12px; font-weight:600; color:var(--text-muted); }
  .fil { display:flex; gap:6px; flex-wrap:wrap; }
  .fc { border:1px solid var(--border-strong); background:var(--surface); border-radius:99px; padding:6px 12px; font-weight:600; font-size:12.5px; cursor:pointer; }
  .fc.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  .sw { position:relative; width:46px; height:26px; border-radius:99px; border:0; background:var(--surface-3); flex:0 0 auto; cursor:pointer; }

  .sw.on { background:var(--success); } .sw.on:after { left:23px; }

  .st { display:inline-flex; font-size:12px; font-weight:700; border-radius:99px; padding:3px 9px; align-self:flex-start; background:var(--surface-3); color:var(--text-muted); }
  .st.si { background:var(--success-soft); color:var(--success); }
  .st.ma { background:var(--accent-soft); color:var(--accent); }
  .hist { display:flex; flex-direction:column; gap:4px; font-size:12.5px; max-height:220px; overflow:auto; }
  .hist div { display:flex; gap:8px; padding:5px 8px; border-radius:7px; background:var(--surface-2); }
  .hist time { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-muted); white-space:nowrap; }

  /* ── propuestas ── */
  .prev { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr); gap:10px; }
  @media (max-width:860px){ .prev { grid-template-columns:1fr; } }
  .car { position:relative; border-radius:10px; overflow:hidden; min-height:140px; background:#000; color:#fff; display:flex; align-items:flex-end; }
  .car img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .car .ct { position:relative; padding:12px; background:linear-gradient(transparent,rgba(0,0,0,.8)); width:100%; }
  .car small { display:block; font-size:11px; font-weight:700; letter-spacing:.08em; opacity:.9; }
  .car b { display:block; font-size:17px; }
  .lst { display:flex; flex-direction:column; gap:4px; max-height:190px; overflow:auto; }
  .lr { display:flex; justify-content:space-between; gap:8px; font-size:13px; padding:5px 8px; border-radius:7px; background:var(--surface-2); }
  .lr span:last-child { font-family:'JetBrains Mono',monospace; font-size:12px; white-space:nowrap; }
  .lr i { font-style:normal; color:var(--text-muted); font-size:11.5px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr)); gap:10px; }
  .cd { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; cursor:pointer; min-width:0; }
  .cd.sel { border-color:var(--success); box-shadow:0 0 0 2px var(--success); }
  .ch { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .ch b { font-size:15px; line-height:1.2; }
  .tp { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); }
  .fin { font-size:12px; }
  .gr { font-size:11.5px; font-weight:600; background:var(--gold-soft); color:var(--gold); border-radius:6px; padding:2px 7px; align-self:flex-start; }
  .cfoot { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; color:var(--text-muted); }
  .ord { display:flex; gap:4px; }
  .ord button { width:28px; height:28px; border-radius:7px; border:1px solid var(--border-strong); background:var(--surface-2); font-weight:700; cursor:pointer; }
  .dt { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; }
  @media (max-width:860px){ .dt { grid-template-columns:1fr; } }
  .dsel { display:flex; gap:4px; flex-wrap:wrap; }
  .d { min-width:34px; height:34px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface-2); font-weight:700; cursor:pointer; }
  .d.on { background:var(--text); color:var(--bg); }
  .pr { display:grid; grid-template-columns:56px 110px minmax(0,1fr) auto auto; gap:6px; align-items:center; margin-bottom:6px; }
  @media (max-width:560px){ .pr { grid-template-columns:56px minmax(0,1fr) auto; } .pr > input:nth-child(3) { grid-column:1 / -1; grid-row:2; } }
  .ptw { overflow-x:auto; }
  .ptw > div { min-width:640px; }
  .pt { display:grid; grid-template-columns:minmax(0,1.6fr) 110px 92px 92px 110px auto; gap:6px; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .pt.h { font-size:10.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
  .pn { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pv { font-size:11.5px; font-weight:600; } .pv.si { color:var(--success); } .pv.no { color:var(--accent); }
  .add { display:flex; gap:6px; margin-top:8px; }
  .add input { flex:1 1 auto; }
  .nuovi { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr)); gap:8px; }
  .nv { text-align:left; border:1px solid var(--border-strong); background:var(--surface-2); border-radius:10px; padding:10px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
  .nv span { font-size:12px; color:var(--text-muted); }

  /* ── carta ── */
  .cbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .cbar input[type=search] { flex:1 1 220px; }
  .cgrp { display:flex; flex-direction:column; gap:4px; }
  .crow { display:grid; grid-template-columns:minmax(0,1fr) auto auto auto; gap:10px; align-items:center; padding:8px 10px; border-radius:9px; background:var(--surface-2); cursor:pointer; }
  .crow.sel { box-shadow:0 0 0 2px var(--success); }
  .crow.off { cursor:default; opacity:.85; } .crow.off .cn { color:var(--text-muted); }
  .crow .cn { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .crow .cn small { display:block; font-weight:400; font-size:11.5px; color:var(--text-muted); }
  .crow .cp { font-family:'JetBrains Mono',monospace; font-size:13px; white-space:nowrap; }
  .swl { display:flex; align-items:center; gap:6px; } .swl em { font-style:normal; font-size:11.5px; color:var(--text-muted); white-space:nowrap; }   /* v1.0.2 · l'interruttore dice cosa fa */
  .capa { margin-top:14px; padding-top:12px; border-top:1px solid var(--surface-3); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }   /* v1.0.2 · «Apagar» */
  .capa .pbt.dan { border-color:#c0392b; color:#c0392b; } .capa .pbt.dan.pie { background:#c0392b; color:#fff; }
  .cnew { border-color:var(--success); } .cnew textarea { background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px; padding:7px 9px; min-height:60px; resize:vertical; font:inherit; color:inherit; }   /* v1.1.0 · «+ Producto» */
  .crow.nuovo { box-shadow:0 0 0 2px var(--success); }
  .ckl { display:flex; gap:9px; align-items:flex-start; margin-top:12px; cursor:pointer; } .ckl input { width:18px; height:18px; margin-top:2px; flex:0 0 auto; } .ckl span { font-size:13px; } .ckl small { display:block; color:var(--text-muted); font-size:11.5px; }
  .crow .ch2 { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-muted); white-space:nowrap; }
  @media (max-width:560px){ .crow { grid-template-columns:minmax(0,1fr) auto auto; } .crow .ch2 { display:none; } }
  .cdet { border-color:var(--success); }

  .toast { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(140%); max-width:calc(100% - 32px); background:var(--surface-3); border:1px solid var(--border-strong); border-radius:12px; padding:10px 14px; font-weight:600; transition:transform .2s; z-index:20; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.ok { border-color:var(--success); } .toast.err { border-color:var(--accent); } .toast.warn { border-color:var(--gold); }
</style>

<script>
'use strict';
/* ═══ CONFIG ═══ */
const QS = new URLSearchParams(location.search);
const LOCAL = (QS.get('local') || 'BKS').trim().toUpperCase().replace(/[^A-Z0-9]/g, '') || 'BKS';
const BORDE = 'https://pinsita-borde.alberto-agostini.workers.dev';
const BORDE_TOKEN = '7QvreCN5fzM40GW2Me8vfvNwIwcA9RDnTceXMwgZ';   // token di PAGINA (lo stesso del pannello vecchio): apre la porta, non firma niente
const BASE = (function(){   // un PIN non deve mai poter essere mandato a un host scelto da un link
  const h = location.hostname, b = QS.get('pbase');
  return (b && (h === 'localhost' || h === '127.0.0.1') && /^http:\/\/(localhost|127\.0\.0\.1):\d{2,5}$/.test(b)) ? b : BORDE;
})();
const SES_KEY = 'pinsita_admin25_' + LOCAL, SES_TTL_MS = 8 * 3600 * 1000;
let SES = null;   // { pin, quien, cargo, puede, ts }

/* ═══ utensili ═══ */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const clp = (n) => (n == null || isNaN(n) ? '—' : '$' + Math.round(n).toLocaleString('es-CL'));
function uuid(){ if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join(''); return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20); }
let toastT = 0;
function toast(kind, text){ const t = document.getElementById('toast'); t.className = 'toast show ' + (kind || ''); t.textContent = text; clearTimeout(toastT); toastT = setTimeout(() => { t.className = 'toast'; }, 3200); }
async function api(path, init, ms){
  const ctrl = new AbortController(); const tid = setTimeout(() => ctrl.abort(), ms || 6000);
  try {
    const r = await fetch(BASE + path, Object.assign({ cache:'no-store', signal:ctrl.signal }, init || {},
      { headers: Object.assign({ 'X-Borde-Token': BORDE_TOKEN }, (init && init.headers) || {}) }));
    clearTimeout(tid);
    let j = null; try { j = await r.json(); } catch (e) { j = null; }
    return { status:r.status, j };
  } catch (e) { clearTimeout(tid); return { status:0, j:null, red: e.name === 'AbortError' ? 'timeout' : 'red' }; }
}
const post = (path, body, ms) => api(path, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) }, ms || 8000);

/* ═══ L'ORA A 24 H ═══ «3» → 03:00 · «330» → 03:30 · «2330» → 23:30 · vuoto = nessuna ora. Mai a. m./p. m. */
const HH_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
function hhNorm(v){
  const s = String(v == null ? '' : v).trim(); if (!s) return '';
  const m = /^(\d{1,2}):(\d{2})(?::\d{2})?$/.exec(s);
  let h, mi;
  if (m) { h = +m[1]; mi = +m[2]; }
  else { const d = s.replace(/\D/g, ''); if (!d || d.length > 4) return null;
    if (d.length <= 2) { h = +d; mi = 0; } else { h = +d.slice(0, d.length - 2); mi = +d.slice(-2); } }
  if (h === 24 && mi === 0) h = 0;
  if (!(h >= 0 && h <= 23 && mi >= 0 && mi <= 59)) return null;
  return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0');
}
const hhShow = (v) => { const n = hhNorm(v); return n == null ? String(v || '') : n; };
function hhInput(attrs, val, dis){ return '<input class="hh" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="--:--" title="Hora de 24 h, ej. 03:00 o 23:30" value="' + esc(hhShow(val)) + '" ' + attrs + (dis ? ' disabled' : '') + '>'; }
/* il valore di un campo ora: se dice la STESSA ora della riga, si tiene la forma della riga (23:00:00) e non nasce una versione finta */
function hhKeep(raw, orig){ const n = hhNorm(raw); if (n == null) return { bad:true }; if (!n) return { v:null }; return { v: (orig && hhNorm(orig) === n) ? orig : n }; }
document.addEventListener('blur', (ev) => { const e = ev.target; if (!e.classList || !e.classList.contains('hh')) return;
  const n = hhNorm(e.value); if (n == null) e.classList.add('bad'); else { e.classList.remove('bad'); e.value = n; } }, true);
document.addEventListener('input', (ev) => { const e = ev.target; if (e.classList && e.classList.contains('hh')) e.classList.remove('bad'); });

/* ═══ INGRESSO ═══ */
const LOGIN_ERR = { pin_invalido:'PIN incorrecto', pin_requerido:'Escribe tu PIN', pin_bloqueado:'PIN bloqueado · espera', firmante_no_autorizado:'Tu PIN no tiene acceso a este admin',
  ruta_apagada:'El ingreso aún no está activo', token_invalido:'Sin acceso al servidor' };
let pinBuf = '', pinBusy = false;
function pinDots(err){ const d = document.getElementById('dots'); d.classList.toggle('err', !!err); [...d.children].forEach((x, i) => x.classList.toggle('on', i < pinBuf.length)); }
function pinMsg(t, err){ const m = document.getElementById('pmsg'); m.textContent = t; m.classList.toggle('err', !!err); }
async function pinProva(){
  pinBusy = true; pinMsg('Verificando…');
  let dev = ''; try { dev = localStorage.getItem('pinsita_dispositivo') || ''; } catch (e) { dev = ''; }
  const r = await post('/adminLogin/' + encodeURIComponent(LOCAL), dev ? { pin: pinBuf, dispositivo_id: dev } : { pin: pinBuf }, 8000);
  pinBusy = false;
  const j = r.j || {};
  if (r.status === 200 && j.ok === true && j.quien) {
    SES = { pin: pinBuf, quien: j.quien, cargo: j.cargo || null, puede: j.puede || {}, ts: Date.now() };
    try { sessionStorage.setItem(SES_KEY, JSON.stringify(SES)); } catch (e) { /* senza storage si resta dentro finché la pagina è aperta */ }
    pinBuf = ''; pinDots(); entra(); return;
  }
  let t = r.status === 0 ? 'Sin conexión · reintenta' : (LOGIN_ERR[j.error] || j.error || ('Error ' + r.status));
  if (j.error === 'pin_bloqueado' && j.faltan_s) t += ' ' + j.faltan_s + ' s';
  pinBuf = ''; pinDots(true); pinMsg(t, true); setTimeout(() => pinDots(), 700);
}
document.getElementById('pad').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b || pinBusy) return;
  if (b.dataset.k === 'borra') { pinBuf = pinBuf.slice(0, -1); pinDots(); return; }
  if (pinBuf.length >= 4) return;
  pinBuf += b.textContent.trim(); pinDots(); if (pinBuf.length === 4) pinProva();
});
document.addEventListener('keydown', (ev) => {
  if (document.getElementById('vPin').hidden || pinBusy) return;
  if (/^\d$/.test(ev.key) && pinBuf.length < 4) { pinBuf += ev.key; pinDots(); if (pinBuf.length === 4) pinProva(); }
  else if (ev.key === 'Backspace') { pinBuf = pinBuf.slice(0, -1); pinDots(); }
});
function esci(){ SES = null; try { sessionStorage.removeItem(SES_KEY); } catch (e) {} document.getElementById('vApp').hidden = true; document.getElementById('vPin').hidden = false; pinMsg('Escribe tu PIN'); }
document.getElementById('salir').addEventListener('click', esci);

async function cartaGesto(p, gesto, valor){

  if (['menu_visible','precio','hora_inicio','activo'].includes(gesto)) body.base_ts = p.ts;

  if (r.status === 0) r = await post('/cartaAdmin/' + encodeURIComponent(LOCAL), body, 8000);   // stesso corpo, stessa chiave
  if (r.status === 0) { toast('err', 'La carta no respondió · reintenta'); return false; }
  const j = r.j || {};
  if (j.ok === true) return true;
  toast('err', CARTA_ERR[j.error] || j.error || 'No se pudo guardar');

}

/* ═══ v1.1.0 · «+ Producto» · il gesto `crear` del bordo (D-498, CONTRATTO_CREAR_PRODUCTO_11NOV2026). Solo il gerente (il bordo lo dice in
   `puede.carta_crear`, e lo ricontrolla sul PIN). Il prodotto NASCE SPENTO: compare in «Ver apagados» e lo mette in vendita «Encender».
   L'ID lo propone il vetro (il prefisso più usato della categoria + il numero dopo il più alto), lo verifica il bordo: `id_en_uso` ⇒ il
   numero dopo e una chiave NUOVA (è un altro gesto). Il ritento di rete riusa lo stesso corpo e la stessa chiave. */
const puedeCrear = () => !!(SES && SES.puede && SES.puede.carta_crear);
const CREA_ID_RE = /^[A-Z0-9][A-Z0-9_-]{1,59}$/;
const CREA_CAT_FUORI = ['menu_contenitore'];   // v1.1.1 · N3 di EL GIRO: un contenitore senza domande il cliente lo vedrebbe «pronto». Non si crea da qui.
function creaCats(){ return [...new Set((C.all || []).map((p) => p.categoria).filter((c) => c && CREA_CAT_FUORI.indexOf(c) < 0))].sort((a, b) => a.localeCompare(b, 'es')); }
/* il prefisso più usato fra gli ID della categoria, e il numero dopo il più alto con quel prefisso in tutto il local (larghezza uguale) */
function creaIdPropone(cat, salto){
  const tutti = (C.all || []).map((p) => String(p.id_producto || ''));
  const conta = {};
  (C.all || []).filter((p) => p.categoria === cat).forEach((p) => { const m = String(p.id_producto || '').match(/^(.*?)(\d+)$/); if (m) conta[m[1]] = (conta[m[1]] || 0) + 1; });
  const pre = Object.keys(conta).sort((a, b) => conta[b] - conta[a] || a.localeCompare(b))[0];
  if (!pre) return '';
  let max = 0, larg = 3;
  tutti.forEach((id) => { if (id.startsWith(pre)) { const r = id.slice(pre.length); if (/^\d+$/.test(r)) { max = Math.max(max, Number(r)); larg = Math.max(larg, r.length); } } });
  return pre + String(max + 1 + (salto || 0)).padStart(larg, '0');
}
function creaApri(){ const cats = creaCats(); const cat = cats[0] || ''; C.nuevo = { nombre:'', categoria:cat, precio:'', descripcion:'', id: creaIdPropone(cat), idTocco:false, soloMenu:false, err:'', busy:false }; C.sel = null; C.conf = null; }
function creaLeggi(){ const N = C.nuevo; if (!N) return; const v = (id) => (document.getElementById(id) || {}).value;
  const nom = v('cn_nombre'); if (nom != null) N.nombre = nom; const pr = v('cn_precio'); if (pr != null) N.precio = pr;
  const ds = v('cn_desc'); if (ds != null) N.descripcion = ds; const id = v('cn_id'); if (id != null) N.id = id.toUpperCase();
  const sm = document.getElementById('cn_sm'); if (sm) N.soloMenu = !!sm.checked; }
function cartaNuovoModulo(){

  return '<div class="pbox cnew" id="cNew"><div class="ptop"><h1>Nuevo producto</h1><div class="row"><button class="pbt" data-ca="nuevoNo"' + (N.busy ? ' disabled' : '') + '>Cancelar</button>' +

    '<div class="row"><div class="fld"><label>Categoría</label><select id="cn_cat">' + cats.map((c) => '<option value="' + esc(c) + '"' + (c === N.categoria ? ' selected' : '') + '>' + esc(c.charAt(0).toUpperCase() + c.slice(1)) + '</option>').join('') + '</select></div>' +
    '<div class="fld"><label>Precio (CLP)</label><input type="number" inputmode="numeric" min="1" step="1" id="cn_precio" value="' + esc(N.precio) + '" style="width:130px"></div>' +
    '<div class="fld"><label>Código</label><input id="cn_id" maxlength="60" value="' + esc(N.id) + '" style="width:150px;text-transform:uppercase" class="mono"></div></div>' +
    '<div class="fld"><label>Descripción (opcional)</label><textarea id="cn_desc" maxlength="300">' + esc(N.descripcion) + '</textarea></div>' +
    '<label class="ckl"><input type="checkbox" id="cn_sm"' + (N.soloMenu ? ' checked' : '') + '><span><b>Solo en menú</b><small>Como «Tiramisú menú»: no sale en la carta, solo como opción dentro de un menú, al precio del menú. El precio de arriba es el de referencia.</small></span></label>' +
    '<div class="nota">Nace <b>desactivado</b>: no se ve ni se vende hasta que lo revises en «Ver desactivados» y lo actives. Sin foto ni traducciones por ahora: sale en español en todos los idiomas.</div></div>';
}
async function creaInvia(){
  const N = C.nuevo; if (!N || N.busy) return; creaLeggi();
  const e = [];
  if (N.nombre !== N.nombre.trim()) N.nombre = N.nombre.trim();
  if (N.nombre.length < 2 || N.nombre.length > 60) e.push('El nombre va de 2 a 60 letras.');
  const n = Number(N.precio); if (N.precio === '' || !Number.isInteger(n) || n <= 0) e.push('El precio es un número entero mayor que cero.');
  if (!N.categoria) e.push('Elige una categoría.');
  if (!CREA_ID_RE.test(N.id)) e.push('El código no es válido (ej. BKS-MOJ-012).');
  if (N.descripcion.length > 300) e.push('La descripción va hasta 300 letras.');
  if (e.length) { N.err = e.join(' '); cartaPinta(); return; }
  N.err = ''; N.busy = true; cartaPinta();
  let id = N.id, salto = 0, j = null;
  for (let giro = 0; giro < 4; giro++) {
    const body = { pin: SES.pin, gesto:'crear', gesto_id: uuid(), id_producto: id, valor:{ nombre: N.nombre, categoria: N.categoria, precio: n, descripcion: N.descripcion.trim() } };
    let r = await post('/cartaAdmin/' + encodeURIComponent(LOCAL), body, 8000);
    if (r.status === 0) r = await post('/cartaAdmin/' + encodeURIComponent(LOCAL), body, 8000);   // stesso corpo, stessa chiave
    j = r.j || {};
    if (r.status === 0) { j = { error:'red' }; break; }
    if (j.ok === true) break;
    if (j.error !== 'id_en_uso' || N.idTocco) break;   // un codice scritto a mano non si cambia da solo: lo dice e si ferma
    salto++; id = creaIdPropone(N.categoria, salto); if (!id) break;   // il numero dopo, e una chiave nuova al giro dopo
  }
  N.busy = false;
  if (j && j.ok === true) {
    const soloMenu = !!N.soloMenu;
    C.recien = id; C.cat = N.categoria; C.q = ''; C.nuevo = null; C.off = true;   // la sua categoria, e gli apagados in vista: il nuovo è in cima
    await cartaCarica();
    if (soloMenu) {   // v1.2 · il secondo gesto, sulla versione appena nata (il suo ts viene dalla rilettura)
      const nato = (C.all || []).find((x) => x.id_producto === id);
      const ok2 = nato ? await cartaGesto(nato, 'menu_visible', false) : false;
      if (ok2) await cartaCarica();
      toast(ok2 ? 'ok' : 'err', ok2 ? 'Creado desactivado, solo en menú · revísalo y actívalo' : 'Creado, pero no quedó «solo en menú»: ábrelo y márcalo');
    } else toast('ok', 'Creado desactivado · revísalo y actívalo');
    cartaPinta();
    const o = document.getElementById('cOff'); if (o) o.scrollIntoView({ behavior:'smooth', block:'start' });
    return;
  }
  N.id = id;
  N.err = j.error === 'red' ? 'Sin conexión · reintenta' : (CARTA_ERR[j.error] || j.error || 'No se pudo crear');
  if (j.error === 'firmante_no_autorizado') N.err = 'Solo el gerente puede crear productos';
  if (j.error === 'pg_rechazo') N.err = 'Ese código no se puede usar · prueba otro';   // v1.1.1 · N2 di EL GIRO: un codice di un altro locale, rifiutato dal libro
  cartaPinta();
}

  const dis = !puedeCarta();
  return '<div class="pbox cdet" id="cDet"><div class="ptop"><div><div class="tp">' + esc(p.categoria || '') + ' · ' + esc(p.id_producto) + '</div><h1>' + esc(p.nombre) + '</h1></div>' +

    (C.err ? '<div class="perr">' + esc(C.err) + '</div>' : '') +
    '<div class="row" style="margin-top:12px">' +
      '<div class="fld"><label>Precio (CLP)</label><input type="number" inputmode="numeric" min="1" step="1" id="cf_precio" value="' + esc(p.sin_precio ? '' : (p.precio || '')) + '" style="width:130px"' + (dis ? ' disabled' : '') + '></div>' +
      '<div class="fld"><label>Desde</label>' + hhInput('id="cf_ini"', p.hora_inicio, dis) + '</div>' +

    const hoy = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Santiago' }).format(new Date());
    const fila = Object.assign({ local: LOCAL, id_strumento: base, tipo: k, nombre_visible: nom, activo: false, grupo: null, dias: [], desde: null, hasta: null, hasta_tope: null,
      fecha_desde: null, fecha_hasta: null, prioridad: null, orden: 99, id_contenitore: null, precios: [], precio_default: null, multiplo: null, factor: null, badge: null, media: null,
      textos: { es: { eyebrow: '', titulo: nom, sub: '' } }, cta: null, borrado: false }, N.campi(hoy));
    el.disabled = true;
    const j = await propScrivi('strumento', fila, null);
    if (j.ok) { P.scegli = false; P.filtro = 'todo'; P.sel = base; toast('ok', 'Creada apagada'); await propCarica(); propStoria(base); const d = document.getElementById('propDet'); if (d) d.scrollIntoView({ behavior:'smooth', block:'start' }); }
    else el.disabled = false;
    return; }
});
document.getElementById('propApp').addEventListener('change', (ev) => {
  if (ev.target.id === 'ps_hora') { const h = hhNorm(ev.target.value); if (!h) return; P.sim = { dia: (P.sim && P.sim.dia) || ((P.d && P.d.adesso && P.d.adesso.ahora) || {}).dia || null, hora: h }; propCarica(); }
});
document.getElementById('propApp').addEventListener('keydown', (ev) => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('cd')) { ev.preventDefault(); ev.target.click(); } });

/* l'anteprima invecchia: ogni minuto si rilegge, mai sotto le dita di chi sta scrivendo */
setInterval(() => {
  if (!SES || document.visibilityState !== 'visible') return;
  if (TAB === 'prop' && !P.sim && !P.sel && !P.draft && !P.scegli) propCarica();
  if (TAB === 'carta' && !C.sel && document.activeElement && document.activeElement.id !== 'cq') cartaCarica();
}, 60000);

/* ═══ AVVIO ═══ */
document.getElementById('pinLocal').textContent = LOCAL; document.getElementById('topLocal').textContent = LOCAL;
try { const s = JSON.parse(sessionStorage.getItem(SES_KEY) || 'null'); if (s && s.pin && s.quien && Date.now() - s.ts < SES_TTL_MS) SES = s; } catch (e) { SES = null; }
if (SES) { entra(); sesRinfresca(); }
/* v1.1.2 · il PIN della sessione rifà il login in silenzio: cargo e permessi di ADESSO. Un PIN che non vale più ⇒ fuori (come Salir).
   Rete giù ⇒ si resta con quelli di prima. Una volta per apertura della pagina (il tetto del bordo è 30 al minuto per IP). */
async function sesRinfresca(){
  if (!SES || !SES.pin) return;
  let dev = ''; try { dev = localStorage.getItem('pinsita_dispositivo') || ''; } catch (e) { dev = ''; }
  const r = await post('/adminLogin/' + encodeURIComponent(LOCAL), dev ? { pin: SES.pin, dispositivo_id: dev } : { pin: SES.pin }, 8000);
  const j = r.j || {};
  if (r.status === 200 && j.ok === true && j.quien) {
    const prima = JSON.stringify([SES.cargo, SES.puede]);
    SES = Object.assign({}, SES, { quien: j.quien, cargo: j.cargo || null, puede: j.puede || {}, ts: Date.now() });
    try { sessionStorage.setItem(SES_KEY, JSON.stringify(SES)); } catch (e) { /* solo memoria */ }
    if (JSON.stringify([SES.cargo, SES.puede]) !== prima) { document.getElementById('who').innerHTML = '<b>' + esc(SES.quien) + '</b> · ' + esc(SES.cargo === 'gerente' ? 'gerente' : SES.cargo === 'jl' ? 'jefe de local' : 'sin cargo'); if (TAB === 'carta') cartaPinta(); else propPinta(); }
    return;
  }
  if (r.status === 401 || r.status === 403) { esci(); pinMsg('Tu PIN cambió · vuelve a entrar', true); }
}
