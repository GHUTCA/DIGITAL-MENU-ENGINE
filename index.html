<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pinsita · Menú</title>
  <script>
    // Redirige la raíz al menú conservando la query (?mesa=N&member=...&local=...).
    // Así el QR limpio menu.pinsita.cl/?mesa=50 abre menu_digital.html?mesa=50.
    // v2 (15-jul) · FIX QR NUOVI: il QR pulito ?mesa=N NON porta ?local= e
    // menu_digital senza local mostra "Invalid QR" (validateLocal). Il DOMINIO
    // è il locale: qui la porta d'ingresso aggiunge local=BKS se manca.
    // Un ?local= esplicito nella query VINCE sempre (multilocal salvo).
    (function () {
      var hash = location.hash || '';
      var p = new URLSearchParams(location.search || '');
      if (!p.get('local')) p.set('local', 'BKS');
      location.replace('menu_digital.html?' + p.toString() + hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=menu_digital.html">
</head>
<body style="font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
  <p>Abriendo el menú… <a href="menu_digital.html" style="color:#3fe0f0">toca aquí si no carga</a></p>
</body>
</html>
