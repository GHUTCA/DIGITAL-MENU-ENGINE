<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- DEVICE-CLASS: 2 · scrivania (PC / tablet prima) -->
<title>Propuestas · BKS</title>
<!-- 📖 MENU BKS V32 · mer 4-nov-2026 · DEMO del pannello «Propuestas» (5.2-PE §6, D-433 / D-454): «l'artefatto» che contiene menú, promo,
     botellas, eventi, scene e destacados. Tutto in questo telefono/PC: NON salva niente, NON parla con Google né col bordo.
     La regola è la COPIA ESATTA di quella del bordo (propuestas/regla.js): chi si vede adesso, a che prezzo, chi vince il carosello.
     Il seme (propuestas/seme_BKS.json) nasce dalle tab di oggi (AURORA, PRECIOS_REGLA, PROMOS) e da vetrina.json. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#F3EADC;--sup:#FBF6EE;--card:#FFFFFF;--txt:#241A14;--suave:#6B5A4F;--linea:rgba(36,26,20,.12);--linea2:rgba(36,26,20,.22);
  --ok:#5F7A1F;--ok-txt:#FFFFFF;--ok-bg:#E6EED3;--oro:#A8701F;--oro-bg:#F6E7C8;--male:#B3261E;--male-bg:#F8DEDA;--grigio-bg:#ECE6DC;--viola:#5B2A86;--viola-bg:#EBDDF6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0C09;--sup:#17120D;--card:#1E1812;--txt:#F3EDE4;--suave:#B5A797;--linea:rgba(243,237,228,.12);--linea2:rgba(243,237,228,.24);
  --ok:#8B9E4F;--ok-txt:#14180A;--ok-bg:#26301A;--oro:#E0A84A;--oro-bg:#33281A;--male:#FF8A80;--male-bg:#3A1D1A;--grigio-bg:#26201A;--viola:#C9A0EE;--viola-bg:#2C1F3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F0C09;--sup:#17120D;--card:#1E1812;--txt:#F3EDE4;--suave:#B5A797;--linea:rgba(243,237,228,.12);--linea2:rgba(243,237,228,.24);
  --ok:#8B9E4F;--ok-txt:#14180A;--ok-bg:#26301A;--oro:#E0A84A;--oro-bg:#33281A;--male:#FF8A80;--male-bg:#3A1D1A;--grigio-bg:#26201A;--viola:#C9A0EE;--viola-bg:#2C1F3A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Outfit,system-ui,sans-serif;font-size:14px}
.w{max-width:1180px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
h2{margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.demo{background:var(--oro-bg);color:var(--txt);border:1.5px solid var(--oro);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600}
.box{background:var(--card);border:1.5px solid var(--linea);border-radius:14px;padding:14px}
.reloj{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reloj b{font-size:13px}
.dsel{display:flex;gap:4px}
button{font-family:inherit;cursor:pointer}
.d{min-width:34px;height:34px;border-radius:8px;border:1.5px solid var(--linea2);background:var(--sup);color:var(--txt);font-weight:800}
.d.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt);background:var(--sup);border:1.5px solid var(--linea2);border-radius:8px;padding:7px 9px}
input[type=time]{width:110px}
.bt{border:1.5px solid var(--linea2);background:var(--sup);color:var(--txt);border-radius:9px;padding:8px 12px;font-weight:800;font-size:13px}
.bt.pri{background:var(--ok);color:var(--ok-txt);border-color:var(--ok)}
.bt.peq{padding:5px 9px;font-size:12px}
.prev{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:860px){.prev{grid-template-columns:1fr}}
.car{position:relative;border-radius:12px;overflow:hidden;min-height:150px;background:#1a1410;color:#fff;display:flex;align-items:flex-end}
.car img,.car video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.car .ct{position:relative;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.75));width:100%}
.car .ct small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.9}
.car .ct b{display:block;font-size:17px;font-weight:800}
.car .ct span{font-size:12.5px;opacity:.9}
.vuoto{color:var(--suave);font-size:13px;padding:10px 0}
.lst{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow:auto}
.lr{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 8px;border-radius:7px;background:var(--sup)}
.lr span:last-child{font-family:"JetBrains Mono",monospace;font-size:12px;white-space:nowrap}
.lr i{font-style:normal;color:var(--suave);font-size:11.5px}
.fil{display:flex;gap:6px;flex-wrap:wrap}
.fc{border:1.5px solid var(--linea2);background:var(--card);color:var(--txt);border-radius:99px;padding:6px 12px;font-weight:700;font-size:12.5px}
.fc.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.cd{background:var(--card);border:1.5px solid var(--linea);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;color:var(--txt);min-width:0}
.cd:hover{border-color:var(--linea2)}
.cd.sel{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ch b{font-size:15.5px;font-weight:800;line-height:1.2}
.tp{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.fin{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--txt)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:99px;padding:3px 9px;align-self:flex-start}
.st.si{background:var(--ok-bg);color:var(--ok)}
.st.no{background:var(--grigio-bg);color:var(--suave)}
.st.ap{background:var(--grigio-bg);color:var(--suave)}
.st.ma{background:var(--male-bg);color:var(--male)}
.gr{font-size:11.5px;font-weight:700;background:var(--viola-bg);color:var(--viola);border-radius:6px;padding:2px 7px;align-self:flex-start}
.sw{position:relative;width:46px;height:26px;border-radius:99px;border:0;background:var(--linea2);flex:0 0 auto}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)}.sw.on:after{left:23px}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--suave)}
.ord{display:flex;gap:4px}
.ord button{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--linea2);background:var(--sup);color:var(--txt);font-weight:800}
/* il dettaglio */
.dt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.dt{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:12px;font-weight:800;color:var(--suave)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.pr{display:grid;grid-template-columns:60px 120px minmax(0,1fr) auto auto;gap:6px;align-items:center;margin-bottom:6px}
.pt{display:grid;grid-template-columns:minmax(0,1.6fr) 110px 90px 90px 96px auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--linea);font-size:13px}
.pt.h{font-size:11px;font-weight:800;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
.pt .pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .pv{font-size:11.5px;font-weight:700}
.pv.si{color:var(--ok)}.pv.no{color:var(--male)}
.ptw{overflow-x:auto}
.ptw>div{min-width:640px}
.hist{display:flex;flex-direction:column;gap:4px;font-size:12.5px;max-height:220px;overflow:auto}
.hist div{display:flex;gap:8px;padding:5px 8px;border-radius:7px;background:var(--sup)}
.hist time{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--suave);white-space:nowrap}
.nota{font-size:12px;color:var(--suave);line-height:1.45}
.err{color:var(--male);font-size:12.5px;font-weight:700}
.add{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.add input{flex:1 1 220px}
.ok{color:var(--ok);font-weight:800}
a.bt{text-decoration:none;display:inline-flex;align-items:center}
.nuovi{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.nv{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--sup);border:1.5px solid var(--linea2);border-radius:12px;padding:12px;color:var(--txt)}
.nv:hover{border-color:var(--ok)}
.nv b{font-size:15px;font-weight:800}
.nv span{font-size:12.5px;color:var(--suave);line-height:1.35}
</style>
</head>
<body>
<div class="w" id="app"><div class="box">Cargando…</div></div>
<script type="module">
import { strumentiAdesso, slotAdesso } from './propuestas/regla.js';

const DIAS = ['L', 'M', 'X', 'J', 'V', 'S', 'D'], DIA_N = { L: 'Lun', M: 'Mar', X: 'Mié', J: 'Jue', V: 'Vie', S: 'Sáb', D: 'Dom' };
const TIPO = { menu: 'Menú', botellas: 'Botellas', multiplo: '2x1 / múltiplo', precio_fijo: 'Precio fijo', recargo: 'Recargo', evento: 'Evento', escena: 'Escena del carrusel', destacados: 'Destacados', fondo: 'Fondo / noche' };
const FILTRI = [['todo', 'Todo'], ['menu', 'Menús'], ['promo', 'Promos'], ['botellas', 'Botellas'], ['evento', 'Eventos y escenas'], ['destacados', 'Destacados'], ['recargo', 'Recargos'], ['fondo', 'Fondo']];
const PERCHE = { spento: 'Apagado', grupo_spento: 'Su noche está apagada', non_oggi: 'Hoy no', fuori_data: 'Fuera de fecha', fuori_orario: 'Fuera de horario', sin_partes: 'Sin productos disponibles',
  tipo_sconosciuto: 'Tipo desconocido', hasta_tope_invalida: 'Tope inválido', finestra_invalida: 'Horario inválido', precios_invalidi: 'Precios inválidos', multiplo_invalido: '2x1 inválido', factor_invalido: 'Recargo inválido',
  sin_precio: 'Sin precio', contenitore_non_si_vende: 'El menú no está a la venta' };
const PERCHE_P = { agotado: 'Agotado (86)', non_si_vende: 'No está a la venta', parte_fuori_finestra: 'Su hora queda fuera', finestra_parte_invalida: 'Hora inválida', fuori_orario_parte: 'Fuera de su hora' };
const clp = (n) => (n == null || isNaN(n) ? '—' : '$' + Math.round(n).toLocaleString('es-CL'));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'demo-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);   // la chiave nasce dal client

const S = { strumenti: [], parti: [], carta: {}, hist: [], filtro: 'todo', sel: null, dia: null, hora: null, err: '', aggiungi: '', scegli: false };
const oggiISO = () => { const p = oraSantiago(Date.now()); return p.year + '-' + p.month + '-' + p.day; };
/* i tipi che si creano dal pannello, coi campi con cui nascono (spenti) */
const NUOVI = {
  evento: { ico: '🎉', nome: 'Nuevo evento', desc: 'Una noche, un DJ, una fecha. Sale en el carrusel con su foto o video.', campi: () => ({ desde: '20:00', hasta: '23:59', fecha_desde: oggiISO(), fecha_hasta: oggiISO(), prioridad: 1, textos: { es: { eyebrow: '🎉 Esta noche', titulo: '', sub: '' } } }) },
  multiplo: { ico: '🍸', nome: '2x1 nuevo', desc: 'Paga 1, lleva 2 en los productos que elijas, en su horario.', campi: () => ({ desde: '16:00', hasta: '20:00', multiplo: { paga: 1, lleva: 2 }, badge: 'En 2x1 ahora' }) },
  precio_fijo: { ico: '🏷', nome: 'Precio especial', desc: 'Productos a un precio fijo en su horario (como el martes a $2.000).', campi: () => ({ desde: '12:00', hasta: '23:00', badge: 'Precio especial' }) },
  menu: { ico: '🍽', nome: 'Menú nuevo', desc: 'Un precio por un menú compuesto: fondo, bebida, postre…', campi: () => ({ desde: '12:00', hasta: '15:30', precios: [{ id: 'A', precio: 9990, etiqueta: 'Menú' }], precio_default: 'A', badge: 'En el menú' }) },
  escena: { ico: '🎬', nome: 'Nueva escena', desc: 'Un video o una foto en el carrusel: un plato, cómo lo hacemos.', campi: () => ({ prioridad: 5 }) },
  destacados: { ico: '★', nome: 'Destacados', desc: 'Una lista de productos que se muestran arriba en la carta.', campi: () => ({ badge: '★ destacado' }) },
  botellas: { ico: '🍾', nome: 'Botellas', desc: 'Botellas con su precio de noche, cada una con su hora.', campi: () => ({ desde: '22:00', hasta: '03:00', badge: 'Botella' }) },
  recargo: { ico: '↗', nome: 'Recargo', desc: 'Sube los precios en un horario (ej. ×1,10 de noche).', campi: () => ({ desde: '23:00', hasta: '03:00', factor: 1.1 }) },
};

/* l'orologio: «adesso» vero, o il giorno e l'ora che scegli (Santiago) */
function oraSantiago(ms) { const f = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/Santiago', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short' });
  const o = {}; for (const p of f.formatToParts(new Date(ms))) o[p.type] = p.value; return o; }
function adesso() {
  if (!S.dia && !S.hora) return Date.now();
  // il giorno scelto della settimana corrente (operativo: prima delle 06:00 è ancora il giorno prima) e l'ora scelta, a Santiago
  const now = Date.now(), base = new Date(now);
  const wd = { Mon: 'L', Tue: 'M', Wed: 'X', Thu: 'J', Fri: 'V', Sat: 'S', Sun: 'D' }[oraSantiago(now).weekday];
  const diff = (DIAS.indexOf(S.dia || wd) - DIAS.indexOf(wd));
  const [h, m] = String(S.hora || '12:00').split(':').map(Number);
  let t = base.getTime() + diff * 864e5;
  const p = oraSantiago(t), off = (Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute) - Math.floor(t / 6e4) * 6e4);
  let ms = Date.UTC(+p.year, +p.month - 1, +p.day, h, m) - off;
  if (h < 6) ms += 864e5;   // 00:00–05:59 appartiene alla notte del giorno scelto
  return ms;
}
function risposta() { return strumentiAdesso({ strumenti: vigenti(), parti: partiVigenti(), gesti: [], carta: S.carta, ago86: [], local: 'BKS', now: adesso() }); }
/* la forma della casa: ogni salvataggio è una riga nuova, si legge l'ultima per chiave (strumento_vigente) */
function vigenti() { const m = {}; for (const r of S.strumenti) m[r.id_strumento] = r; return Object.values(m).filter((r) => !r.borrado); }
function partiVigenti() { const m = {}; for (const r of S.parti) m[r.id_strumento + '|' + r.id_producto] = r; return Object.values(m).filter((r) => !r.borrado); }
const riga = (id) => vigenti().find((r) => r.id_strumento === id);
const nomeP = (id) => (S.carta[id] ? S.carta[id].nombre : id);

function finestra(r) {
  const d = (r.dias && r.dias.length ? (r.dias.length === 7 ? 'Todos' : r.dias.map((x) => DIA_N[x] || x).join(' · ')) : 'Todos los días');
  const h = r.desde && r.hasta ? r.desde + '–' + r.hasta : 'todo el día';
  const f = r.fecha_desde || r.fecha_hasta ? ' · ' + (r.fecha_desde || '…') + ' → ' + (r.fecha_hasta || '…') : '';
  return d + ' · ' + h + f;
}
function statoHTML(s) {
  if (s.visible) return '<span class="st si">● Visible ahora</span>';
  const t = PERCHE[s.perche] || s.perche || 'No visible';
  return '<span class="st ' + (s.perche === 'spento' ? 'ap' : /invalid|sconosciuto|sin_precio/.test(s.perche) ? 'ma' : 'no') + '">' + esc(t) + '</span>';
}
const passa = (r) => S.filtro === 'todo' || (S.filtro === 'promo' ? ['multiplo', 'precio_fijo'].includes(r.tipo) : S.filtro === 'evento' ? ['evento', 'escena'].includes(r.tipo) : r.tipo === S.filtro);

function anteprimaHTML(R) {
  const car = slotAdesso(R, ['evento', 'escena'], adesso(), vigenti());
  const cr = car ? riga(car.id) : null, tx = cr && cr.textos && cr.textos.es || {}, md = cr && cr.media || {};
  const carH = cr ? '<div class="car">' + (md.poster || md.imagen ? '<img src="' + esc(md.poster || md.imagen) + '" alt="">' : '') +
      '<div class="ct"><small>' + esc(tx.eyebrow || TIPO[cr.tipo]) + '</small><b>' + esc(tx.titulo || cr.nombre_visible) + '</b><span>' + esc(tx.sub || '') + '</span></div></div>' +
      '<div class="nota" style="margin-top:6px">Gana <b>' + esc(cr.nombre_visible) + '</b>: la ventana más corta ahora, luego la prioridad, luego el más reciente. Nunca el orden de las filas.</div>'
    : '<div class="vuoto">Ningún evento ni escena visible a esta hora.</div>';
  const dest = R.strumenti.filter((s) => s.visible && s.tipo === 'destacados');
  const destH = dest.length ? '<div class="lst">' + dest.map((s) => s.parti.filter((p) => p.vende).map((p) => '<div class="lr"><span>' + esc(nomeP(p.id_producto)) + '</span><span><i>' + esc(s.nombre) + '</i></span></div>').join('')).join('') + '</div>'
    : '<div class="vuoto">Sin destacados visibles.</div>';
  const cam = Object.entries(R.prodotti || {}).filter(([, v]) => v.strumento || v.multiplo || v.recargo || v.badge);
  const camH = cam.length ? '<div class="lst">' + cam.map(([id, v]) => '<div class="lr"><span>' + esc(nomeP(id)) + ' <i>' + esc(v.badge || '') + '</i></span><span>' +
      (v.multiplo ? v.multiplo.lleva + 'x' + v.multiplo.paga : v.precio !== v.listino ? '<s>' + clp(v.listino) + '</s> ' + clp(v.precio) : clp(v.precio)) + '</span></div>').join('') + '</div>'
    : '<div class="vuoto">Ningún producto cambia de precio ni lleva promo ahora.</div>';
  return '<div class="prev"><div class="box"><h2>Ahora el carrusel muestra</h2>' + carH + '</div><div class="box"><h2>Ahora en destacados</h2>' + destH + '</div><div class="box"><h2>Productos con promo ahora (' + cam.length + ')</h2>' + camH + '</div></div>';
}
function cardsHTML(R) {
  const per = Object.fromEntries(R.strumenti.map((s) => [s.id, s]));
  const L = vigenti().filter(passa).sort((a, b) => (a.orden == null ? 1e9 : a.orden) - (b.orden == null ? 1e9 : b.orden) || a.nombre_visible.localeCompare(b.nombre_visible));
  if (!L.length) return '<div class="box vuoto">Nada en este filtro.</div>';
  return '<div class="cards">' + L.map((r, i) => {
    const s = per[r.id_strumento] || { visible: false, perche: '' }, np = partiVigenti().filter((p) => p.id_strumento === r.id_strumento).length;
    const prezzo = r.tipo === 'menu' && r.precios && r.precios.length ? ' · ' + r.precios.map((p) => clp(p.precio)).join(' / ') : r.tipo === 'recargo' ? ' · ×' + r.factor : r.tipo === 'multiplo' && r.multiplo ? ' · paga ' + r.multiplo.paga + ', lleva ' + r.multiplo.lleva : '';
    return '<div class="cd' + (S.sel === r.id_strumento ? ' sel' : '') + '" data-a="apri" data-k="' + esc(r.id_strumento) + '" role="button" tabindex="0">' +
      '<div class="ch"><div><div class="tp">' + esc(TIPO[r.tipo] || r.tipo) + esc(prezzo) + '</div><b>' + esc(r.nombre_visible) + '</b></div>' +
      '<button class="sw' + (r.activo ? ' on' : '') + '" data-a="interr" data-k="' + esc(r.id_strumento) + '" aria-label="Encender o apagar" aria-pressed="' + !!r.activo + '"></button></div>' +
      '<div class="fin">' + esc(finestra(r)) + '</div>' + (r.grupo ? '<span class="gr">dentro de ' + esc((riga(String(r.grupo).toUpperCase()) || {}).nombre_visible || r.grupo) + '</span>' : '') +

  const j = await (await fetch('./propuestas/seme_BKS.json', { cache: 'no-store' })).json();
  S.strumenti = j.strumenti; S.parti = j.parti; S.carta = j.carta;
  try { const m = JSON.parse(localStorage.getItem(LS) || 'null'); if (m && Array.isArray(m.strumenti)) { S.strumenti = m.strumenti; S.parti = m.parti || S.parti; S.hist = m.hist || []; } } catch (e) { /* il seme */ }
  pinta();
  setInterval(() => { if (!S.dia && !S.hora && !document.activeElement.closest('#det')) pinta(); }, 60000);
} catch (e) { document.getElementById('app').innerHTML = '<div class="box err">No se pudo leer el seme: ' + esc(e.message) + '</div>'; }
