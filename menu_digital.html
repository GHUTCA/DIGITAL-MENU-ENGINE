<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pinsita · Menú</title>
  <!-- v3 · mer 11-nov-2026 · 📖 MENU BKS V32 · ordine di Alberto: «QR nuovo dentro oggi, QR vecchio chiuso».
       La radice (sticker ?mesa=N) e il vecchio menu_digital.html mandano al menù nuovo menu.html.
       ?local= (o ?l=) diventa ?l=, BKS se manca; mesa, depto, kiosco e l'hash passano intatti.
       Il vecchio menu_digital.html vive nella storia git (commit prima di questo). -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search || ''), o = new URLSearchParams();
      var l = (q.get('l') || q.get('local') || 'BKS').toUpperCase();
      o.set('l', /^[A-Z]{2,6}$/.test(l) ? l : 'BKS');
      q.forEach(function (v, k) { if (k !== 'l' && k !== 'local') o.set(k, v); });
      location.replace('menu.html?' + o.toString() + (location.hash || ''));
    })();
  </script>
</head>
<body style="font-family:system-ui,sans-serif;background:#0A0806;color:#eee;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
  <p>Abriendo el menú… <a href="menu.html?l=BKS" style="color:#E8B04B">toca aquí si no carga</a></p>
</body>
</html>
