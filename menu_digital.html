     menu_digital.html · v1.10 · 25-apr-2026 · Sessione S3 (fix critico)
     ════════════════════════════════════════════════════════════════════
     CHANGELOG v1.7 → v1.10
     - RIMOSSO: DEMO_BRAND, DEMO_CATEGORIES, DEMO_PRODUCTS, loadDemoData()
       (placeholder "PINSA Candelaria + Açaí Bowl" che si attivava su
        cold start GAS facendo apparire prodotti sbagliati ai clienti)
     - AGGIUNTO: KNOWN_LOCALS = mappa minima brand di safety net
     - AGGIUNTO: validateLocal() = blocca early se ?local= mancante/sconosciuto
     - AGGIUNTO: pingGAS() = warm-up parallelo allo skeleton (sveglia GAS)
     - AGGIUNTO: retry con backoff su getConfig (timeout 10s × 3 tentativi)
     - AGGIUNTO: showErrorState() = UI errore con brand corretto + Reintentar
     - AGGIUNTO: showInvalidLocal() = UI errore QR malformato
     - AGGIUNTO: purgeOldLangKey() + chiave 'menu_lang_user_choice'
       (lingua spagnolo SEMPRE all'avvio · localStorage solo per scelta
        esplicita utente · brand.default_lang vince post-fetch GAS)
     - DESIGN FIX (4 in 1):
       1. Faja-tabs nascoste su BKS (theme-dark) · su PINSA invariate
       2. Waveform 10px → 28px · 20 barre min-w 6px · presenza mobile reale
       3. Microbar v1 · Comandante DJ a sx con disco rotante + slogan
          corsivo coi puntini al centro + BPM micro a dx · slogan ES
          NON traducibile (Empieza piola/Bacán acá/Acá se arma/La noche
          prende) · vende il prodotto, non se stesso
       4. Label '♪ BKS RHYTHM' ripristinata come contesto discreto
     - DECISIONE PRODOTTO v1.10 finale:
       Toggle ✦ All RIMOSSO definitivamente dalla UI cliente · curatela
       del momento è unica realtà · prodotti fuori curatela accessibili
       solo via richiesta al JL (pannello admin · S5+)
     - REDESIGN ZONA PRODOTTI (7 fix coordinati · sessione lunga):
       1. Card prodotto v2 compatta (220px → 80-90px alta)
          · layout horizontale: foto 50px + corpo + prezzo/campanella
          · descrizione 1 riga troncata · risultato: 3 prod/schermata
       2. FAB campanella 52×52 in basso destra · sostituisce
          sticky-call-bar full-width che divorava 80px e copriva card
          · animazione pulse discreta · sopra bottom-nav
       3. Macro-groups: 4 sempre visibili · count=0 → disabled grigio
          (NON nascosto · stabilità interfaccia)
       4. Padding-bottom mainContent 130px · no collisione card/FAB
       5. Tab categoria: 'Pizzas/Burgers' con slash invece di '& '
          per non troncarsi su mobile
       6. Cat header gigante 'Fondos' (font Fraunces 24px) → breadcrumb
          micro 9px maiuscoletto 'FONDOS · 3' (~16px alto vs 50px)
       7. Card-name 15px → 14px · card-desc 1 riga · gap 12px → 8px
     - PRESERVATO: tutto il resto (ritmi, promos, llamar mesero, club, sheet)
     ════════════════════════════════════════════════════════════════════ -->

/* ══════════════════════════════════════════
   WHITE-LABEL DESIGN TOKENS
   ══════════════════════════════════════════ */
:root {
  --brand-primary: #1A1A2E;
  --brand-accent: #E94560;
  --brand-bg: #F8F8F8;
  --brand-surface: #FFFFFF;
  --brand-text: #2C2C2C;
  --brand-text-muted: #888;
  --brand-border: rgba(0,0,0,0.09);
  --rhythm-bg: #FFFFFF;
  --rhythm-label: #888;
  --rhythm-chip-bg: #F8F8F8;
  --rhythm-chip-text: #888;
  --group-bg: #FFFFFF;
  --group-inactive-bg: #F5F5F5;
  --group-inactive-text: #888;
  --brand-name: "Menú Digital";
  --brand-font: 'Outfit', sans-serif;
  --badge-nuevo: #22C55E;
  --badge-popular: #F59E0B;
  --badge-vegano: #84CC16;
  --badge-singluten: #60A5FA;
  --badge-chef: #F97316;
  --badge-temporada: #A78BFA;
  --badge-agotado: #94A3B8;
  --transition: 0.2s ease;
}

body.theme-dark {
  --brand-bg: #0D0D1A;
  --brand-surface: #15152A;
  --brand-text: #F5F5F5;
  --brand-text-muted: rgba(255,255,255,0.55);
  --brand-border: rgba(255,255,255,0.09);
  --rhythm-bg: #0D0D1A;
  --rhythm-label: rgba(255,255,255,0.4);
  --rhythm-chip-bg: rgba(255,255,255,0.06);
  --rhythm-chip-text: rgba(255,255,255,0.5);
  --group-bg: #15152A;
  --group-inactive-bg: rgba(255,255,255,0.06);
  --group-inactive-text: rgba(255,255,255,0.55);
}

/* Dark mode badges */
body.theme-dark .badge-nuevo    { background:rgba(34,197,94,0.20); color:#4ade80 }
body.theme-dark .badge-popular  { background:rgba(245,158,11,0.22); color:#fbbf24 }
body.theme-dark .badge-vegano   { background:rgba(132,204,22,0.20); color:#a3e635 }
body.theme-dark .badge-singluten{ background:rgba(96,165,250,0.22); color:#93c5fd }
body.theme-dark .badge-chef     { background:rgba(249,115,22,0.22); color:#fb923c }
body.theme-dark .badge-temporada{ background:rgba(167,139,250,0.22); color:#c4b5fd }
body.theme-dark .badge-agotado  { background:rgba(148,163,184,0.25); color:#cbd5e1 }
body.theme-dark .badge-member   { background:rgba(233,69,96,0.25); color:#fb7185 }
body.theme-dark .wf-bar { background:linear-gradient(to top, var(--brand-accent), rgba(233,69,96,0.4)); filter: drop-shadow(0 0 3px rgba(233,69,96,0.6)); border-radius:2px; }
body.theme-dark .rhythm-label { color: rgba(255,255,255,0.55); letter-spacing: 3px; font-weight: 500; }
body.theme-dark .product-card { border-color: rgba(255,255,255,0.08); }
body.theme-dark .product-card:active { border-color: var(--brand-accent); box-shadow: 0 0 0 1px rgba(233,69,96,0.3); }
body.theme-dark .product-card.nuevo-highlight { border-color: #4ade80; box-shadow: 0 0 0 2px rgba(74,222,128,0.25), 0 0 20px rgba(74,222,128,0.15); }
body.theme-dark .cat-tab { color: rgba(255,255,255,0.45) }
body.theme-dark .cat-tab.active { color: #fff; border-bottom-color: var(--brand-accent); }
body.theme-dark .cat-sticky { background: var(--brand-surface); border-bottom-color: rgba(255,255,255,0.06); box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
body.theme-dark .cat-header-name { color: rgba(255,255,255,0.92) }
body.theme-dark .card-price { color: #ff6b8a; text-shadow: 0 0 8px rgba(233,69,96,0.2); }
body.theme-dark .sheet-price { color: #ff6b8a }
body.theme-dark #bottomNav { background: var(--brand-surface); border-top-color: rgba(255,255,255,0.08); }
body.theme-dark .bnav-btn { color: rgba(255,255,255,0.5) }
body.theme-dark .bnav-btn.active { color: #ff6b8a }
body.theme-dark .search-inner { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }
body.theme-dark .search-inner:focus-within { border-color: var(--brand-accent); background: rgba(255,255,255,0.08); }
body.theme-dark #searchInput { color: #fff }
body.theme-dark #searchInput::placeholder { color: rgba(255,255,255,0.35) }
body.theme-dark #detailSheet { background: var(--brand-surface); box-shadow: 0 -10px 40px rgba(0,0,0,0.6); }
body.theme-dark .sheet-handle { background: rgba(255,255,255,0.2) }
body.theme-dark .sheet-name { color: rgba(255,255,255,0.95) }
body.theme-dark .sheet-desc { color: rgba(255,255,255,0.65) }
body.theme-dark .lang-dropdown { background: var(--brand-surface); border-color: rgba(255,255,255,0.12); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
body.theme-dark #groupBar { border-bottom-color: rgba(255,255,255,0.08) }
body.theme-dark .group-chip { border: 1px solid transparent; }
body.theme-dark .group-chip.active { background: var(--brand-accent); border-color: rgba(255,255,255,0.1); box-shadow: 0 4px 16px rgba(233,69,96,0.35); }
/* v1.10 · waveform unificato a 22px (variante B) — base CSS gestisce già altezza/gap/min-width */

/* v1.10 · DJ disc · disco rotante che firma il "DJ sta suonando ora" */
.dj-disc{
  width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle,rgba(233,69,96,0.45) 35%,#1A1A2E 35%,#1A1A2E 38%,rgba(255,255,255,0.18) 40%,#1A1A2E 90%);
  border:1px solid rgba(255,255,255,0.18);
  flex-shrink:0;
  animation:djSpin 3s linear infinite;
  filter:drop-shadow(0 0 4px rgba(233,69,96,0.35));
}
@keyframes djSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.group-chip-promos { background: linear-gradient(135deg, rgba(251,191,36,0.18), rgba(233,69,96,0.15)) !important; border: 1px solid rgba(251,191,36,0.35) !important; animation: goldPulse 2.5s ease-in-out infinite; }
.group-chip-promos.active { background: linear-gradient(135deg, #fbbf24, #d97706) !important; color: #fff !important; border-color: #fbbf24 !important; animation: none; }
@keyframes goldPulse { 0%,100% { box-shadow: 0 0 0 rgba(251,191,36,0); } 50% { box-shadow: 0 0 14px rgba(251,191,36,0.4); } }
body.theme-dark .group-chip-promos { color: rgba(255,255,255,0.85); }
body.theme-dark .product-card.has-promo { border-color: rgba(251,191,36,0.45); box-shadow: 0 0 0 1px rgba(251,191,36,0.15), 0 4px 20px rgba(251,191,36,0.10); }
body.theme-dark .product-card.has-promo:active { border-color: #fbbf24; box-shadow: 0 0 0 2px rgba(251,191,36,0.4); }
.product-card.has-promo .card-img-wrap { background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(233,69,96,0.10)); }

/* ══════════════════════════════════════════ RESET & BASE ══════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--brand-font);background:var(--brand-bg);color:var(--brand-text);min-height:100dvh;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:inherit;border:none;background:none;padding:0}
a{text-decoration:none;color:inherit}

/* ══════════════════════════════════════════ LOADING ══════════════════════════════════════════ */
#loadingScreen{position:fixed;inset:0;z-index:999;background:var(--brand-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 0.5s ease;}
#loadingScreen.out{opacity:0;pointer-events:none}
.ld-logo{font-family:'Fraunces',serif;font-size:36px;font-weight:300;color:#fff;letter-spacing:-1px;}
.ld-logo span{color:var(--brand-accent)}
.ld-bar-wrap{width:120px;height:1px;background:rgba(255,255,255,0.15)}
.ld-bar{height:1px;background:var(--brand-accent);width:0%;transition:width 0.4s ease}
.ld-text{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.35)}

/* ══════════════════════════════════════════ ERROR STATE (v1.10) ══════════════════════════════════════════ */
#errorState{
  display:none;position:fixed;inset:0;z-index:998;
  background:var(--brand-primary);
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;gap:16px;
  color:#fff;
}
#errorState.show{display:flex}
.es-emoji{font-size:64px;opacity:0.85}
.es-brand{
  font-family:'Fraunces',serif;font-size:28px;font-weight:300;letter-spacing:-0.5px;
  color:#fff;margin-bottom:4px;
}
.es-brand span{color:var(--brand-accent)}
.es-title{
  font-size:18px;font-weight:600;letter-spacing:-0.2px;
  color:rgba(255,255,255,0.95);max-width:320px;line-height:1.3;
}
.es-subtitle{
  font-size:13px;color:rgba(255,255,255,0.55);
  max-width:300px;line-height:1.5;margin-bottom:8px;
}
.es-btn{
  background:var(--brand-accent);color:#fff;
  padding:14px 36px;border-radius:28px;
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:0.3px;
  border:none;cursor:pointer;
  box-shadow:0 6px 20px rgba(233,69,96,0.4);
  transition:transform var(--transition);
}
.es-btn:active{transform:scale(0.96)}
.es-mesa{
  font-size:11px;color:rgba(255,255,255,0.35);
  letter-spacing:1.5px;text-transform:uppercase;
  margin-top:12px;
}

/* ══════════════════════════════════════════ HEADER ══════════════════════════════════════════ */
#header{position:sticky;top:0;z-index:100;background:var(--brand-primary);color:#fff;}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:54px;max-width:480px;margin:0 auto;}
.brand-logo-wrap{display:flex;align-items:center;gap:10px}
.brand-logo-img{height:32px;width:auto;border-radius:4px}
.brand-logo-text{font-family:'Fraunces',serif;font-size:20px;font-weight:300;letter-spacing:-0.5px;color:#fff;}
.header-right{display:flex;align-items:center;gap:8px}
/* v1.10 · Header chips equiparati · Mesa + Lingua come fratelli visivi
   Stessa altezza (28px), stesso radius, stessa opacità sfondo.
   Distinzione solo nel contenuto: numero tavolo vs bandiera+freccia. */
.lang-btn{
  position:relative;display:flex;align-items:center;gap:4px;
  height:28px;padding:0 10px;border-radius:14px;
  background:rgba(255,255,255,0.12);
  color:rgba(255,255,255,0.9);
  border:none;cursor:pointer;
  transition:background var(--transition);
}
.lang-btn:active{background:rgba(255,255,255,0.2)}
.lang-flag{font-size:15px;line-height:1}
.lang-arrow{font-size:9px;opacity:0.55;line-height:1;margin-left:1px}
.lang-dropdown{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--brand-primary);border:1px solid rgba(255,255,255,0.12);border-radius:10px;overflow:hidden;min-width:140px;z-index:200;}
.lang-dropdown.open{display:block}
.lang-option{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;color:rgba(255,255,255,0.75);cursor:pointer;transition:background var(--transition);}
.lang-option:hover,.lang-option.active{background:rgba(255,255,255,0.08);color:#fff;}
.lang-option .flag{font-size:16px}
#memberBanner{display:none;background:linear-gradient(135deg,var(--brand-accent),#c73050);padding:8px 16px;text-align:center;font-size:12px;color:#fff;font-weight:500;}
#memberBanner.show{display:block}

/* ══════════════════════════════════════════ FAJA / RHYTHM ══════════════════════════════════════════ */
#fajaBar{position:sticky;top:54px;z-index:98;background:var(--rhythm-bg);border-bottom:1px solid var(--brand-border);overflow:hidden;box-shadow:0 1px 0 var(--brand-border);}
.rhythm-label{font-size:9px;color:var(--rhythm-label);letter-spacing:2px;text-transform:uppercase;padding:8px 16px 0;max-width:480px;margin:0 auto;display:none;}
/* v1.10 · rhythm-label rimossa dal flow visibile · resta solo per fallback se serve in futuro */
body.theme-dark .rhythm-label{display:none}
/* v1.10 · Waveform variante B · 22px · 24 barre · drop-shadow potenziato · firma musicale del momento */
/* v1.10 · Waveform mobile-first · 20 barre più solide · variante B+
   Su mobile (380px) le barre 2-3px sparivano per sub-pixel rendering.
   Soluzione: meno barre + più larghe + gap maggiore + meno glow.
   Risultato: barre visibili su mobile, eleganti su desktop.
   v1.10-final · +1mm spessore (barre 6px · altezza 28px) per più presenza. */
.rhythm-waveform{display:none;align-items:flex-end;gap:3px;height:28px;padding:8px 16px 12px;max-width:480px;margin:0 auto;}
body.theme-dark .rhythm-waveform{display:flex}
.wf-bar{flex:1;min-width:6px;background:linear-gradient(to top,var(--brand-accent) 0%,var(--brand-accent) 60%,rgba(233,69,96,0.55) 100%);border-radius:2px;filter:drop-shadow(0 0 2px rgba(233,69,96,0.7));transform-origin:bottom;animation:pulse 0.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scaleY(0.55)}50%{transform:scaleY(1)}}
.faja-scroll{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;max-width:480px;margin:0 auto;}
/* v1.10 · faja-scroll nascosto su BKS (dark mode) · il Ritmo è il vero filtro temporale · su PINSA invariato */
body.theme-dark .faja-scroll{display:none}
.faja-scroll::-webkit-scrollbar{display:none}
.faja-chip{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.3px;background:var(--rhythm-chip-bg);border:1.5px solid var(--brand-border);color:var(--rhythm-chip-text);transition:all var(--transition);cursor:pointer;}
.faja-chip.active{background:var(--brand-primary);border-color:var(--brand-primary);color:#fff;}
.faja-chip.current{border-color:var(--brand-accent);color:var(--brand-accent);}
.faja-chip.current.active{background:var(--brand-accent);border-color:var(--brand-accent);color:#fff;}

/* ══════════════════════════════════════════ SEARCH ══════════════════════════════════════════ */
#searchBar{background:var(--brand-surface);border-bottom:1px solid var(--brand-border);padding:10px 16px;max-width:480px;margin:0 auto;display:block;}
.search-inner{display:flex;align-items:center;gap:8px;background:var(--brand-bg);border:1.5px solid var(--brand-border);border-radius:10px;padding:8px 12px;transition:border-color var(--transition);}
.search-inner:focus-within{border-color:var(--brand-primary)}
.search-icon{font-size:14px;opacity:0.4;flex-shrink:0}
#searchInput{flex:1;border:none;background:none;font-family:inherit;font-size:14px;color:var(--brand-text);outline:none;}
#searchInput::placeholder{color:var(--brand-text-muted)}
#searchClear{font-size:16px;opacity:0.4;display:none;padding:2px;transition:opacity var(--transition);}
#searchClear.show{display:block}
#searchClear:active{opacity:0.8}

/* ══════════════════════════════════════════ MACRO-GROUPS ══════════════════════════════════════════ */
#groupBar{display:none;background:var(--group-bg);border-bottom:1px solid var(--brand-border);padding:12px 16px;max-width:480px;margin:0 auto;}
#groupBar.show{display:block}
.group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.group-grid.g-2{grid-template-columns:repeat(2,1fr)}
.group-grid.g-4{grid-template-columns:repeat(4,1fr)}
.group-chip{padding:10px 6px;border-radius:10px;background:var(--group-inactive-bg);color:var(--group-inactive-text);text-align:center;cursor:pointer;transition:all var(--transition);border:none;font-family:inherit;}
.group-chip:active{transform:scale(0.96)}
.group-chip.active{background:var(--brand-primary);color:#fff;}
/* v1.10 · macro-group disabled (count=0) · visibile ma non cliccabile */
.group-chip.disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;}
.group-chip.disabled:active{transform:none}
body.theme-dark .group-chip.disabled{opacity:0.35}
.group-chip-emoji{font-size:16px;display:block;margin-bottom:2px}
.group-chip-name{font-size:10px;font-weight:600;display:block}
.group-chip-count{font-size:8px;opacity:0.6;display:block;margin-top:1px}

/* ══════════════════════════════════════════ MAIN ══════════════════════════════════════════ */
/* v1.10 · padding-bottom calibrato per non collidere col FAB campanella in basso-destra
   FAB occupa l'angolo destro · 90px = bottom-nav (56px) + spazio FAB + respiro */
#mainContent{max-width:480px;margin:0 auto;padding-bottom:130px;}
.cat-sticky{position:sticky;top:160px;z-index:96;background:var(--brand-surface);border-bottom:1px solid var(--brand-border);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.cat-tabs{display:flex;gap:4px;padding:0 16px;overflow-x:auto;scrollbar-width:none;}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:10px 12px;font-size:12px;font-weight:500;color:var(--brand-text-muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all var(--transition);}
.cat-tab.active{color:var(--brand-primary);border-bottom-color:var(--brand-accent);}
.cat-tab-emoji{font-size:14px}
/* v1.10 · Cat header compatto · breadcrumb invece di titolone serif */
.cat-header{padding:8px 16px 4px;display:flex;align-items:center;gap:6px;}
.cat-header-emoji{font-size:11px;opacity:0.7}
.cat-header-name{font-family:'Outfit',sans-serif;font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--brand-text-muted);}
.cat-header-count{font-size:9px;color:var(--brand-text-muted);margin-left:auto;letter-spacing:0.5px;}
body.theme-dark .cat-header-name{color:rgba(255,255,255,0.45)}
body.theme-dark .cat-header-count{color:rgba(255,255,255,0.4)}

/* ══════════════════════════════════════════ PRODUCT CARD v2 ══════════════════════════════════════════ */
/* v1.10 · Card v2 compatta · 3 prodotti per schermata invece di 1.5
   Layout: foto piccola sx (50px) · titolo+badge+descr centro · prezzo+campanella dx
   Risultato: ~80-90px altezza vs ~220px versione v1 */
.product-list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.product-card{background:var(--brand-surface);border-radius:12px;border:1px solid var(--brand-border);overflow:hidden;position:relative;transition:transform var(--transition), box-shadow var(--transition);cursor:pointer;}

.product-card.agotado{opacity:0.55}
.product-card.nuevo-highlight{border-color:rgba(34,197,94,0.45);box-shadow:0 0 0 1px rgba(34,197,94,0.15);}

.card-img-wrap{width:50px;height:50px;flex-shrink:0;background:var(--brand-bg);position:relative;overflow:hidden;border-radius:8px;}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:center;}
.card-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0.5;}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card-badges{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:0}
.badge{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:8px;font-size:8px;font-weight:700;letter-spacing:0.7px;text-transform:uppercase;}
.badge-nuevo{background:rgba(34,197,94,0.15);color:#16a34a}
.badge-popular{background:rgba(245,158,11,0.15);color:#d97706}
.badge-vegano{background:rgba(132,204,22,0.15);color:#65a30d}
.badge-singluten{background:rgba(96,165,250,0.15);color:#2563eb}
.badge-chef{background:rgba(249,115,22,0.15);color:#ea580c}
.badge-temporada{background:rgba(167,139,250,0.15);color:#7c3aed}
.badge-agotado{background:rgba(148,163,184,0.15);color:#64748b}
.badge-member{background:rgba(233,69,96,0.15);color:#be185d}
@keyframes newPulse{0%,100%{opacity:1}50%{opacity:0.7}}

.card-name{font-size:14px;font-weight:600;color:var(--brand-text);line-height:1.2;}
.card-name.agotado-text{text-decoration:line-through;color:var(--brand-text-muted)}
.card-desc{font-size:11px;color:var(--brand-text-muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.card-price{font-size:14px;font-weight:700;color:var(--brand-accent);white-space:nowrap;}
.card-price-member{font-size:10px;font-weight:500;text-decoration:line-through;color:var(--brand-text-muted);}
.card-price-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:0;line-height:1.2;}
.agotado-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.55);border-radius:12px;}
.product-card.agotado .agotado-overlay{display:flex}
.agotado-label{background:rgba(100,116,139,0.9);color:#fff;padding:3px 12px;border-radius:14px;font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;}

/* CARD CTA v2 (v1.10) · campanella outline integrata col prezzo */
.card-call-btn{

/* CONFIRM SHEET */
#confirmOverlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.55);opacity:0;transition:opacity 0.25s ease;}
#confirmOverlay.open{display:block;opacity:1}

/* DETAIL SHEET */

.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--brand-border);margin:12px auto 0;}

.sheet-img img{width:100%;height:100%;object-fit:cover}
.sheet-img-ph{width:100%;height:220px;display:flex;align-items:center;justify-content:center;background:var(--brand-bg);font-size:64px;opacity:0.15;}
.sheet-body{padding:20px 20px 30px}

.sheet-desc{font-size:14px;line-height:1.6;color:var(--brand-text-muted);margin-bottom:16px;}

#upsellSection{display:none;border-top:1px solid var(--brand-border);padding-top:16px;margin-top:4px;}

/* EMPTY / TOAST / STICKY CALL / BOTTOM NAV / MESA */
#emptyState{display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;text-align:center;}
#emptyState.show{display:flex}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brand-primary);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:all 0.3s ease;z-index:500;white-space:nowrap;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* v1.10 · FAB campanella · CTA "chiama cameriere generico"
   Sostituisce il vecchio sticky-call-bar full-width che divorava 80px
   in basso copridendo le card. Adesso è un cerchio 50px in basso-destra,
   sopra il bottom-nav, con animazione pulse discreta per attirare attenzione
   senza essere invadente. */
#stickyCallBar{
  display:none;
  position:fixed;
  bottom:calc(74px + env(safe-area-inset-bottom));
  right:14px;
  z-index:99;
  pointer-events:none;
}
#stickyCallBar.show{display:block}
.sticky-call-btn{
  pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
  width:52px;height:52px;
  border-radius:50%;
  background:var(--brand-accent);
  color:#fff;
  border:none;cursor:pointer;
  box-shadow:0 8px 22px rgba(233,69,96,0.5), 0 0 0 4px rgba(233,69,96,0.12);
  transition:transform var(--transition);
  animation:fabPulse 2.5s ease-in-out infinite;
}
.sticky-call-btn:active{transform:scale(0.92)}
.sticky-call-btn-icon{font-size:22px}
.sticky-call-btn-text{display:none}
@keyframes fabPulse{
  0%,100%{box-shadow:0 8px 22px rgba(233,69,96,0.5), 0 0 0 4px rgba(233,69,96,0.12)}
  50%{box-shadow:0 8px 22px rgba(233,69,96,0.5), 0 0 0 10px rgba(233,69,96,0.04)}
}
body.theme-dark .sticky-call-btn{
  box-shadow:0 8px 24px rgba(233,69,96,0.6), 0 0 0 4px rgba(233,69,96,0.18);
}
body.theme-dark @keyframes fabPulse{
  0%,100%{box-shadow:0 8px 24px rgba(233,69,96,0.6), 0 0 0 4px rgba(233,69,96,0.18)}
  50%{box-shadow:0 8px 24px rgba(233,69,96,0.6), 0 0 0 10px rgba(233,69,96,0.06)}
}
#bottomNav{position:fixed;bottom:0;left:0;right:0;background:var(--brand-surface);border-top:1px solid var(--brand-border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100;}
.bnav-inner{display:flex;align-items:center;justify-content:space-around;max-width:480px;margin:0 auto;}
.bnav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 16px;border-radius:8px;font-size:10px;font-weight:500;color:var(--brand-text-muted);transition:color var(--transition);}

.bnav-icon{font-size:20px}
#mesaBadge{

}

.mesa-icon{font-size:13px;line-height:1}

.skeleton{background:linear-gradient(90deg,var(--brand-border) 25%,rgba(0,0,0,0.04) 50%,var(--brand-border) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;}

if(!TRANSLATIONS[LANG_CODE]) LANG_CODE = 'es';
function getLang(k){ return (TRANSLATIONS[LANG_CODE]||TRANSLATIONS.es)[k] || k; }

function getCatName(catId){
  const key = 'cat_' + catId.toLowerCase().replace(/[^a-z]/g,'');
  const t = TRANSLATIONS[LANG_CODE] || TRANSLATIONS.es;
  if(t[key]) return t[key];
  return prettifyCategoryName(catId);
}
function prettifyCategoryName(id){
  if(!id) return '';
  // v1.10 · accentFix include override per categorie composte con nome troppo lungo
  // Default usa " & " ma per casi specifici uso " / " più corto o nomi alternativi
  const accentFix = {
    'nino':'Niño','anos':'Años','cafe':'Café','jugos':'Jugos',
    'acompanamientos':'Acompañamientos','espana':'España',
    'pizzas_burger':'Pizzas/Burgers',
    'pizzas_burgers':'Pizzas/Burgers',
  };
  const low = id.toLowerCase();
  if(accentFix[low]) return accentFix[low];
  return id.split('_').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' & ');
}
function toTitleCase(str){
  if(!str) return str;
  return str.toLowerCase().replace(/(?:^|\s|-)\S/g, c => c.toUpperCase()).replace(/\b([A-Z]{1,3})\b/g, m => m);
}

function applyBrand(b){
  if(!b) return;
  Object.assign(BRAND, b);
  document.title = BRAND.name + ' · Menú';
  const r = document.documentElement.style;
  r.setProperty('--brand-primary', BRAND.color_primary);
  r.setProperty('--brand-accent',  BRAND.color_accent);
  if(BRAND.color_bg) r.setProperty('--brand-bg', BRAND.color_bg);
  if(BRAND.logo_url){
    document.getElementById('brandLogoImg').src = BRAND.logo_url;
    document.getElementById('brandLogoImg').classList.remove('hidden');
    document.getElementById('brandLogoText').classList.add('hidden');
  } else {
    document.getElementById('brandLogoText').textContent = BRAND.logo_emoji + '\u00A0' + BRAND.name;
    document.getElementById('brandLogoText').classList.remove('hidden');
    document.getElementById('brandLogoImg').classList.add('hidden');
  }
  const faviconTag = document.getElementById('faviconTag');
  if(BRAND.favicon_url){
    faviconTag.href = BRAND.favicon_url;
  } else {
    const enc = encodeURIComponent(BRAND.logo_emoji || '🍽️');
    const col = encodeURIComponent(BRAND.color_primary || '#1A1A2E');
    faviconTag.href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='${col}'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='20'>${enc}</text></svg>`;
  }
  document.getElementById('ldBrand').innerHTML = `<span>${BRAND.logo_emoji}</span> ${BRAND.name}`;
  // v1.10 · Risoluzione lingua post-brand:
  //   1. ?lang=xx URL (deliberato chi ha fatto il QR) — vince su tutto
  //   2. localStorage 'menu_lang_user_choice' — scelta esplicita cliente
  //   3. brand.default_lang dal GAS — lingua predefinita del locale
  //   4. 'es' fallback finale
  const urlLang = URL_PARAMS.get('lang');
  let userChoice = null;
  try { userChoice = localStorage.getItem('menu_lang_user_choice'); } catch(e){}
  if(urlLang && TRANSLATIONS[urlLang]){
    LANG_CODE = urlLang;
  } else if(userChoice && TRANSLATIONS[userChoice]){
    LANG_CODE = userChoice;
  } else if(BRAND.default_lang && TRANSLATIONS[BRAND.default_lang]){
    LANG_CODE = BRAND.default_lang;
  } else {
    LANG_CODE = 'es';
  }
}

// Genera 24 barre per il waveform BKS. Le altezze sono pre-calcolate per dare

function initWaveform(){
  const wf = document.getElementById('rhythmWaveform');
  if(!wf) return;
  // v1.10 · 20 barre (era 24) · più larghe e visibili su mobile
  // Pattern audio-like (asimmetrico) — alterna picchi e valli per sembrare onda reale
  const heights = [55,82,42,90,65,72,48,86,58,75,40,68,80,52,70,45,62,88,55,73];
  const html = heights.map((h,i) => {
    const delay = (i * 0.04).toFixed(2);
    return `<div class="wf-bar" style="height:${h}%;animation-delay:${delay}s"></div>`;
  }).join('');
  wf.innerHTML = html;
}

function pingGAS(){
  // Sveglia il GAS mentre il cliente vede lo skeleton.
  // Quando arriva la chiamata vera getConfig (qualche centinaio di ms dopo),
  // l'istanza Apps Script è già calda e risponde in <500ms.
  const url = GAS_URL + '?action=ping&local=' + encodeURIComponent(LOCAL_ID) + '&t=' + Date.now();
  // mode:no-cors → niente preflight CORS, niente errori se la risposta non è leggibile.
  // Non aspettiamo la risposta, è solo per riscaldare il container Apps Script.
  fetch(url, { mode:'no-cors', cache:'no-store' })
    .then(()=> console.log('[v1.10] GAS warm-up ping inviato'))
    .catch(()=> { /* silent · è solo warm-up */ });
}

/* ════════════════════════════════════════════════════
   v1.10 · loadMenuWithRetry — 3 tentativi con backoff
   ════════════════════════════════════════════════════ */
async function loadMenuWithRetry(){
  const ATTEMPTS  = 3;
  const TIMEOUT_MS = 10000;     // 10s per tentativo (cold start GAS osservato 4-8s)
  const BACKOFFS  = [0, 1500, 2500];  // pause prima del tentativo i

  let lastError = null;
  for(let i = 0; i < ATTEMPTS; i++){
    if(BACKOFFS[i] > 0){
      console.log(`[v1.10] retry ${i+1}/${ATTEMPTS} dopo ${BACKOFFS[i]}ms`);
      await sleep(BACKOFFS[i]);
    }
    try {
      await loadFromSheet(TIMEOUT_MS);
      console.log(`[v1.10] loadFromSheet OK al tentativo ${i+1}/${ATTEMPTS}`);
      return;  // success
    } catch(e){
      lastError = e;
      const isRetriable = isRetriableError(e);
      console.warn(`[v1.10] tentativo ${i+1}/${ATTEMPTS} fallito (retriable=${isRetriable}):`, e.message);
      if(!isRetriable) break;  // errori "duri" → no retry
    }
  }
  // Tutti i tentativi falliti
  throw lastError || new Error('unknown error after retries');
}

function isRetriableError(e){
  if(!e) return false;
  // AbortError (timeout) e TypeError (network failure) sono recuperabili
  if(e.name === 'AbortError') return true;
  if(e.name === 'TypeError') return true;  // "Failed to fetch", DNS, ecc
  // Errori applicativi (404, JSON malformato, "No products parsed") non sono retriable
  return false;
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

/* ════════════════════════════════════════════════════
   DATA LOADING (v1.10 · senza demo fallback)

async function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const tid  = setTimeout(()=>ctrl.abort(), ms);
  try {
    const r = await fetch(url, {signal: ctrl.signal});
    clearTimeout(tid);
    return r;
  } catch(e) {
    clearTimeout(tid);
    throw e;
  }
}

async function loadFromSheet(timeoutMs){
  setProgress(10);

  // STEP 1 · getConfig
  const cfgUrl = GAS_URL + '?action=getConfig&local=' + encodeURIComponent(LOCAL_ID) + '&t=' + Date.now();
  const cfgResp = await fetchWithTimeout(cfgUrl, timeoutMs).then(r=>r.json());

  if(!cfgResp || !cfgResp.ok){
    // Errore applicativo (es. local non in Registry) → non retriable
    const err = new Error('getConfig failed for local=' + LOCAL_ID + ': ' + (cfgResp?.error || 'no response'));
    err.name = 'AppError';
    throw err;
  }

  const cfg = cfgResp.config || {};
  setProgress(40);

  applyBrand({
    name:            cfg.brand_name         || KNOWN_LOCALS[LOCAL_ID]?.name || LOCAL_ID,
    logo_url:        cfg.brand_logo_url     || '',
    logo_emoji:      cfg.brand_logo_emoji   || KNOWN_LOCALS[LOCAL_ID]?.logo_emoji || '🍽️',
    favicon_url:     cfg.brand_favicon_url  || '',
    color_primary:   cfg.color_primary      || BRAND.color_primary,
    color_accent:    cfg.color_accent       || BRAND.color_accent,
    color_bg:        cfg.color_bg           || BRAND.color_bg,
    currency:        cfg.currency           || 'CLP',
    currency_symbol: cfg.currency_symbol    || '$',
    default_lang:    cfg.default_lang       || 'es',
    gas_url:         GAS_URL,
    nuevo_dias:      parseInt(cfg.nuevo_dias) || 14,
  });

  const theme = (cfg.theme_mode || KNOWN_LOCALS[LOCAL_ID]?.theme_mode || 'light').toLowerCase();
  document.body.classList.toggle('theme-dark', theme === 'dark');

  CATEGORY_GROUPS = null;
  if(cfg.category_groups){
    try {
      const parsed = JSON.parse(cfg.category_groups);
      if(parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0){
        CATEGORY_GROUPS = parsed;
      }
    } catch(e){ console.warn('category_groups JSON malformato:', e.message); }
  }

  // STEP 2 · CSV URL
  const dataSource = cfgResp.dataSource || 'visor';
  const csvUrl = (dataSource === 'seed' && cfg.sheet_csv_url_seed)
    ? cfg.sheet_csv_url_seed
    : (cfg.sheet_csv_url_visor || cfg.sheet_csv_url);

  if(!csvUrl){
    const err = new Error('No sheet_csv_url in PARAMETROS for local=' + LOCAL_ID);
    err.name = 'AppError';
    throw err;
  }

  // STEP 3 · Fetch CSV
  const csvResp = await fetchWithTimeout(csvUrl + (csvUrl.includes('?') ? '&' : '?') + 't=' + Date.now(), timeoutMs);
  const text = await csvResp.text();
  setProgress(70);

  // STEP 4 · Parse
  const rows = parseCSV(text).slice(1);
  const parsed = rows.map(r=>({
    id:            r[0]||'',
    nombre:        r[1]||'',
    categoria:     (r[2]||'').toLowerCase(),
    descripcion:   r[3]||'',
    precio:        parsePrice(r[4]),
    imagen:        r[5]||'',
    activo:        r[6]==='TRUE',
    agotado:       r[7]==='TRUE',
    hora_inicio:   parseInt(r[8])||0,
    hora_fin:      parseInt(r[9])||24,
    badges:        r[10]||'',
    upsell_ids:    r[11]||'',
    precio_member: parsePrice(r[12]) || '',
    fecha_agregado:r[13]||'',
    menu_visible:  r[14]!=='FALSE',
  })).filter(p=>p.id && p.activo && p.menu_visible!==false);

  if(parsed.length === 0){
    const err = new Error('No products parsed from CSV for local=' + LOCAL_ID);
    err.name = 'AppError';
    throw err;
  }

  ALL_PRODUCTS = parsed;

  // STEP 5 · Categories
  const catIds = [...new Set(ALL_PRODUCTS.map(p=>p.categoria))];
  const catMap = {
    'alimentos':'🥪','cafe':'☕','jugos':'🥤','helados':'🍦','especiales':'✨',
    'entradas':'🦐','pastas':'🍝','fondos':'🥩','pizzas_burger':'🍕','sushi':'🍣',
    'acompanamientos':'🥗','nino':'👶','desserts':'🍰','almuerzo':'🍱',
    'bar':'🍸','sour':'🍹','mojitos':'🍃','spritz':'🥂','cervezas':'🍺',
    'vinos':'🍷','jarras':'🍶','destilados':'🥃',
    'bowls':'🥣','bebidas':'🥤','snacks':'🥪','postres':'🍰',
    'desayunos':'🍳','ensaladas':'🥗','platos':'🍽️','otros':'✦','solidos':'🍽️',
  };
  ALL_CATEGORIES = catIds.filter(Boolean).map((id,i)=>({
    id, name: id.charAt(0).toUpperCase()+id.slice(1),
    emoji: catMap[id]||'✦', orden: i+1
  }));

  setProgress(100);
}

function parseCSV(text){
  return text.split('\n').map(line=>{
    const row=[]; let cur='', inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){ inQ=!inQ; }
      else if(c===','&&!inQ){ row.push(cur.trim()); cur=''; }
      else cur+=c;
    }
    row.push(cur.trim());
    return row;
  }).filter(r=>r.some(c=>c));
}

function getCurrentFajaId(){
  const h = new Date().getHours();
  const f = FAJAS.slice(1).find(f=>h>=f.start && h<f.end);
  return f ? f.id : 'all';
}

function renderFajas(){
  const currentId = getCurrentFajaId();
  const wrap = document.getElementById('fajaScroll');
  wrap.innerHTML = FAJAS.map(f=>`
    <button class="faja-chip${f.id===CURRENT_FAJA?' active':''}${f.id===currentId&&f.id!=='all'?' current':''}"
      onclick="setFaja('${f.id}')">
      <span style="margin-right:4px">${f.icon}</span>${getLang(f.label_key)}${f.id===currentId&&f.id!=='all'?' ·':''}

  `).join('');

function setFaja(id){
  CURRENT_FAJA = id;
  renderFajas();
  renderGroups();
  renderMenu();
  window.scrollTo({top:0});
}

function productInFaja(p){
  if(CURRENT_FAJA==='all') return true;
  const faja = FAJAS.find(f=>f.id===CURRENT_FAJA);
  if(!faja) return true;
  return p.hora_inicio <= faja.end && p.hora_fin >= faja.start;
}

function renderCatTabs(){
  const visibleCats = getVisibleCategories();
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = visibleCats.map(c=>`
    <button class="cat-tab" id="tab-${c.id}" onclick="scrollToCategory('${c.id}')">
      <span class="cat-tab-emoji">${c.emoji}</span>${getCatName(c.id)}
    </button>
  `).join('');
  setTimeout(setupCatObserver, 200);
}

function getVisibleCategories(){
  if(!CATEGORY_GROUPS || !CURRENT_GROUP) return ALL_CATEGORIES;
  const group = CATEGORY_GROUPS[CURRENT_GROUP];
  if(!group || !group.cats) return ALL_CATEGORIES;
  return ALL_CATEGORIES.filter(c => group.cats.includes(c.id));
}

function renderGroups(){
  const wrap = document.getElementById('groupBar');
  const grid = document.getElementById('groupGrid');
  const promosCount = (PROMOS_ACTIVAS || []).length;
  if(!CATEGORY_GROUPS && promosCount === 0){ wrap.classList.remove('show'); return; }
  const groupKeys = CATEGORY_GROUPS ? Object.keys(CATEGORY_GROUPS) : [];
  if(groupKeys.length < 2 && promosCount === 0){ wrap.classList.remove('show'); return; }
  const countByGroup = {};
  groupKeys.forEach(gk => {
    const cats = CATEGORY_GROUPS[gk].cats || [];
    countByGroup[gk] = ALL_PRODUCTS.filter(p =>
      cats.includes(p.categoria) && productInFaja(p)
    ).length;
  });
  const promoProdsSet = new Set();
  (PROMOS_ACTIVAS || []).forEach(p => (p.prod_ids||[]).forEach(pid => promoProdsSet.add(pid)));
  const promoProductsCount = promoProdsSet.size;
  const totalChips = groupKeys.length + (promosCount > 0 ? 1 : 0);
  grid.className = 'group-grid g-' + totalChips;
  let html = groupKeys.map(gk=>{
    const g = CATEGORY_GROUPS[gk];
    const isActive = CURRENT_GROUP === gk;
    const count = countByGroup[gk] || 0;
    // v1.10 · count=0 → disabled grigio invece di nascosto · stabilità interfaccia
    const isDisabled = count === 0;
    const onclick = isDisabled ? '' : `onclick="setGroup('${gk}')"`;
    return `
      <button class="group-chip${isActive?' active':''}${isDisabled?' disabled':''}" ${onclick}${isDisabled?' aria-disabled="true"':''}>
        <span class="group-chip-emoji">${g.emoji||'✦'}</span>
        <span class="group-chip-name">${gk}</span>
        <span class="group-chip-count">${count}</span>
      </button>`;
  }).join('');
  if(promosCount > 0){

    html += `

function scrollToCategory(id){
  const el = document.getElementById('cat-' + id);
  if(el){
    const header = document.getElementById('header');
    const faja   = document.getElementById('fajaBar');
    const search = document.getElementById('searchBarWrap');
    const cats   = document.getElementById('catSticky');
    const groups = document.getElementById('groupBar');
    const groupsH = (groups && groups.classList.contains('show')) ? groups.offsetHeight : 0;
    const offset = (header?.offsetHeight||54) + (faja?.offsetHeight||50) +
                   (search?.offsetHeight||56) + groupsH + (cats?.offsetHeight||44) + 8;
    window.scrollTo({top: el.offsetTop - offset, behavior:'smooth'});
  }
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
  const tab = document.getElementById('tab-' + id);
  if(tab) tab.classList.add('active');
}

function setupCatObserver(){
  const opts = { rootMargin:'-20% 0px -70% 0px', threshold:0 };
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const id = e.target.id.replace('cat-','');
        document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
        const tab = document.getElementById('tab-'+id);
        if(tab){
          tab.classList.add('active');
          tab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
        }
      }
    });
  }, opts);
  document.querySelectorAll('.cat-section').forEach(s=>obs.observe(s));
}

/* BADGES */
function isNuevo(p){
  if(!p.fecha_agregado) return false;
  const added = new Date(p.fecha_agregado);
  const diffDays = (Date.now() - added.getTime()) / 86400000;
  return diffDays <= (BRAND.nuevo_dias || 14);
}

function buildBadges(p, forSheet=false){
  const badges = [];
  if(p.agotado){ badges.push(`<span class="badge badge-agotado">${getLang('agotado')}</span>`); return badges.join(''); }
  if(isNuevo(p)) badges.push(`<span class="badge badge-nuevo">✦ ${getLang('nuevo')}</span>`);
  const raw = (p.badges||'').split(',').map(b=>b.trim().toLowerCase().replace(/\s/g,''));
  raw.forEach(b=>{
    if(b==='popular')    badges.push(`<span class="badge badge-popular">★ ${getLang('popular')}</span>`);
    if(b==='vegano')     badges.push(`<span class="badge badge-vegano">🌱 ${getLang('vegano')}</span>`);
    if(b==='singluten')  badges.push(`<span class="badge badge-singluten">🌾 ${getLang('singluten')}</span>`);
    if(b==='chef')       badges.push(`<span class="badge badge-chef">👨‍🍳 ${getLang('chef')}</span>`);
    if(b==='temporada')  badges.push(`<span class="badge badge-temporada">🍃 ${getLang('temporada')}</span>`);
  });
  if(ACTIVE_MEMBER && p.precio_member)
    badges.push(`<span class="badge badge-member">💳 ${getLang('member_price')}</span>`);
  return badges.join('');
}

/* PRICE */
function parsePrice(v){
  if(typeof v === 'number') return v;
  if(!v) return 0;
  let s = String(v).replace(/[^\d.,\-]/g,'');
  if(!s) return 0;
  if(s.includes('.') && s.includes(',')){
    const lastDot = s.lastIndexOf('.');
    const lastComma = s.lastIndexOf(',');
    if(lastComma > lastDot){ s = s.replace(/\./g,'').replace(',','.'); }
    else { s = s.replace(/,/g,''); }
  } else if(s.includes(',')){
    const parts = s.split(',');
    if(parts.length === 2 && parts[1].length === 2) s = s.replace(',','.');
    else s = s.replace(/,/g,'');
  } else if(s.includes('.')){
    const parts = s.split('.');
    if(!(parts.length === 2 && parts[1].length === 2)) s = s.replace(/\./g,'');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function formatPrice(n){
  const s = BRAND.currency_symbol || '$';
  const num = parsePrice(n);
  if(BRAND.currency === 'CLP' || num >= 1000)
    return s + num.toLocaleString('es-CL');
  return s + num.toFixed(2);
}

function getDisplayPrice(p){
  if(ACTIVE_MEMBER && p.precio_member)
    return { main: formatPrice(p.precio_member), orig: formatPrice(p.precio) };
  return { main: formatPrice(p.precio), orig: null };
}

function _catColor(catId){
  const colors = {
    'alimentos':'#FFF0E6','cafe':'#F5ECD7','jugos':'#E8F5E9',
    'helados':'#E3F2FD','bebidas':'#E8F5E9','bowls':'#FFF8E1',
    'snacks':'#FFF3E0','postres':'#FCE4EC','especiales':'#F3E5F5',
    'solidos':'#FFF0E6','ensaladas':'#E8F5E9','desayunos':'#FFFDE7',
  };
  return colors[catId] || '#F5F5F5';
}

function renderMenu(){
  const wrap = document.getElementById('menuContent');
  const visibleCatIds = getVisibleCategories().map(c => c.id);
  const ritmoFilterActive = RITMO_FILTER_ON && RITMO_ACTUAL && RITMO_ACTUAL.prod_ids && RITMO_ACTUAL.prod_ids.length > 0;
  const ritmoProdSet = ritmoFilterActive ? new Set(RITMO_ACTUAL.prod_ids) : null;
  const promosGroupActive = CURRENT_GROUP === '__PROMOS__';
  FILTERED = ALL_PRODUCTS.filter(p=>{
    const inFaja = productInFaja(p);
    const inGroup = promosGroupActive
      ? !!PROD_TO_PROMO[p.id]
      : visibleCatIds.includes(p.categoria);
    const inRitmo = !ritmoFilterActive || ritmoProdSet.has(p.id);
    const inSearch = !SEARCH_QUERY ||
      p.nombre.toLowerCase().includes(SEARCH_QUERY) ||
      p.descripcion.toLowerCase().includes(SEARCH_QUERY) ||
      (p.badges||'').toLowerCase().includes(SEARCH_QUERY);
    return inFaja && inGroup && inRitmo && inSearch;
  });
  if(FILTERED.length === 0){
    wrap.innerHTML = '';
    const empty = document.getElementById('emptyState');
    empty.classList.add('show');
    let msg;
    if(SEARCH_QUERY){ msg = getLang('search_empty') + ' "' + SEARCH_QUERY + '"'; }
    else if(ritmoFilterActive){ msg = getLang('rhythm_no_products').replace('{nombre}', RITMO_ACTUAL.nombre); }
    else { msg = getLang('no_products'); }
    document.getElementById('emptyText').textContent = msg;
    document.getElementById('catSticky').style.display = 'none';
    return;
  }
  document.getElementById('emptyState').classList.remove('show');
  document.getElementById('catSticky').style.display = '';
  const visibleCats = getVisibleCategories();
  const byCat = {};
  visibleCats.forEach(c=>{ byCat[c.id] = []; });
  FILTERED.forEach(p=>{
    if(!byCat[p.categoria]) byCat[p.categoria] = [];
    byCat[p.categoria].push(p);
  });
  let html = '';
  visibleCats.forEach(cat=>{
    const items = byCat[cat.id];
    if(!items || items.length === 0) return;
    html += `
      <div class="cat-section" id="cat-${cat.id}">
        <div class="cat-header">
          <span class="cat-header-emoji">${cat.emoji}</span>
          <span class="cat-header-name">${getCatName(cat.id)}</span>
          <span class="cat-header-count">${items.length}</span>
        </div>
        <div class="product-list">
          ${items.map(p=>renderProductCard(p)).join('')}
        </div>
      </div>`;
  });
  wrap.innerHTML = html;
}

function renderProductCard(p){
  const promo   = PROD_TO_PROMO[p.id] || null;
  const badges  = buildBadges(p);
  const prices  = getDisplayPrice(p);
  const isNew   = isNuevo(p);
  const cat     = ALL_CATEGORIES.find(c=>c.id===p.categoria);
  const catEmoji = cat?.emoji || '🍽️';
  const catColor = _catColor(p.categoria);
  // v1.10 · placeholder con emoji categoria invece di buco grigio
  const phHtml   = `<div class="card-img-placeholder" style="background:${catColor}"><span>${catEmoji}</span></div>`;
  const imgHtml  = p.imagen
    ? `<img src="${p.imagen}" alt="${p.nombre}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">${phHtml}`
    : phHtml;

    ? `<span class="badge" style="background:rgba(251,191,36,0.22);color:#d97706;font-weight:700">🎁 ${promo.nombre}</span>`

    : '';

    : '';

      </div>

    </div>`;
}

function openDetail(id){
  const p = ALL_PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  trackProductView(p);
  const prices  = getDisplayPrice(p);
  const badges  = buildBadges(p, true);

    ? `<div class="sheet-img"><img src="${p.imagen}" alt="${p.nombre}" onerror="this.style.display='none';this.parentElement.style.background='${_catColor(p.categoria)}'"></div>`
    : `<div class="sheet-img-ph" style="background:${_catColor(p.categoria)}">${catEmoji}</div>`;
  const upsellIds = (p.upsell_ids||'').split(',').map(x=>x.trim()).filter(Boolean);
  const upsellProds = upsellIds.map(id=>ALL_PRODUCTS.find(x=>x.id===id)).filter(Boolean);
  let upsellHtml = '';
  if(upsellProds.length > 0){
    upsellHtml = `
      <div id="upsellSection" class="show">
        <div class="upsell-title">${getLang('upsell_title')}</div>
        <div class="upsell-scroll">
          ${upsellProds.map(u=>`
            <div class="upsell-card" onclick="openDetail('${u.id}')">
              ${u.imagen
                ? `<div class="upsell-img"><img src="${u.imagen}" alt="${u.nombre}" loading="lazy"></div>`
                : `<div class="upsell-img-ph">${ALL_CATEGORIES.find(c=>c.id===u.categoria)?.emoji||'🍽️'}</div>`}
              <div class="upsell-info">
                <div class="upsell-name">${u.nombre}</div>
                <div class="upsell-price">${formatPrice(ACTIVE_MEMBER&&u.precio_member?u.precio_member:u.precio)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
  }
  document.getElementById('sheetContent').innerHTML = `
    ${imgHtml}
    <div class="sheet-body">
      ${badges ? `<div class="sheet-badges">${badges}</div>` : ''}
      <div class="sheet-name">${toTitleCase(p.nombre)}</div>
      <div class="sheet-desc">${p.descripcion}</div>
      <div class="sheet-price-row">
        <div>
          ${prices.orig ? `<span class="sheet-price-orig">${prices.orig}</span>` : ''}
          <span class="sheet-price">${prices.main}</span>
        </div>
        ${!p.agotado ? `
          <button class="card-call-btn" style="width:48px;height:48px;font-size:22px"
                  onclick="closeDetail();setTimeout(()=>onCallWaiterForProduct('${p.id}'),320)"
                  aria-label="Llamar mesero">🔔</button>
        ` : ''}
      </div>
      ${!p.agotado && MESA_ID ? `
        <div style="text-align:center;font-size:12px;color:var(--brand-text-muted);margin:-8px 0 16px;letter-spacing:0.3px">
          Toca 🔔 para llamar mesero por este producto
        </div>
      ` : ''}
      </div>
      ${upsellHtml}
    </div>`;
  document.getElementById('detailOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('detailSheet').classList.add('open'), 10);
  document.body.style.overflow = 'hidden';
}

/* RITMOS + PROMOS (v1.6 invariati) */
async function loadRitmos(){
  if(!BRAND.gas_url) return;
  try {
    const url = `${BRAND.gas_url}?action=getRitmos&local=${LOCAL_ID}&t=${Date.now()}`;
    const r = await fetch(url);
    const data = await r.json();
    if(!data.ok) return;
    const prevRitmoId = RITMO_ACTUAL ? RITMO_ACTUAL.id : null;
    RITMO_ACTUAL = data.ritmo_actual || null;
    RITMOS_DISP  = data.ritmos_disponibles || [];
    const newRitmoId = RITMO_ACTUAL ? RITMO_ACTUAL.id : null;
    if(prevRitmoId !== newRitmoId){
      console.log('[v1.10] Ritmo cambiato:', prevRitmoId, '→', newRitmoId);
    }
    renderRhythmBar();
    renderMenu();
  } catch(e){ console.warn('[v1.10] loadRitmos failed:', e.message); }
}

async function loadPromos(){
  if(!BRAND.gas_url) return;
  try {
    const url = `${BRAND.gas_url}?action=getPromos&local=${LOCAL_ID}&t=${Date.now()}`;
    const r = await fetch(url);
    const data = await r.json();
    if(!data.ok) return;
    PROMOS_ACTIVAS = data.promos_activas || [];
    PROD_TO_PROMO = {};
    PROMOS_ACTIVAS.forEach(p => {
      (p.prod_ids || []).forEach(pid => { PROD_TO_PROMO[pid] = p; });
    });
    renderGroups();
    renderMenu();
  } catch(e){ console.warn('[v1.10] loadPromos failed:', e.message); }
}

function startRhythmPolling(){
  if(!document.body.classList.contains('theme-dark')) return;
  if(RITMO_POLL_TIMER) return;
  loadRitmos();
  loadPromos();
  RITMO_POLL_TIMER = setInterval(() => { loadRitmos(); loadPromos(); }, 60000);
  console.log('[v1.10] Rhythm polling attivo (60s) per', LOCAL_ID);
}

function stopRhythmPolling(){
  if(RITMO_POLL_TIMER){ clearInterval(RITMO_POLL_TIMER); RITMO_POLL_TIMER = null; }
}

      const dur = (60 / bpm).toFixed(3) + 's';
      wf.querySelectorAll('.wf-bar').forEach((bar, i) => {
        bar.style.animationDuration = dur;
        bar.style.animationDelay = (i * (60/bpm) / 20).toFixed(3) + 's';
      });
    } else {
      wf.querySelectorAll('.wf-bar').forEach(bar => {
        bar.style.animationDuration = '3s';
        bar.style.animationDelay = '';
      });
    }
  }
  updateStickyTops();
}

/* MEMBER */
async function loadMember(memberId){
  if(!BRAND.gas_url) return;
  try {
    const resp = await fetch(`${BRAND.gas_url}?action=getMember&id=${memberId}`);
    const data = await resp.json();
    if(data.ok){
      ACTIVE_MEMBER = data;
      const banner = document.getElementById('memberBanner');
      banner.textContent = `${getLang('hi_member')} ${data.nombre} · ${data.nivel} · ${data.tokens} ${getLang('tokens')}`;
      banner.classList.add('show');
      renderMenu();
    }
  } catch(e){ console.warn('Member load failed', e); }
}

/* TRACKING */
function trackView(){
  if(!BRAND.gas_url || !MESA_ID) return;
  const body = { action:'trackView', local:LOCAL_ID, mesa:MESA_ID, member:MEMBER_ID, ts:Date.now() };
  navigator.sendBeacon(BRAND.gas_url, JSON.stringify(body));
}

function trackProductView(p){
  if(!BRAND.gas_url) return;
  const body = { action:'trackProduct', local:LOCAL_ID, prod_id:p.id, mesa:MESA_ID, ts:Date.now() };
  navigator.sendBeacon(BRAND.gas_url, JSON.stringify(body));
}

/* TOAST */
function addItem(id){
  const p = ALL_PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  showToastMsg(`${p.nombre} · ${getLang('add')}`);
}

let toastTimer;
function showToastMsg(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2500);
}

function scrollToTop(){ window.scrollTo({top:0, behavior:'smooth'}); }

/* LLAMAR MESERO (v1.7 invariato) */
let CONFIRM_PAYLOAD = null;

function openConfirmSheet({title, subtitle, payload, okLabel}){
  CONFIRM_PAYLOAD = payload;
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmSubtitle').textContent = subtitle;
  const okBtn = document.getElementById('confirmOkBtn');
  okBtn.textContent = okLabel || getLang('confirm_call') || 'Sí, llamar';
  okBtn.onclick = () => {
    const payloadCopy = CONFIRM_PAYLOAD;
    closeConfirmSheet();
    notifyWaiter(payloadCopy);
  };
  document.getElementById('confirmOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('confirmSheet').classList.add('open'), 10);
  document.body.style.overflow = 'hidden';
}

function closeConfirmSheet(){
  document.getElementById('confirmSheet').classList.remove('open');
  document.getElementById('confirmOverlay').classList.remove('open');
  document.body.style.overflow = '';
  CONFIRM_PAYLOAD = null;
}

function onCallWaiterForProduct(prodId){
  if(!MESA_ID){
    showToastMsg(getLang('call_no_mesa') || 'Acércate a un mesero para ordenar');
    return;
  }
  const p = ALL_PRODUCTS.find(x=>x.id===prodId);
  if(!p) return;
  openConfirmSheet({
    title:    `¿Llamar mesero por ${toTitleCase(p.nombre)}?`,
    subtitle: `${getLang('mesa')} ${MESA_ID} · ${getLang('call_subtitle') || 'El mesero verá lo que quieres pedir'}`,
    payload:  { tipo_llamada:'por_producto', prod_id: prodId },
    okLabel:  getLang('confirm_call') || 'Sí, llamar',
  });
}

function onPedirDirecto(prodId){
  console.log('[v1.10] onPedirDirecto · gancio Fase 2 · prod_id=', prodId);
  showToastMsg(getLang('coming_soon'));
}

function onCallWaiterGeneric(){
  if(!MESA_ID){
    showToastMsg(getLang('call_no_mesa') || 'Acércate a un mesero para ordenar');
    return;
  }
  openConfirmSheet({
    title:    getLang('call_generic_title') || '¿Llamar mesero?',
    subtitle: `${getLang('mesa')} ${MESA_ID} · ${getLang('call_generic_subtitle') || 'El mesero llegará a tu mesa en breve'}`,
    payload:  { tipo_llamada :'generica', prod_id: null },
    okLabel:  getLang('confirm_call') || 'Sí, llamar',
  });
}

function notifyWaiter(payload){
  if(!BRAND.gas_url || !MESA_ID){
    showToastMsg(getLang('call_send_error'));
    return;
  }
  const body = {
    action:         'notifyWaiter',
    local:          LOCAL_ID,
    mesa:           MESA_ID,
    ritmo_attivo:   RITMO_ACTUAL ? RITMO_ACTUAL.id : '',
    tipo_llamada:   payload.tipo_llamada || 'generica',
    prod_id_intent: payload.prod_id || '',
    ts:             Date.now(),
  };
  try {
    navigator.sendBeacon(BRAND.gas_url, JSON.stringify(body));
    showToastMsg(getLang('call_sent') || '🔔 Mesero llamado · llega pronto');
  } catch(e) {
    console.warn('[v1.10] notifyWaiter failed:', e);
    showToastMsg(getLang('call_retry_error'));
  }
}
