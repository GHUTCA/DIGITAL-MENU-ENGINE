     menu_digital.html · v1.12 · 27-apr-2026 · Sessione S5 (in lavorazione)
     ════════════════════════════════════════════════════════════════════
     CHANGELOG v1.11 → v1.12 (S5 commit 1/5)
     - Lettura PARAMETROS.sugerencia_activa + sugerencia_frase_default
     - Lettura RITMOS.Mensaje_Cliente con fallback ai cilenismi DNA brand
     - Variabili globali per cross-sell strip + DJS_AGENDA (preparate)
     - Solo backend: nessun cambio UI ancora · invisibile al cliente

     ────────────────────────────────────────────────────────────────────
     CHANGELOG v1.10 → v1.11 (iter 2 · 9 fix UX + 5 polish cromatici)

     ITER 1 · UI POLISH (9 fix coordinati):
     - SEARCH bar in alto sticky → RIMOSSA. Lente ⌕ in header alto apre
       overlay full-screen. Search isolata, non filtra menu sotto.
     - BOTTOM NAV: 3 voci (Menú · Llamar · Club) con FAB campanella
       centrale RIALZATO (sostituisce sia stickyCallBar che voce Buscar).
     - CARD PRODOTTO v3 Strada C: nome+prezzo top, descrizione 2 righe
       piene, NUEVO dot verde su angolo top-right foto (era badge testo +
       bordo verde animato · entrambi rimossi).
     - PREZZO senza simbolo $ nelle card list, peso medium 14px neutro
       chiaro (era rosso 18px bold). Nella scheda dettaglio il $ resta.
     - CAT-TABS sticky con fade-mask 12px sopra · niente più card
       tagliate sotto le tab durante scroll.
     - SLOGAN ritmo libero rinnovato in 8 lingue: "Sin ritmo activo →
       El ritmo aparece en su momento · relájate y disfruta". Hardcoded
       ora · editabile da Sheet RITMOS in S4 prossima.
     - PADDING-BOTTOM mainContent 160px → 80px (FAB ora dentro nav).

     ITER 2 · POLISH CROMATICO (5 interventi · contro "buco nero piatto"):
     - STRATIFICAZIONE 3 LIVELLI cromatici per dare profondità visiva
       su OLED Samsung dove i neri sono spenti:
       · bg #0D0D1A → #0A0A14 (più profondo, livello sotto)
       · surface #15152A invariato (chrome navigazione)
       · NUOVO surface-card #1F1F38 (card prodotto galleggiano sopra)
     - CARD con shadow + border 0.09→0.12 alpha. Galleggiano sopra il bg
       invece di confondersi col chrome.
     - ACCENT ROSSE separatori di sezione · gradient sottili 1-2px:
       · sotto #header (separa brand-area da nav-area)
       · sotto #fajaBar (separa rhythm da macro-groups)
       · sopra #bottomNav (sottile striscia di accento)
     - MACRO-GROUP attivo · count come pillola accent piena con bg rosso
       e color bianco. Border accent + glow shadow. Identità chiara.
     - CAT-HEADER con barretta accent 3×14px a sinistra del nome.
       Count come pillola surface medio. Ancora visivo durante scroll.
     - RHYTHM caso libero · waveform spento sostituito da linea
       decorativa rossa elegante + dot acceso pulsante prima del label
       "♪ BKS Rhythm" (sembrava bug, ora sembra design).
     ════════════════════════════════════════════════════════════════════ -->

/* ══════════════════════════════════════════
   WHITE-LABEL DESIGN TOKENS
   ══════════════════════════════════════════ */
:root {
  --brand-primary: #1A1A2E;
  --brand-accent: #E94560;
  --brand-bg: #F8F8F8;
  --brand-surface: #FFFFFF;
  --brand-text: #2C2C2C;
  --brand-text-muted: #888;
  --brand-border: rgba(0,0,0,0.09);
  --rhythm-bg: #FFFFFF;
  --rhythm-label: #888;
  --rhythm-chip-bg: #F8F8F8;
  --rhythm-chip-text: #888;
  --group-bg: #FFFFFF;
  --group-inactive-bg: #F5F5F5;
  --group-inactive-text: #888;
  --brand-name: "Menú Digital";
  --brand-font: 'Outfit', sans-serif;
  --badge-nuevo: #22C55E;
  --badge-popular: #F59E0B;
  --badge-vegano: #84CC16;
  --badge-singluten: #60A5FA;
  --badge-chef: #F97316;
  --badge-temporada: #A78BFA;
  --badge-agotado: #94A3B8;
  --transition: 0.2s ease;
}

body.theme-dark {
  /* v1.11 iter 2 · STRATIFICAZIONE 3 LIVELLI cromatici contro "buco nero piatto"
     ─ bg = livello più profondo (sotto tutto)
     ─ surface = chrome navigazione (header, ritmo, macro-groups, bottom-nav)
     ─ surface-card = card prodotto (galleggiano sopra il chrome)
     Differenza percepibile su OLED Samsung dove i neri sono davvero spenti. */
  --brand-bg: #0A0A14;          /* era #0D0D1A · più profondo */
  --brand-surface: #15152A;      /* invariato · chrome navigazione */
  --brand-surface-card: #1F1F38; /* NUOVO · card list, surface alto */
  --brand-text: #F5F5F5;
  --brand-text-muted: rgba(255,255,255,0.55);
  --brand-border: rgba(255,255,255,0.12);     /* era 0.09 · +33% visibile */
  --brand-border-strong: rgba(255,255,255,0.18);
  --brand-accent-line: rgba(233,69,96,0.35);
  --brand-accent-line-strong: rgba(233,69,96,0.5);
  --rhythm-bg: #15152A;          /* surface invece di bg · stacco visivo */
  --rhythm-label: rgba(255,255,255,0.4);
  --rhythm-chip-bg: rgba(255,255,255,0.06);
  --rhythm-chip-text: rgba(255,255,255,0.5);
  --group-bg: #15152A;
  --group-inactive-bg: #1F1F38;  /* surface-2 · contrasto vs group-bg */
  --group-inactive-text: rgba(255,255,255,0.65);
  --card-shadow: 0 2px 10px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
}

/* Dark mode badges */
body.theme-dark .badge-popular  { background:rgba(245,158,11,0.22); color:#fbbf24 }
body.theme-dark .badge-vegano   { background:rgba(132,204,22,0.20); color:#a3e635 }
body.theme-dark .badge-singluten{ background:rgba(96,165,250,0.22); color:#93c5fd }
body.theme-dark .badge-chef     { background:rgba(249,115,22,0.22); color:#fb923c }
body.theme-dark .badge-temporada{ background:rgba(167,139,250,0.22); color:#c4b5fd }
body.theme-dark .badge-agotado  { background:rgba(148,163,184,0.25); color:#cbd5e1 }
body.theme-dark .badge-member   { background:rgba(233,69,96,0.25); color:#fb7185 }
body.theme-dark .wf-bar { background:linear-gradient(to top, var(--brand-accent), rgba(233,69,96,0.4)); filter: drop-shadow(0 0 3px rgba(233,69,96,0.6)); border-radius:2px; }
body.theme-dark .rhythm-label { color: rgba(255,255,255,0.55); letter-spacing: 3px; font-weight: 500; }

/* v1.11 iter 2 · CARD prodotto su surface-card (livello alto, sopra chrome)
   con shadow per "galleggiare" sopra il bg · OLED-friendly */
body.theme-dark .product-card {
  background: var(--brand-surface-card);
  border-color: var(--brand-border);
  box-shadow: var(--card-shadow);
}
body.theme-dark .product-card:active {
  border-color: var(--brand-accent);
  box-shadow: var(--card-shadow), 0 0 0 1px rgba(233,69,96,0.3);
}
body.theme-dark .product-card.nuevo-highlight { border-color: var(--brand-border); }
body.theme-dark .card-img-wrap { background: var(--brand-surface); }
/* dot NUEVO con border surface-card così si fonde col bg della card */
body.theme-dark .card-nuevo-dot { border-color: var(--brand-surface-card); box-shadow: 0 0 0 1px rgba(74,222,128,0.5), 0 0 8px rgba(74,222,128,0.4); }

body.theme-dark .cat-tab { color: rgba(255,255,255,0.45) }
body.theme-dark .cat-tab.active { color: #fff; border-bottom-color: var(--brand-accent); }
/* v1.11 iter 2 · regola vecchia v1.10 .cat-sticky con bg uguale a brand-bg RIMOSSA
   (causava effetto "trasparenza" perché il bg era identico a quello dietro le card).
   Vedi sezione "DARK MODE · cat-sticky con bg solido" sotto per la regola corrente. */
body.theme-dark .cat-header-name { color: rgba(255,255,255,0.92); font-weight: 700; }
body.theme-dark .card-price { color: rgba(255,255,255,0.92); }
body.theme-dark .sheet-price { color: #ff6b8a }
body.theme-dark #bottomNav { background: var(--brand-surface); border-top-color: var(--brand-border-strong); }
body.theme-dark .bnav-btn { color: rgba(255,255,255,0.5) }
body.theme-dark .bnav-btn.active { color: #ff6b8a }
body.theme-dark #searchInput { color: #fff }
body.theme-dark #searchInput::placeholder { color: rgba(255,255,255,0.35) }
body.theme-dark #detailSheet { background: var(--brand-surface); box-shadow: 0 -10px 40px rgba(0,0,0,0.6); }
body.theme-dark .sheet-handle { background: rgba(255,255,255,0.2) }
body.theme-dark .sheet-name { color: rgba(255,255,255,0.95) }
body.theme-dark .sheet-desc { color: rgba(255,255,255,0.65) }
body.theme-dark .lang-dropdown { background: var(--brand-surface); border-color: rgba(255,255,255,0.12); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
body.theme-dark #groupBar { border-bottom-color: var(--brand-border) }

/* v1.11 iter 2 · ACCENT ROSSE separatori di sezione · "spille" gradient
   ─ sotto header (separa brand-area da nav-area)
   ─ sotto fajaBar (separa rhythm da macro-groups)
   ─ sopra bottomNav (sottile striscia di accento) */
/* v1.11 iter 2 · accent rossi separatori · sotto header / fajaBar / sopra bottomNav
   IMPORTANTE: NON ridefinire position degli sticky originali (era position:sticky).
   ::after con position:absolute funziona già col containing block sticky del parent. */
body.theme-dark #header::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, transparent 0%, var(--brand-accent-line) 25%, var(--brand-accent-line-strong) 50%, var(--brand-accent-line) 75%, transparent 100%);
  pointer-events:none;
}
body.theme-dark #fajaBar::after {
  content:''; position:absolute; bottom:0; left:16px; right:16px; height:1px;
  background: linear-gradient(90deg, transparent, var(--brand-accent-line) 50%, transparent);
  pointer-events:none;
}
body.theme-dark #bottomNav::before {
  content:''; position:absolute; top:-1px; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent, var(--brand-accent-line) 50%, transparent);
  pointer-events:none;
}

/* v1.11 iter 2 · MACRO-GROUP attivo · count come pillola accent piena
   ─ identità chiara del group selezionato senza ambiguità */
body.theme-dark .group-chip {
  background: var(--group-inactive-bg);
  border: 1px solid var(--brand-border);
  color: var(--group-inactive-text);
  transition: all 0.2s ease;
}
body.theme-dark .group-chip:not(.disabled):not(.active):hover,
body.theme-dark .group-chip:not(.disabled):not(.active):active {
  border-color: var(--brand-border-strong);
  background: rgba(255,255,255,0.04);
}
body.theme-dark .group-chip.active {
  background: rgba(233,69,96,0.15);
  border-color: var(--brand-accent);
  color: #fff;
  box-shadow: 0 0 0 1px var(--brand-accent), 0 4px 16px rgba(233,69,96,0.25);
}
body.theme-dark .group-chip.active .group-chip-count {
  background: var(--brand-accent);
  color: #fff;
  padding: 1px 7px;
  border-radius: 10px;
  font-weight: 600;
}
body.theme-dark .group-chip-count { letter-spacing: 0.3px; padding: 1px 4px; }

/* v1.11 iter 2 · CAT-HEADER con barretta accent · ancora visivo durante scroll */
body.theme-dark .cat-header { padding: 6px 16px 10px; gap: 8px; align-items: center; position: relative; }
body.theme-dark .cat-header::before {
  content:''; width:3px; height:14px; border-radius:2px;
  background: var(--brand-accent);
  display: inline-block; flex-shrink: 0;
}
body.theme-dark .cat-header-emoji { font-size: 12px; opacity: 0.7; }
body.theme-dark .cat-header-count {
  font-size: 9px; padding: 2px 8px; background: var(--brand-surface);
  border-radius: 10px; font-weight: 600; letter-spacing: 0.5px;
}
/* v1.11 iter 2 · regole .group-chip duplicate del v1.10 RIMOSSE
   (sovrascrivevano il nuovo styling con bg surface-2 + border accent quando active).
   Vedi sezione "MACRO-GROUP attivo" sopra per le regole correnti. */
/* v1.10 · waveform unificato a 22px (variante B) — base CSS gestisce già altezza/gap/min-width */

/* v1.10 · DJ disc · disco rotante che firma il "DJ sta suonando ora" */
.dj-disc{
  width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle,rgba(233,69,96,0.45) 35%,#1A1A2E 35%,#1A1A2E 38%,rgba(255,255,255,0.18) 40%,#1A1A2E 90%);
  border:1px solid rgba(255,255,255,0.18);
  flex-shrink:0;
  animation:djSpin 3s linear infinite;
  filter:drop-shadow(0 0 4px rgba(233,69,96,0.35));
}
@keyframes djSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.group-chip-promos { background: linear-gradient(135deg, rgba(251,191,36,0.18), rgba(233,69,96,0.15)) !important; border: 1px solid rgba(251,191,36,0.35) !important; animation: goldPulse 2.5s ease-in-out infinite; }
.group-chip-promos.active { background: linear-gradient(135deg, #fbbf24, #d97706) !important; color: #fff !important; border-color: #fbbf24 !important; animation: none; }
@keyframes goldPulse { 0%,100% { box-shadow: 0 0 0 rgba(251,191,36,0); } 50% { box-shadow: 0 0 14px rgba(251,191,36,0.4); } }
body.theme-dark .group-chip-promos { color: rgba(255,255,255,0.85); }
body.theme-dark .product-card.has-promo { border-color: rgba(251,191,36,0.45); box-shadow: 0 0 0 1px rgba(251,191,36,0.15), 0 4px 20px rgba(251,191,36,0.10); }
body.theme-dark .product-card.has-promo:active { border-color: #fbbf24; box-shadow: 0 0 0 2px rgba(251,191,36,0.4); }
.product-card.has-promo .card-img-wrap { background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(233,69,96,0.10)); }

/* ══════════════════════════════════════════ RESET & BASE ══════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--brand-font);background:var(--brand-bg);color:var(--brand-text);min-height:100dvh;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
img{display:block;max-width:100%}
button{cursor:pointer;font-family:inherit;border:none;background:none;padding:0}
a{text-decoration:none;color:inherit}

/* ══════════════════════════════════════════ LOADING ══════════════════════════════════════════ */
#loadingScreen{position:fixed;inset:0;z-index:999;background:var(--brand-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 0.5s ease;}
#loadingScreen.out{opacity:0;pointer-events:none}
.ld-logo{font-family:'Fraunces',serif;font-size:36px;font-weight:300;color:#fff;letter-spacing:-1px;}
.ld-logo span{color:var(--brand-accent)}
.ld-bar-wrap{width:120px;height:1px;background:rgba(255,255,255,0.15)}
.ld-bar{height:1px;background:var(--brand-accent);width:0%;transition:width 0.4s ease}
.ld-text{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.35)}

/* ══════════════════════════════════════════ ERROR STATE (v1.10) ══════════════════════════════════════════ */
#errorState{
  display:none;position:fixed;inset:0;z-index:998;
  background:var(--brand-primary);
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;gap:16px;
  color:#fff;
}
#errorState.show{display:flex}
.es-emoji{font-size:64px;opacity:0.85}
.es-brand{
  font-family:'Fraunces',serif;font-size:28px;font-weight:300;letter-spacing:-0.5px;
  color:#fff;margin-bottom:4px;
}
.es-brand span{color:var(--brand-accent)}
.es-title{
  font-size:18px;font-weight:600;letter-spacing:-0.2px;
  color:rgba(255,255,255,0.95);max-width:320px;line-height:1.3;
}
.es-subtitle{
  font-size:13px;color:rgba(255,255,255,0.55);
  max-width:300px;line-height:1.5;margin-bottom:8px;
}
.es-btn{
  background:var(--brand-accent);color:#fff;
  padding:14px 36px;border-radius:28px;
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:0.3px;
  border:none;cursor:pointer;
  box-shadow:0 6px 20px rgba(233,69,96,0.4);
  transition:transform var(--transition);
}
.es-btn:active{transform:scale(0.96)}
.es-mesa{
  font-size:11px;color:rgba(255,255,255,0.35);
  letter-spacing:1.5px;text-transform:uppercase;
  margin-top:12px;
}

/* ══════════════════════════════════════════ HEADER ══════════════════════════════════════════ */
#header{position:sticky;top:0;z-index:100;background:var(--brand-primary);color:#fff;}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:54px;max-width:480px;margin:0 auto;}
.brand-logo-wrap{display:flex;align-items:center;gap:10px}
.brand-logo-img{height:32px;width:auto;border-radius:4px}
.brand-logo-text{font-family:'Fraunces',serif;font-size:20px;font-weight:300;letter-spacing:-0.5px;color:#fff;}
.header-right{display:flex;align-items:center;gap:8px}
/* v1.10 · Header chips equiparati · Mesa + Lingua come fratelli visivi
   Stessa altezza (28px), stesso radius, stessa opacità sfondo.
   Distinzione solo nel contenuto: numero tavolo vs bandiera+freccia. */
.lang-btn{
  position:relative;display:flex;align-items:center;gap:4px;
  height:28px;padding:0 10px;border-radius:14px;
  background:rgba(255,255,255,0.12);
  color:rgba(255,255,255,0.9);
  border:none;cursor:pointer;
  transition:background var(--transition);
}
.lang-btn:active{background:rgba(255,255,255,0.2)}
.lang-flag{font-size:15px;line-height:1}
.lang-arrow{font-size:9px;opacity:0.55;line-height:1;margin-left:1px}
.lang-dropdown{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--brand-primary);border:1px solid rgba(255,255,255,0.12);border-radius:10px;overflow:hidden;min-width:140px;z-index:200;}
.lang-dropdown.open{display:block}
.lang-option{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;color:rgba(255,255,255,0.75);cursor:pointer;transition:background var(--transition);}
.lang-option:hover,.lang-option.active{background:rgba(255,255,255,0.08);color:#fff;}
.lang-option .flag{font-size:16px}
#memberBanner{display:none;background:linear-gradient(135deg,var(--brand-accent),#c73050);padding:8px 16px;text-align:center;font-size:12px;color:#fff;font-weight:500;}
#memberBanner.show{display:block}

/* ══════════════════════════════════════════ FAJA / RHYTHM ══════════════════════════════════════════ */
#fajaBar{position:sticky;top:54px;z-index:98;background:var(--rhythm-bg);border-bottom:1px solid var(--brand-border);overflow:hidden;box-shadow:0 1px 0 var(--brand-border);}
.rhythm-label{font-size:9px;color:var(--rhythm-label);letter-spacing:2px;text-transform:uppercase;padding:8px 16px 0;max-width:480px;margin:0 auto;display:none;}
/* v1.10 · rhythm-label rimossa dal flow visibile · resta solo per fallback se serve in futuro */
body.theme-dark .rhythm-label{display:none}
/* v1.10 · Waveform variante B · 22px · 24 barre · drop-shadow potenziato · firma musicale del momento */
/* v1.10 · Waveform mobile-first · 20 barre più solide · variante B+
   Su mobile (380px) le barre 2-3px sparivano per sub-pixel rendering.
   Soluzione: meno barre + più larghe + gap maggiore + meno glow.
   Risultato: barre visibili su mobile, eleganti su desktop.
   v1.10-final · +1mm spessore (barre 6px · altezza 28px) per più presenza. */
.rhythm-waveform{display:none;align-items:flex-end;gap:3px;height:28px;padding:8px 16px 12px;max-width:480px;margin:0 auto;}
body.theme-dark .rhythm-waveform{display:flex}
.wf-bar{flex:1;min-width:6px;background:linear-gradient(to top,var(--brand-accent) 0%,var(--brand-accent) 60%,rgba(233,69,96,0.55) 100%);border-radius:2px;filter:drop-shadow(0 0 2px rgba(233,69,96,0.7));transform-origin:bottom;animation:pulse 0.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scaleY(0.55)}50%{transform:scaleY(1)}}
.faja-scroll{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;max-width:480px;margin:0 auto;}
/* v1.10 · faja-scroll nascosto su BKS (dark mode) · il Ritmo è il vero filtro temporale · su PINSA invariato */
body.theme-dark .faja-scroll{display:none}
.faja-scroll::-webkit-scrollbar{display:none}
.faja-chip{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.3px;background:var(--rhythm-chip-bg);border:1.5px solid var(--brand-border);color:var(--rhythm-chip-text);transition:all var(--transition);cursor:pointer;}
.faja-chip.active{background:var(--brand-primary);border-color:var(--brand-primary);color:#fff;}
.faja-chip.current{border-color:var(--brand-accent);color:var(--brand-accent);}
.faja-chip.current.active{background:var(--brand-accent);border-color:var(--brand-accent);color:#fff;}

/* v1.11 · ex CSS searchBar/search-inner sticky · RIMOSSO.
   La search vive ora in #searchOverlay full-screen, attivata da .header-search-btn.
   Vedi sezione "SEARCH OVERLAY" nel CSS più sotto. */

/* ══════════════════════════════════════════ MACRO-GROUPS ══════════════════════════════════════════ */
/* v1.11 iter 2 · #groupBar NON sticky · scrolla via durante scroll content (decisione UX:
   le macro-groups sono navigazione di alto livello, non servono incollate sempre.
   Il bug di "card mezze visibili sotto cat-tabs" è risolto dal bg solido + fade-mask
   della cat-sticky stessa, NON dal rendere sticky il groupBar). */
#groupBar{display:none;background:var(--group-bg);border-bottom:1px solid var(--brand-border);padding:12px 16px;max-width:480px;margin:0 auto;}
#groupBar.show{display:block}
.group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.group-grid.g-2{grid-template-columns:repeat(2,1fr)}
.group-grid.g-4{grid-template-columns:repeat(4,1fr)}
.group-chip{padding:10px 6px;border-radius:10px;background:var(--group-inactive-bg);color:var(--group-inactive-text);text-align:center;cursor:pointer;transition:all var(--transition);border:none;font-family:inherit;}
.group-chip:active{transform:scale(0.96)}
.group-chip.active{background:var(--brand-primary);color:#fff;}
/* v1.10 · macro-group disabled (count=0) · visibile ma non cliccabile */
.group-chip.disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;}
.group-chip.disabled:active{transform:none}
body.theme-dark .group-chip.disabled{opacity:0.35}
.group-chip-emoji{font-size:16px;display:block;margin-bottom:2px}
.group-chip-name{font-size:10px;font-weight:600;display:block}
.group-chip-count{font-size:8px;opacity:0.6;display:block;margin-top:1px}

/* ══════════════════════════════════════════ CROSS-SELL STRIP · v1.12 S5 ══════════════════════════════════════════
   Tono 3 · quarto livello cromatico (decisione design Alberto S5):
   - bg #1A1A2E (PINSA primary usato come bg neutro caldo, distinto da chrome navigation)
   - border accent rosso 0.18 alpha sopra/sotto + spilla verticale sx 3px
   - micro-label "★ Sugerencia del momento" in 9px accent muto
   - foto 40×40 + intro+nome + prezzo+freccia
   - hidden by default, JS controlla visibilità per categoria
   ───────────────────────────────────────────────────────────────────────────── */
#crossSellStrip{
  display:none;
  background:#1A1A2E;
  border-top:1px solid rgba(233,69,96,0.18);
  border-bottom:1px solid rgba(233,69,96,0.18);
  position:sticky;
  top:104px;        /* default: subito sotto header+fajaBar · ricalibrato da updateStickyTops */
  z-index:97;       /* tra fajaBar (98) e cat-sticky (96) */
  max-width:480px;
  margin:0 auto;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background 0.2s;
}
#crossSellStrip.visible{display:block;}
#crossSellStrip:active{background:#22223D}
#crossSellStrip::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:linear-gradient(180deg,transparent,var(--brand-accent) 50%,transparent);
  opacity:0.7;
  pointer-events:none;
}
.xs-label{
  padding:6px 16px 0;font-size:9px;color:rgba(233,69,96,0.85);
  letter-spacing:2.5px;text-transform:uppercase;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.xs-label::before{
  content:'';width:5px;height:5px;border-radius:50%;background:var(--brand-accent);
  box-shadow:0 0 6px var(--brand-accent);
}
.xs-row{
  padding:6px 16px 10px;
  display:flex;align-items:center;gap:10px;
}
.xs-photo{
  width:40px;height:40px;border-radius:8px;flex-shrink:0;
  background:#1F1F38;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.xs-photo img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.xs-photo-emoji{font-size:20px;}
.xs-content{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.xs-intro{
  font-size:9px;color:rgba(255,255,255,0.55);
  letter-spacing:2.5px;text-transform:uppercase;font-weight:600;
}
.xs-name{
  font-size:13px;font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.xs-price-arrow{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.xs-price{font-size:13px;font-weight:500;color:rgba(255,255,255,0.85);}
.xs-arrow{
  width:24px;height:24px;border-radius:50%;
  background:var(--brand-accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;line-height:1;
}
/* Light mode (PINSA Candelaria) · stesso pattern, palette adattata */
body:not(.theme-dark) #crossSellStrip{
  background:#FBFAF7;  /* tono caldo distinto dal bg principale */
  border-top:1px solid rgba(233,69,96,0.18);
  border-bottom:1px solid rgba(233,69,96,0.18);
}
body:not(.theme-dark) #crossSellStrip:active{background:#F2F0EA}
body:not(.theme-dark) .xs-photo{background:#F0EEE8;}
body:not(.theme-dark) .xs-name{color:var(--brand-text);}
body:not(.theme-dark) .xs-price{color:var(--brand-text);}
body:not(.theme-dark) .xs-intro{color:rgba(0,0,0,0.55);}

/* ══════════════════════════════════════════ MAIN ══════════════════════════════════════════ */
/* v1.11 · padding-bottom ridotto: il FAB ora vive DENTRO bottom-nav, non più flottante esterno.
   80px = bottom-nav reale (~70px con FAB rialzato) + 10px respiro sotto ultima card. */
#mainContent{max-width:480px;margin:0 auto;padding-bottom:80px;}
/* v1.11 iter 2 fix · cat-sticky · top 104px (header 54 + faja 50)
   Ricalibrato da updateStickyTops() in JS quando groupBar è visibile.
   IMPORTANTE: bg deve essere SOLIDO (non semitrasparente) altrimenti le macro-groups
   che scrollano sotto si vedono attraverso. */
.cat-sticky{position:sticky;top:104px;z-index:96;background:var(--brand-surface);border-bottom:1px solid var(--brand-border);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.cat-sticky::before{
  content:'';
  position:absolute;
  top:-12px;left:0;right:0;
  height:12px;
  background:linear-gradient(to bottom,transparent,var(--brand-surface));
  pointer-events:none;
}
.cat-tabs{display:flex;gap:4px;padding:0 16px;overflow-x:auto;scrollbar-width:none;}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:10px 12px;font-size:12px;font-weight:500;color:var(--brand-text-muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all var(--transition);}
.cat-tab.active{color:var(--brand-primary);border-bottom-color:var(--brand-accent);}
.cat-tab-emoji{font-size:14px}
/* v1.11 iter 2 · DARK MODE · cat-sticky con bg solido che copre macro-groups in scroll
   + bordo top accent per stacco dal nero come richiesto da Alberto */
body.theme-dark .cat-sticky{
  background: var(--brand-surface);
  border-top: 1px solid var(--brand-border);
  border-bottom: 1px solid var(--brand-border);
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
/* fade-mask più aggressivo · 20px gradient da bg trasparente a surface solido
   maschera il momento in cui le macro-groups scivolano sotto la barra cat */
body.theme-dark .cat-sticky::before{
  background: linear-gradient(to bottom, transparent, var(--brand-bg) 50%, var(--brand-surface));
  height: 20px;
  top: -20px;
}
/* v1.10 · Cat header compatto · breadcrumb invece di titolone serif */
.cat-header{padding:8px 16px 4px;display:flex;align-items:center;gap:6px;}
.cat-header-emoji{font-size:11px;opacity:0.7}
.cat-header-name{font-family:'Outfit',sans-serif;font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--brand-text-muted);}
.cat-header-count{font-size:9px;color:var(--brand-text-muted);margin-left:auto;letter-spacing:0.5px;}
body.theme-dark .cat-header-name{color:rgba(255,255,255,0.45)}
body.theme-dark .cat-header-count{color:rgba(255,255,255,0.4)}

/* ══════════════════════════════════════════ PRODUCT CARD v2 ══════════════════════════════════════════ */
/* v1.10 · Card v2 compatta · 3 prodotti per schermata invece di 1.5
   Layout: foto piccola sx (50px) · titolo+badge+descr centro · prezzo+campanella dx
   Risultato: ~80-90px altezza vs ~220px versione v1 */
/* v1.11 · CARD prodotto v3 (Strada C)
   ─ nome + prezzo sulla stessa riga in alto
   ─ descrizione 2 righe piene a 12px (no compressione)
   ─ badge NUEVO = dot verde sull'angolo top-right della foto
   ─ niente più campanella per card
   ─ niente più bordo verde animato
   ─ prezzo senza simbolo, peso medium 14px neutro chiaro */
.product-list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.product-card{background:var(--brand-surface);border-radius:14px;border:1px solid var(--brand-border);position:relative;transition:border-color var(--transition);cursor:pointer;padding:12px;display:flex;gap:12px;align-items:flex-start;}
.product-card:active{border-color:rgba(233,69,96,0.4)}
.product-card.agotado{opacity:0.55}
/* v1.11 · classe .nuevo-highlight conservata per compat ma SENZA bordo verde animato.
   La novità è marcata SOLO dal dot verde sulla foto (.card-nuevo-dot). */
.card-img-wrap{width:62px;height:62px;flex-shrink:0;background:var(--brand-bg);position:relative;overflow:visible;border-radius:10px;}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:center;border-radius:10px;}
.card-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;opacity:0.5;border-radius:10px;}
/* v1.11 · dot NUEVO sull'angolo top-right della foto */
.card-nuevo-dot{
  position:absolute;
  top:-3px;right:-3px;
  width:14px;height:14px;
  border-radius:50%;
  background:#4ade80;
  border:2px solid var(--brand-surface);
  box-shadow:0 0 0 1px rgba(74,222,128,0.4);
  z-index:2;
}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:1px;}
/* v1.11 · top row: nome + prezzo allineati */
.card-top-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.card-name{font-size:15px;font-weight:600;color:var(--brand-text);line-height:1.2;letter-spacing:-0.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-name.agotado-text{text-decoration:line-through;color:var(--brand-text-muted)}
.card-price{font-size:14px;font-weight:500;color:var(--brand-text);opacity:0.85;font-feature-settings:"tnum";letter-spacing:0.3px;flex-shrink:0;white-space:nowrap;}
.card-price-orig{font-size:11px;font-weight:400;text-decoration:line-through;opacity:0.5;margin-right:6px;}
/* v1.11 · descrizione 2 righe piene */
.card-desc{font-size:12px;color:var(--brand-text-muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
/* badges (popular, vegano, etc) restano disponibili ma in formato mini sotto */
.card-badges{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:2px;}
.badge{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:8px;font-size:8px;font-weight:700;letter-spacing:0.7px;text-transform:uppercase;}
.badge-popular{background:rgba(245,158,11,0.15);color:#d97706}
.badge-vegano{background:rgba(132,204,22,0.15);color:#65a30d}
.badge-singluten{background:rgba(96,165,250,0.15);color:#2563eb}
.badge-chef{background:rgba(249,115,22,0.15);color:#ea580c}
.badge-temporada{background:rgba(167,139,250,0.15);color:#7c3aed}
.badge-agotado{background:rgba(148,163,184,0.15);color:#64748b}
.badge-member{background:rgba(233,69,96,0.15);color:#be185d}
/* v1.11 · badge-nuevo conservato per compat ma DISPLAY:NONE.
   Il "NUEVO" si vede solo dal dot verde sulla foto. */
.badge-nuevo{display:none}
.agotado-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.55);border-radius:14px;}
.product-card.agotado .agotado-overlay{display:flex}
.agotado-label{background:rgba(100,116,139,0.9);color:#fff;padding:3px 12px;border-radius:14px;font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;}

/* v1.11 · card-call-btn (campanella per-prodotto) RIMOSSA dalle card.
   Il selector resta definito per la SCHEDA dettaglio (che usa stesso stile). */
.card-call-btn{
  width:30px;height:30px;border-radius:50%;
  background:rgba(233,69,96,0.12);
  border:1px solid rgba(233,69,96,0.4);
  color:var(--brand-accent);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;
  transition:transform var(--transition),background var(--transition);
}
.card-call-btn:active{transform:scale(0.92);background:rgba(233,69,96,0.25)}
body.theme-dark .card-call-btn{
  background:rgba(233,69,96,0.18);
  border-color:rgba(233,69,96,0.5);
  color:#fb7185;
}
.card-pedir-btn{display:none;width:30px;height:30px;border-radius:50%;background:var(--brand-primary);color:#fff;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
body.feature-pedir-directo .card-pedir-btn{display:flex}

/* CONFIRM SHEET */
#confirmOverlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.55);opacity:0;transition:opacity 0.25s ease;}
#confirmOverlay.open{display:block;opacity:1}
#confirmSheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:100%;max-width:480px;z-index:401;background:var(--brand-surface);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,0.25);transition:transform 0.32s cubic-bezier(0.32,0.72,0,1);}
#confirmSheet.open{transform:translate(-50%,0)}
.confirm-handle{width:36px;height:4px;border-radius:2px;background:var(--brand-border);margin:0 auto 16px;}
.confirm-icon{width:56px;height:56px;border-radius:50%;background:rgba(233,69,96,0.12);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;}
.confirm-title{font-size:18px;font-weight:600;color:var(--brand-text);text-align:center;margin-bottom:6px;line-height:1.3;}
.confirm-subtitle{font-size:13px;color:var(--brand-text-muted);text-align:center;margin-bottom:20px;}
.confirm-actions{display:flex;gap:10px;}
.confirm-btn{flex:1;padding:14px;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:opacity var(--transition), transform var(--transition);}
.confirm-btn:active{transform:scale(0.97)}
.confirm-btn-cancel{background:var(--brand-bg);color:var(--brand-text-muted);}
body.theme-dark .confirm-btn-cancel{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);}
.confirm-btn-ok{background:var(--brand-accent);color:#fff;box-shadow:0 4px 14px rgba(233,69,96,0.3);}

/* DETAIL SHEET */
#detailOverlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.5);}
#detailOverlay.open{display:block}
#detailSheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:100%;max-width:480px;z-index:301;background:var(--brand-surface);border-radius:20px 20px 0 0;max-height:90dvh;overflow-y:auto;transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);}
#detailSheet.open{transform:translate(-50%,0)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--brand-border);margin:12px auto 0;}
.sheet-img{width:100%;height:220px;background:var(--brand-bg);object-fit:cover;position:relative;}
.sheet-img img{width:100%;height:100%;object-fit:cover}
.sheet-img-ph{width:100%;height:220px;display:flex;align-items:center;justify-content:center;background:var(--brand-bg);font-size:64px;opacity:0.15;}
.sheet-body{padding:20px 20px 30px}
.sheet-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sheet-name{font-family:'Fraunces',serif;font-size:28px;font-weight:300;letter-spacing:-0.5px;color:var(--brand-primary);margin-bottom:8px;line-height:1.15;}
.sheet-desc{font-size:14px;line-height:1.6;color:var(--brand-text-muted);margin-bottom:16px;}
.sheet-price-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.sheet-price{font-size:28px;font-weight:700;color:var(--brand-accent);}
.sheet-price-orig{font-size:16px;font-weight:400;text-decoration:line-through;color:var(--brand-text-muted);margin-right:8px;}
#upsellSection{display:none;border-top:1px solid var(--brand-border);padding-top:16px;margin-top:4px;}
#upsellSection.show{display:block}
.upsell-title{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--brand-text-muted);margin-bottom:12px;}
.upsell-scroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
.upsell-scroll::-webkit-scrollbar{display:none}
.upsell-card{flex-shrink:0;width:130px;background:var(--brand-bg);border:1px solid var(--brand-border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color var(--transition);}
.upsell-card:active{border-color:var(--brand-accent)}
.upsell-img{width:100%;height:80px;background:var(--brand-border);object-fit:cover;}
.upsell-img img{width:100%;height:100%;object-fit:cover}
.upsell-img-ph{width:100%;height:80px;display:flex;align-items:center;justify-content:center;font-size:28px;opacity:0.2;}
.upsell-info{padding:8px 10px}
.upsell-name{font-size:12px;font-weight:500;line-height:1.3;margin-bottom:3px}
.upsell-price{font-size:12px;font-weight:700;color:var(--brand-accent)}

/* EMPTY / TOAST / STICKY CALL / BOTTOM NAV / MESA */
#emptyState{display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;text-align:center;}
#emptyState.show{display:flex}
.empty-emoji{font-size:48px;opacity:0.2}
.empty-text{font-size:14px;color:var(--brand-text-muted)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brand-primary);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:all 0.3s ease;z-index:500;white-space:nowrap;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* v1.11 · LENTE search nell'header alto (sostituisce searchBarWrap sticky)
   ─ tap → apre overlay search full-screen */
.header-search-btn{
  width:36px;height:36px;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:background var(--transition), transform var(--transition);
}
.header-search-btn:active{transform:scale(0.95);background:rgba(255,255,255,0.15)}
.header-search-icon{font-size:16px;line-height:1;font-weight:600}
body.theme-dark .header-search-btn{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.1)}
body.theme-dark .header-search-btn:active{background:rgba(255,255,255,0.12)}

/* v1.11 · SEARCH OVERLAY full-screen (sostituisce search bar sticky)
   ─ aperto da #headerSearchBtn
   ─ chiuso da ← back o ESC o swipe-down */
#searchOverlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:500;
  background:var(--brand-bg);
  flex-direction:column;
  animation:searchOverlayIn 0.22s ease;
}
#searchOverlay.open{display:flex}
@keyframes searchOverlayIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.search-overlay-header{
  display:flex;align-items:center;gap:10px;
  padding:14px 14px calc(10px + env(safe-area-inset-top));
  padding-top:calc(14px + env(safe-area-inset-top));
  border-bottom:1px solid var(--brand-border);
  flex-shrink:0;
  background:var(--brand-bg);
}
.search-overlay-back{
  width:36px;height:36px;
  border-radius:50%;
  background:transparent;
  border:1px solid var(--brand-border);
  color:var(--brand-text);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;
  transition:background var(--transition);
  flex-shrink:0;
}
.search-overlay-back:active{background:var(--brand-surface)}
.search-overlay-input-wrap{
  flex:1;
  background:var(--brand-surface);
  border:1px solid var(--brand-border);
  border-radius:22px;
  padding:8px 14px;
  display:flex;align-items:center;gap:8px;
}
.search-overlay-input-wrap:focus-within{border-color:var(--brand-accent)}
.search-overlay-icon{font-size:14px;opacity:0.5;flex-shrink:0;font-weight:600}
#searchInput{flex:1;border:none;background:none;font-family:inherit;font-size:14px;color:var(--brand-text);outline:none;min-width:0;}
#searchInput::placeholder{color:var(--brand-text-muted)}
#searchClear{font-size:14px;opacity:0.4;display:none;padding:2px;background:none;border:none;color:var(--brand-text-muted);cursor:pointer;flex-shrink:0;}
#searchClear.show{display:block}
#searchClear:active{opacity:0.8}
.search-overlay-results{
  flex:1;
  overflow-y:auto;
  padding:6px 12px 16px;
}
.search-overlay-empty{
  text-align:center;
  padding:60px 20px;
  color:var(--brand-text-muted);
  font-size:13px;
}
.search-overlay-empty-emoji{font-size:48px;opacity:0.2;margin-bottom:12px;}
.search-overlay-result-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 6px;
  border-bottom:1px solid var(--brand-border);
  cursor:pointer;
  transition:background var(--transition);
}
.search-overlay-result-item:active{background:var(--brand-surface)}
.search-overlay-result-img{
  width:44px;height:44px;
  border-radius:9px;
  background:var(--brand-bg);
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.search-overlay-result-img img{width:100%;height:100%;object-fit:cover}
.search-overlay-result-img-ph{font-size:18px;opacity:0.4}
.search-overlay-result-info{flex:1;min-width:0;}
.search-overlay-result-name{font-size:13px;font-weight:500;color:var(--brand-text);line-height:1.2;}
.search-overlay-result-desc{font-size:11px;color:var(--brand-text-muted);margin-top:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.search-overlay-result-price{font-size:12px;color:var(--brand-text);opacity:0.7;font-weight:500;flex-shrink:0;font-feature-settings:"tnum";}
mark.search-match{background:rgba(233,69,96,0.25);color:var(--brand-accent);padding:0 2px;border-radius:2px;}
body.theme-dark mark.search-match{color:#ff6b8a}

/* v1.11 · stickyCallBar (FAB flottante) RIMOSSO.
   La campanella vive ora come FAB integrato CENTRALE nella bottom-nav.
   I selettori .sticky-call-* sono conservati ma non più montati nel DOM. */
@keyframes fabPulse{
  0%,100%{box-shadow:0 6px 16px rgba(233,69,96,0.35)}
  50%{box-shadow:0 6px 22px rgba(233,69,96,0.6)}
}

/* v1.11 · BOTTOM NAV nuovo · 3 voci con FAB centrale rialzato (Llamar) */
#bottomNav{position:fixed;bottom:0;left:0;right:0;background:var(--brand-surface);border-top:1px solid var(--brand-border);padding:8px 0 calc(12px + env(safe-area-inset-bottom));z-index:100;}
.bnav-inner{display:flex;align-items:flex-end;justify-content:space-around;max-width:480px;margin:0 auto;}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;background:transparent;border:none;border-radius:8px;font-family:inherit;font-size:10px;font-weight:500;color:var(--brand-text-muted);transition:color var(--transition);cursor:pointer;}
.bnav-btn.active{color:var(--brand-accent)}
.bnav-icon{font-size:20px;line-height:1}
/* FAB integrato centrale */
.bnav-fab-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;}
.bnav-fab{
  width:56px;height:56px;
  border-radius:50%;
  background:var(--brand-accent);
  border:4px solid var(--brand-surface);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  margin-top:-22px;margin-bottom:2px;
  box-shadow:0 6px 16px rgba(233,69,96,0.35);
  animation:fabPulse 2.4s ease-in-out infinite;
  transition:transform var(--transition);
  position:relative;
  padding:0;
}
.bnav-fab:active{transform:scale(0.92)}
.bnav-fab-icon{font-size:24px;line-height:1}
.bnav-fab-label{font-size:10px;font-weight:600;color:var(--brand-accent);letter-spacing:0.3px;}
body.theme-dark .bnav-fab-label{color:#ff6b8a}
body.theme-dark .bnav-fab{border-color:var(--brand-surface)}
#mesaBadge{
  display:none;
  height:28px;padding:0 10px;border-radius:14px;
  background:rgba(255,255,255,0.12);
  font-size:11px;font-weight:600;letter-spacing:0.5px;
  color:rgba(255,255,255,0.9);
}
#mesaBadge.show{display:flex;align-items:center;gap:5px}
.mesa-icon{font-size:13px;line-height:1}

/* SKELETON */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{background:linear-gradient(90deg,var(--brand-border) 25%,rgba(0,0,0,0.04) 50%,var(--brand-border) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
.skel-card{height:100px;background:var(--brand-surface);border-radius:14px;border:1px solid var(--brand-border);overflow:hidden;display:flex;gap:0;}
.skel-img{width:100px;flex-shrink:0}.skel-img div{width:100%;height:100%}
.skel-body{flex:1;padding:14px;display:flex;flex-direction:column;gap:8px}
.skel-title{height:16px;width:70%}
.skel-desc{height:12px;width:90%}
.skel-desc2{height:12px;width:60%}
.skel-price{height:18px;width:35%;margin-top:auto}

.hidden{display:none!important}
.currency::before{content:attr(data-symbol)}
</style>

const LANG_LABELS = { es:'Español', en:'English', pt:'Português', it:'Italiano', de:'Deutsch', fr:'Français', zh:'中文', ja:'日本語' };
if(!TRANSLATIONS[LANG_CODE]) LANG_CODE = 'es';
function getLang(k){ return (TRANSLATIONS[LANG_CODE]||TRANSLATIONS.es)[k] || k; }

function getCatName(catId){
  const key = 'cat_' + catId.toLowerCase().replace(/[^a-z]/g,'');
  const t = TRANSLATIONS[LANG_CODE] || TRANSLATIONS.es;
  if(t[key]) return t[key];
  return prettifyCategoryName(catId);
}
function prettifyCategoryName(id){
  if(!id) return '';
  // v1.10 · accentFix include override per categorie composte con nome troppo lungo
  // Default usa " & " ma per casi specifici uso " / " più corto o nomi alternativi
  const accentFix = {
    'nino':'Niño','anos':'Años','cafe':'Café','jugos':'Jugos',
    'acompanamientos':'Acompañamientos','espana':'España',
    'pizzas_burger':'Pizzas/Burgers',
    'pizzas_burgers':'Pizzas/Burgers',
  };
  const low = id.toLowerCase();
  if(accentFix[low]) return accentFix[low];
  return id.split('_').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' & ');
}
function toTitleCase(str){
  if(!str) return str;
  return str.toLowerCase().replace(/(?:^|\s|-)\S/g, c => c.toUpperCase()).replace(/\b([A-Z]{1,3})\b/g, m => m);
}

let BRAND = {
  name:'Menú',
  logo_url:'',
  logo_emoji:'✦',
  favicon_url:'',
  color_primary:'#1A1A2E',
  color_accent:'#E94560',

function applyBrand(b){
  if(!b) return;
  Object.assign(BRAND, b);
  document.title = BRAND.name + ' · Menú';
  const r = document.documentElement.style;
  r.setProperty('--brand-primary', BRAND.color_primary);
  r.setProperty('--brand-accent',  BRAND.color_accent);
  if(BRAND.color_bg) r.setProperty('--brand-bg', BRAND.color_bg);
  if(BRAND.logo_url){
    document.getElementById('brandLogoImg').src = BRAND.logo_url;
    document.getElementById('brandLogoImg').classList.remove('hidden');
    document.getElementById('brandLogoText').classList.add('hidden');
  } else {
    document.getElementById('brandLogoText').textContent = BRAND.logo_emoji + '\u00A0' + BRAND.name;
    document.getElementById('brandLogoText').classList.remove('hidden');
    document.getElementById('brandLogoImg').classList.add('hidden');
  }
  const faviconTag = document.getElementById('faviconTag');
  if(BRAND.favicon_url){
    faviconTag.href = BRAND.favicon_url;
  } else {
    const enc = encodeURIComponent(BRAND.logo_emoji || '🍽️');
    const col = encodeURIComponent(BRAND.color_primary || '#1A1A2E');
    faviconTag.href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='${col}'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='20'>${enc}</text></svg>`;
  }
  document.getElementById('ldBrand').innerHTML = `<span>${BRAND.logo_emoji}</span> ${BRAND.name}`;
  // v1.10 · Risoluzione lingua post-brand:
  //   1. ?lang=xx URL (deliberato chi ha fatto il QR) — vince su tutto
  //   2. localStorage 'menu_lang_user_choice' — scelta esplicita cliente
  //   3. brand.default_lang dal GAS — lingua predefinita del locale
  //   4. 'es' fallback finale
  const urlLang = URL_PARAMS.get('lang');
  let userChoice = null;
  try { userChoice = localStorage.getItem('menu_lang_user_choice'); } catch(e){}
  if(urlLang && TRANSLATIONS[urlLang]){
    LANG_CODE = urlLang;
  } else if(userChoice && TRANSLATIONS[userChoice]){
    LANG_CODE = userChoice;
  } else if(BRAND.default_lang && TRANSLATIONS[BRAND.default_lang]){
    LANG_CODE = BRAND.default_lang;
  } else {
    LANG_CODE = 'es';
  }
}

function purgeOldLangKey(){
  // La chiave vecchia 'menu_lang' veniva scritta su QUALSIASI cambio lingua
  // anche durante test interni. Risultato: telefoni che mostrano italiano
  // o tedesco al posto dello spagnolo a sessioni successive.

  try {
    if(localStorage.getItem('menu_lang') !== null){
      localStorage.removeItem('menu_lang');

}

/* ════════════════════════════════════════════════════
   v1.10 · initWaveform — 24 barre stabili pseudo-random
   ════════════════════════════════════════════════════ */
// Genera 24 barre per il waveform BKS. Le altezze sono pre-calcolate per dare
// l'impressione di un'onda audio reale (alterna picchi alti e valli basse).
// Il delay staggered su ogni barra crea l'effetto di propagazione del suono.
// Solo theme-dark (BKS) effettivamente le mostra (CSS fa il resto).
function initWaveform(){
  const wf = document.getElementById('rhythmWaveform');
  if(!wf) return;
  // v1.10 · 20 barre (era 24) · più larghe e visibili su mobile
  // Pattern audio-like (asimmetrico) — alterna picchi e valli per sembrare onda reale
  const heights = [55,82,42,90,65,72,48,86,58,75,40,68,80,52,70,45,62,88,55,73];
  const html = heights.map((h,i) => {

function pingGAS(){
  // Sveglia il GAS mentre il cliente vede lo skeleton.
  // Quando arriva la chiamata vera getConfig (qualche centinaio di ms dopo),
  // l'istanza Apps Script è già calda e risponde in <500ms.
  const url = GAS_URL + '?action=ping&local=' + encodeURIComponent(LOCAL_ID) + '&t=' + Date.now();
  // mode:no-cors → niente preflight CORS, niente errori se la risposta non è leggibile.
  // Non aspettiamo la risposta, è solo per riscaldare il container Apps Script.
  fetch(url, { mode:'no-cors', cache:'no-store' })
    .then(()=> console.log('[v1.10] GAS warm-up ping inviato'))
    .catch(()=> { /* silent · è solo warm-up */ });
}

/* ════════════════════════════════════════════════════
   v1.10 · loadMenuWithRetry — 3 tentativi con backoff
   ════════════════════════════════════════════════════ */
async function loadMenuWithRetry(){
  const ATTEMPTS  = 3;
  const TIMEOUT_MS = 10000;     // 10s per tentativo (cold start GAS osservato 4-8s)
  const BACKOFFS  = [0, 1500, 2500];  // pause prima del tentativo i

  let lastError = null;
  for(let i = 0; i < ATTEMPTS; i++){
    if(BACKOFFS[i] > 0){
      console.log(`[v1.10] retry ${i+1}/${ATTEMPTS} dopo ${BACKOFFS[i]}ms`);
      await sleep(BACKOFFS[i]);
    }
    try {
      await loadFromSheet(TIMEOUT_MS);
      console.log(`[v1.10] loadFromSheet OK al tentativo ${i+1}/${ATTEMPTS}`);
      return;  // success
    } catch(e){
      lastError = e;
      const isRetriable = isRetriableError(e);
      console.warn(`[v1.10] tentativo ${i+1}/${ATTEMPTS} fallito (retriable=${isRetriable}):`, e.message);
      if(!isRetriable) break;  // errori "duri" → no retry
    }
  }
  // Tutti i tentativi falliti
  throw lastError || new Error('unknown error after retries');
}

function isRetriableError(e){
  if(!e) return false;
  // AbortError (timeout) e TypeError (network failure) sono recuperabili
  if(e.name === 'AbortError') return true;
  if(e.name === 'TypeError') return true;  // "Failed to fetch", DNS, ecc
  // Errori applicativi (404, JSON malformato, "No products parsed") non sono retriable
  return false;
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

/* ════════════════════════════════════════════════════

async function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const tid  = setTimeout(()=>ctrl.abort(), ms);
  try {
    const r = await fetch(url, {signal: ctrl.signal});
    clearTimeout(tid);
    return r;
  } catch(e) {
    clearTimeout(tid);
    throw e;
  }
}

async function loadFromSheet(timeoutMs){
  setProgress(10);

  // STEP 1 · getConfig
  const cfgUrl = GAS_URL + '?action=getConfig&local=' + encodeURIComponent(LOCAL_ID) + '&t=' + Date.now();
  const cfgResp = await fetchWithTimeout(cfgUrl, timeoutMs).then(r=>r.json());

  if(!cfgResp || !cfgResp.ok){
    // Errore applicativo (es. local non in Registry) → non retriable
    const err = new Error('getConfig failed for local=' + LOCAL_ID + ': ' + (cfgResp?.error || 'no response'));
    err.name = 'AppError';
    throw err;
  }

  const cfg = cfgResp.config || {};
  setProgress(40);

  applyBrand({
    name:            cfg.brand_name         || KNOWN_LOCALS[LOCAL_ID]?.name || LOCAL_ID,
    logo_url:        cfg.brand_logo_url     || '',
    logo_emoji:      cfg.brand_logo_emoji   || KNOWN_LOCALS[LOCAL_ID]?.logo_emoji || '🍽️',
    favicon_url:     cfg.brand_favicon_url  || '',
    color_primary:   cfg.color_primary      || BRAND.color_primary,
    color_accent:    cfg.color_accent       || BRAND.color_accent,
    color_bg:        cfg.color_bg           || BRAND.color_bg,
    currency:        cfg.currency           || 'CLP',
    currency_symbol: cfg.currency_symbol    || '$',
    default_lang:    cfg.default_lang       || 'es',
    gas_url:         GAS_URL,
    nuevo_dias:      parseInt(cfg.nuevo_dias) || 14,
  });

  const theme = (cfg.theme_mode || KNOWN_LOCALS[LOCAL_ID]?.theme_mode || 'light').toLowerCase();
  document.body.classList.toggle('theme-dark', theme === 'dark');

  CATEGORY_GROUPS = null;
  if(cfg.category_groups){
    try {
      const parsed = JSON.parse(cfg.category_groups);
      if(parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0){
        CATEGORY_GROUPS = parsed;
      }
    } catch(e){ console.warn('category_groups JSON malformato:', e.message); }
  }

  // v1.12 · Cross-sell strip · master switch + frase default da PARAMETROS
  // Vuoto/falsy in Sheet → fallback ai default safety: attiva, frase tradotta da i18n.
  SUGERENCIA_ACTIVA = (String(cfg.sugerencia_activa||'TRUE').toUpperCase() !== 'FALSE');
  SUGERENCIA_FRASE_DEFAULT = (cfg.sugerencia_frase_default||'').trim();

  // STEP 2 · CSV URL
  const dataSource = cfgResp.dataSource || 'visor';
  const csvUrl = (dataSource === 'seed' && cfg.sheet_csv_url_seed)
    ? cfg.sheet_csv_url_seed
    : (cfg.sheet_csv_url_visor || cfg.sheet_csv_url);

  if(!csvUrl){
    const err = new Error('No sheet_csv_url in PARAMETROS for local=' + LOCAL_ID);
    err.name = 'AppError';
    throw err;
  }

  // STEP 3 · Fetch CSV
  const csvResp = await fetchWithTimeout(csvUrl + (csvUrl.includes('?') ? '&' : '?') + 't=' + Date.now(), timeoutMs);
  const text = await csvResp.text();
  setProgress(70);

  // STEP 4 · Parse
  const rows = parseCSV(text).slice(1);
  const parsed = rows.map(r=>({
    id:            r[0]||'',
    nombre:        r[1]||'',
    categoria:     (r[2]||'').toLowerCase(),
    descripcion:   r[3]||'',
    precio:        parsePrice(r[4]),
    imagen:        r[5]||'',
    activo:        r[6]==='TRUE',
    agotado:       r[7]==='TRUE',
    hora_inicio:   parseInt(r[8])||0,
    hora_fin:      parseInt(r[9])||24,
    badges:        r[10]||'',
    upsell_ids:    r[11]||'',
    precio_member: parsePrice(r[12]) || '',
    fecha_agregado:r[13]||'',
    menu_visible:  r[14]!=='FALSE',
    // r[15] Visor_ID · r[16] Vistas_Hoy · r[17] Precio_Almuerzo · r[18] Almuerzo_Dias (non usati lato cliente)
    // v1.12 · S5 · cross-sell strip
    sugerencia_categoria:    (r[19]||'').toLowerCase().trim(),  // ID categoria target (es. 'spritz')
    es_sugerencia_destacada: r[20]==='TRUE',                    // se TRUE, hero della sua categoria
  })).filter(p=>p.id && p.activo && p.menu_visible!==false);

  if(parsed.length === 0){
    const err = new Error('No products parsed from CSV for local=' + LOCAL_ID);
    err.name = 'AppError';
    throw err;
  }

  ALL_PRODUCTS = parsed;

  // STEP 5 · Categories
  const catIds = [...new Set(ALL_PRODUCTS.map(p=>p.categoria))];
  const catMap = {
    'alimentos':'🥪','cafe':'☕','jugos':'🥤','helados':'🍦','especiales':'✨',
    'entradas':'🦐','pastas':'🍝','fondos':'🥩','pizzas_burger':'🍕','sushi':'🍣',
    'acompanamientos':'🥗','nino':'👶','desserts':'🍰','almuerzo':'🍱',
    'bar':'🍸','sour':'🍹','mojitos':'🍃','spritz':'🥂','cervezas':'🍺',
    'vinos':'🍷','jarras':'🍶','destilados':'🥃',
    'bowls':'🥣','bebidas':'🥤','snacks':'🥪','postres':'🍰',
    'desayunos':'🍳','ensaladas':'🥗','platos':'🍽️','otros':'✦','solidos':'🍽️',
  };
  ALL_CATEGORIES = catIds.filter(Boolean).map((id,i)=>({
    id, name: id.charAt(0).toUpperCase()+id.slice(1),
    emoji: catMap[id]||'✦', orden: i+1
  }));

  setProgress(100);
}

function parseCSV(text){
  return text.split('\n').map(line=>{
    const row=[]; let cur='', inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){ inQ=!inQ; }
      else if(c===','&&!inQ){ row.push(cur.trim()); cur=''; }
      else cur+=c;
    }
    row.push(cur.trim());
    return row;
  }).filter(r=>r.some(c=>c));
}

function productInFaja(p){
  if(CURRENT_FAJA==='all') return true;
  const faja = FAJAS.find(f=>f.id===CURRENT_FAJA);

function getVisibleCategories(){
  if(!CATEGORY_GROUPS || !CURRENT_GROUP) return ALL_CATEGORIES;
  const group = CATEGORY_GROUPS[CURRENT_GROUP];
  if(!group || !group.cats) return ALL_CATEGORIES;
  return ALL_CATEGORIES.filter(c => group.cats.includes(c.id));
