function renderGroups(){
  const wrap = document.getElementById('groupBar');
  const grid = document.getElementById('groupGrid');
  const promosCount = (PROMOS_ACTIVAS || []).length;
  if(!CATEGORY_GROUPS && promosCount === 0){ wrap.classList.remove('show'); return; }
  const groupKeys = CATEGORY_GROUPS ? Object.keys(CATEGORY_GROUPS) : [];
  if(groupKeys.length < 2 && promosCount === 0){ wrap.classList.remove('show'); return; }
  const countByGroup = {};
  groupKeys.forEach(gk => {
    const cats = CATEGORY_GROUPS[gk].cats || [];
    countByGroup[gk] = ALL_PRODUCTS.filter(p =>
      cats.includes(p.categoria) && productInFaja(p)
    ).length;
  });
  const promoProdsSet = new Set();
  (PROMOS_ACTIVAS || []).forEach(p => (p.prod_ids||[]).forEach(pid => promoProdsSet.add(pid)));
  const promoProductsCount = promoProdsSet.size;
  const totalChips = groupKeys.length + (promosCount > 0 ? 1 : 0);
  grid.className = 'group-grid g-' + totalChips;
  let html = groupKeys.map(gk=>{
    const g = CATEGORY_GROUPS[gk];
    const isActive = CURRENT_GROUP === gk;
    const count = countByGroup[gk] || 0;
    // v1.10 · count=0 → disabled grigio invece di nascosto · stabilità interfaccia
    const isDisabled = count === 0;
    const onclick = isDisabled ? '' : `onclick="setGroup('${gk}')"`;
    return `
      <button class="group-chip${isActive?' active':''}${isDisabled?' disabled':''}" ${onclick}${isDisabled?' aria-disabled="true"':''}>
        <span class="group-chip-emoji">${g.emoji||'✦'}</span>
        <span class="group-chip-name">${gk}</span>
        <span class="group-chip-count">${count}</span>
      </button>`;
  }).join('');
  if(promosCount > 0){
    const isActive = CURRENT_GROUP === '__PROMOS__';
    html += `
      <button class="group-chip group-chip-promos${isActive?' active':''}" onclick="setGroup('__PROMOS__')">
        <span class="group-chip-emoji">🎁</span>
        <span class="group-chip-name">Promos</span>
        <span class="group-chip-count">${promoProductsCount}</span>
      </button>`;
  }
  grid.innerHTML = html;
  wrap.classList.add('show');
}

function setGroup(gk){
  CURRENT_GROUP = (CURRENT_GROUP === gk) ? null : gk;
  renderGroups();
  renderCatTabs();
  renderMenu();
  window.scrollTo({top:0});
  // v1.12 · S5 · update cross-sell sulla nuova prima cat del gruppo selezionato
  setTimeout(() => {
    const visibleCats = getVisibleCategories();
    if(visibleCats && visibleCats.length > 0){
      triggerCrossSellUpdate(visibleCats[0].id);
    } else {
      updateCrossSellStrip(null); // nessuna cat → strip nascosta
    }
  }, 300);
}

function scrollToCategory(id){
  const el = document.getElementById('cat-' + id);
  if(el){
    // v1.11 · searchBarWrap rimosso dalla sticky chain
    const header = document.getElementById('header');
    const faja   = document.getElementById('fajaBar');
    const cats   = document.getElementById('catSticky');
    const groups = document.getElementById('groupBar');
    const groupsH = (groups && groups.classList.contains('show')) ? groups.offsetHeight : 0;
    const offset = (header?.offsetHeight||54) + (faja?.offsetHeight||50) +
                   groupsH + (cats?.offsetHeight||44) + 8;
    window.scrollTo({top: el.offsetTop - offset, behavior:'smooth'});
  }
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
  const tab = document.getElementById('tab-' + id);
  if(tab) tab.classList.add('active');
  // v1.12 · S5 · cross-sell strip aggiornata anche al tap (non solo scroll)
  triggerCrossSellUpdate(id);
}

function setupCatObserver(){
  // v1.12 · rootMargin allargato (era '-20% 0px -70% 0px') per essere più reattivo
  // durante scroll · ora la fascia attiva è il primo 50% del viewport dal top
  const opts = { rootMargin:'-15% 0px -50% 0px', threshold:0 };
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const id = e.target.id.replace('cat-','');
        document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
        const tab = document.getElementById('tab-'+id);
        if(tab){
          tab.classList.add('active');
          tab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
        }
        // v1.12 · S5 · cross-sell strip · debounced real-time update
        triggerCrossSellUpdate(id);
      }
    });
  }, opts);
  document.querySelectorAll('.cat-section').forEach(s=>obs.observe(s));
}

/* ════════════════════════════════════════════════════
   v1.12 · S5 · CROSS-SELL STRIP · logica completa
   ════════════════════════════════════════════════════ */

// Debounce 100ms · evita flicker ma resta reattivo durante scroll
function triggerCrossSellUpdate(catId){
  if(CROSSSELL_DEBOUNCE_TIMER) clearTimeout(CROSSSELL_DEBOUNCE_TIMER);
  CROSSSELL_DEBOUNCE_TIMER = setTimeout(()=>{
    updateCrossSellStrip(catId);
  }, 100);
}

// Trova prodotto target di cross-sell per la categoria sorgente attiva
// Ritorna prodotto target o null se nessun match.
function resolveCrossSell(activeCatId){
  if(!SUGERENCIA_ACTIVA) return null;          // master switch off
  if(!activeCatId) return null;
  if(!ALL_PRODUCTS || ALL_PRODUCTS.length === 0) return null;

  // 1) Cerco un prodotto della categoria attiva che dichiara una sugerencia_categoria target
  const sourceProduct = ALL_PRODUCTS.find(p =>
    p.categoria === activeCatId &&
    p.sugerencia_categoria &&
    p.sugerencia_categoria.length > 0 &&
    !p.agotado &&
    productInFaja(p)
  );
  if(!sourceProduct) return null;

  const targetCatId = sourceProduct.sugerencia_categoria;

  // 2) NO SELF-SUGGEST: se la categoria target è la stessa attiva, niente strip
  //    (evita pubblicità inutile dentro la stessa zona prodotti)
  if(targetCatId === activeCatId) return null;

  // 3) Filtra prodotti della categoria target attualmente disponibili
  //    Decisione S5 · Opzione B: la strip RISPETTA il filtro ritmo (curatela = unica realtà · regola n.4)
  //    JL può aggiungere i prodotti destinazione nei Prod_IDs_CSV dei ritmi dove vuole cross-sell
  const ritmoFilterActive = RITMO_FILTER_ON && RITMO_ACTUAL && RITMO_ACTUAL.prod_ids && RITMO_ACTUAL.prod_ids.length > 0;
  const ritmoSet = ritmoFilterActive ? new Set(RITMO_ACTUAL.prod_ids) : null;
  const candidates = ALL_PRODUCTS.filter(p =>
    p.categoria === targetCatId &&
    !p.agotado &&
    productInFaja(p) &&
    (!ritmoSet || ritmoSet.has(p.id))
  );
  if(candidates.length === 0) return null;

  // 4) Hero (Es_Sugerencia_Destacada=TRUE) vince. Altrimenti primo candidato.
  const hero = candidates.find(p => p.es_sugerencia_destacada);
  return hero || candidates[0];
}

function updateCrossSellStrip(activeCatId){
  const strip = document.getElementById('crossSellStrip');
  if(!strip) return;

  const target = resolveCrossSell(activeCatId);

  // Hide se nessun match (regola 2a · niente fallback)
  if(!target){
    strip.classList.remove('visible');
    CURRENT_CROSSSELL_TARGET = null;
    updateStickyTops();
    return;
  }

  // Skip re-render se stesso target già visibile (evita flicker visivo durante scroll continuo)
  if(CURRENT_CROSSSELL_TARGET === target.id && strip.classList.contains('visible')){
    return;
  }
  CURRENT_CROSSSELL_TARGET = target.id;

  // Popola DOM
  document.getElementById('crossSellLabel').textContent = '★ ' + getLang('xs_label');

  // Intro: PARAMETROS.sugerencia_frase_default vince > i18n fallback
  const intro = SUGERENCIA_FRASE_DEFAULT || getLang('xs_intro_default');
  document.getElementById('crossSellIntro').textContent = intro + ' ·';

  document.getElementById('crossSellName').textContent = target.nombre;
  document.getElementById('crossSellPrice').textContent = formatPrice(target.precio);

  // Foto: usa imagen prodotto se valida, altrimenti placeholder con emoji categoria
  const photo = document.getElementById('crossSellPhoto');
  const cat = ALL_CATEGORIES.find(c => c.id === target.categoria);
  if(target.imagen && target.imagen.startsWith('http')){
    photo.innerHTML = `<img src="${target.imagen}" alt="${target.nombre}"
      onerror="this.parentElement.innerHTML='<span class=\\'xs-photo-emoji\\'>${cat?.emoji||'✦'}</span>'">`;
  } else {
    photo.innerHTML = `<span class="xs-photo-emoji">${cat?.emoji||'✦'}</span>`;
    photo.style.background = _catColor ? _catColor(target.categoria) : '#1F1F38';
  }

  // Click → apre scheda dettaglio prodotto target (riutilizza openDetail esistente)
  strip.onclick = () => {
    if(typeof openDetail === 'function') openDetail(target);
  };

  strip.classList.add('visible');
  updateStickyTops();
}

/* BADGES */
function isNuevo(p){
  if(!p.fecha_agregado) return false;
  const added = new Date(p.fecha_agregado);
  const diffDays = (Date.now() - added.getTime()) / 86400000;
  return diffDays <= (BRAND.nuevo_dias || 14);
}

function buildBadges(p, forSheet=false){
  const badges = [];
  if(p.agotado){ badges.push(`<span class="badge badge-agotado">${getLang('agotado')}</span>`); return badges.join(''); }
  if(isNuevo(p)) badges.push(`<span class="badge badge-nuevo">✦ ${getLang('nuevo')}</span>`);
  const raw = (p.badges||'').split(',').map(b=>b.trim().toLowerCase().replace(/\s/g,''));
  raw.forEach(b=>{
    if(b==='popular')    badges.push(`<span class="badge badge-popular">★ ${getLang('popular')}</span>`);
    if(b==='vegano')     badges.push(`<span class="badge badge-vegano">🌱 ${getLang('vegano')}</span>`);
    if(b==='singluten')  badges.push(`<span class="badge badge-singluten">🌾 ${getLang('singluten')}</span>`);
    if(b==='chef')       badges.push(`<span class="badge badge-chef">👨‍🍳 ${getLang('chef')}</span>`);
    if(b==='temporada')  badges.push(`<span class="badge badge-temporada">🍃 ${getLang('temporada')}</span>`);
  });
  if(ACTIVE_MEMBER && p.precio_member)
    badges.push(`<span class="badge badge-member">💳 ${getLang('member_price')}</span>`);
  return badges.join('');
}

/* PRICE */
function parsePrice(v){
  if(typeof v === 'number') return v;
  if(!v) return 0;
  let s = String(v).replace(/[^\d.,\-]/g,'');
  if(!s) return 0;
  if(s.includes('.') && s.includes(',')){
    const lastDot = s.lastIndexOf('.');
    const lastComma = s.lastIndexOf(',');
    if(lastComma > lastDot){ s = s.replace(/\./g,'').replace(',','.'); }
    else { s = s.replace(/,/g,''); }
  } else if(s.includes(',')){
    const parts = s.split(',');
    if(parts.length === 2 && parts[1].length === 2) s = s.replace(',','.');
    else s = s.replace(/,/g,'');
  } else if(s.includes('.')){
    const parts = s.split('.');
    if(!(parts.length === 2 && parts[1].length === 2)) s = s.replace(/\./g,'');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function formatPrice(n){
  // v1.11 · prezzo SENZA simbolo currency. Pricing psychology + meno aggressivo visivo.
  // Il simbolo BRAND.currency_symbol resta disponibile via formatPriceWithSymbol()
  // per usi specifici come la scheda dettaglio in caso di necessità.
  const num = parsePrice(n);
  if(BRAND.currency === 'CLP' || num >= 1000)
    return num.toLocaleString('es-CL');
  return num.toFixed(2);
}

function formatPriceWithSymbol(n){
  // Variante con simbolo $ se servisse (es. tooltip "Total: $7.990") · NON usato nelle card.
  const s = BRAND.currency_symbol || '$';
  const num = parsePrice(n);
  if(BRAND.currency === 'CLP' || num >= 1000)
    return s + num.toLocaleString('es-CL');
  return s + num.toFixed(2);
}

function getDisplayPrice(p){
  if(ACTIVE_MEMBER && p.precio_member)
    return { main: formatPrice(p.precio_member), orig: formatPrice(p.precio) };
  return { main: formatPrice(p.precio), orig: null };
}

function _catColor(catId){
  const colors = {
    'alimentos':'#FFF0E6','cafe':'#F5ECD7','jugos':'#E8F5E9',
    'helados':'#E3F2FD','bebidas':'#E8F5E9','bowls':'#FFF8E1',
    'snacks':'#FFF3E0','postres':'#FCE4EC','especiales':'#F3E5F5',
    'solidos':'#FFF0E6','ensaladas':'#E8F5E9','desayunos':'#FFFDE7',
  };
  return colors[catId] || '#F5F5F5';
}

function renderMenu(){
  const wrap = document.getElementById('menuContent');
  const visibleCatIds = getVisibleCategories().map(c => c.id);
  const ritmoFilterActive = RITMO_FILTER_ON && RITMO_ACTUAL && RITMO_ACTUAL.prod_ids && RITMO_ACTUAL.prod_ids.length > 0;
  const ritmoProdSet = ritmoFilterActive ? new Set(RITMO_ACTUAL.prod_ids) : null;
  const promosGroupActive = CURRENT_GROUP === '__PROMOS__';
  // v1.11 · SEARCH_QUERY non filtra più il menu di sotto · vive isolata nell'overlay full-screen.
  // Questo evita stati ambigui (chiudo overlay con query attiva → menu filtrato senza UI di feedback).
  FILTERED = ALL_PRODUCTS.filter(p=>{
    const inFaja = productInFaja(p);
    const inGroup = promosGroupActive
      ? !!PROD_TO_PROMO[p.id]
      : visibleCatIds.includes(p.categoria);
    const inRitmo = !ritmoFilterActive || ritmoProdSet.has(p.id);
    return inFaja && inGroup && inRitmo;
  });
  if(FILTERED.length === 0){
    wrap.innerHTML = '';
    const empty = document.getElementById('emptyState');
    empty.classList.add('show');
    let msg;
    if(ritmoFilterActive){ msg = getLang('rhythm_no_products').replace('{nombre}', RITMO_ACTUAL.nombre); }
    else { msg = getLang('no_products'); }
    document.getElementById('emptyText').textContent = msg;
    document.getElementById('catSticky').style.display = 'none';
    return;
  }
  document.getElementById('emptyState').classList.remove('show');
  document.getElementById('catSticky').style.display = '';
  const visibleCats = getVisibleCategories();
  const byCat = {};
  visibleCats.forEach(c=>{ byCat[c.id] = []; });
  FILTERED.forEach(p=>{
    if(!byCat[p.categoria]) byCat[p.categoria] = [];
    byCat[p.categoria].push(p);
  });
  let html = '';
  visibleCats.forEach(cat=>{
    const items = byCat[cat.id];
    if(!items || items.length === 0) return;
    html += `
      <div class="cat-section" id="cat-${cat.id}">
        <div class="cat-header">
          <span class="cat-header-emoji">${cat.emoji}</span>
          <span class="cat-header-name">${getCatName(cat.id)}</span>
          <span class="cat-header-count">${items.length}</span>
        </div>
        <div class="product-list">
          ${items.map(p=>renderProductCard(p)).join('')}
        </div>
      </div>`;
  });
  wrap.innerHTML = html;
}

function renderProductCard(p){
  const promo   = PROD_TO_PROMO[p.id] || null;
  const badges  = buildBadges(p);
  const prices  = getDisplayPrice(p);
  const isNew   = isNuevo(p);
  const cat     = ALL_CATEGORIES.find(c=>c.id===p.categoria);
  const catEmoji = cat?.emoji || '🍽️';
  const catColor = _catColor(p.categoria);
  // v1.10 · placeholder con emoji categoria invece di buco grigio
  const phHtml   = `<div class="card-img-placeholder" style="background:${catColor}"><span>${catEmoji}</span></div>`;
  const imgHtml  = p.imagen
    ? `<img src="${p.imagen}" alt="${p.nombre}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">${phHtml}`
    : phHtml;
  const promoBadge = promo
    ? `<span class="badge" style="background:rgba(251,191,36,0.22);color:#d97706;font-weight:700">🎁 ${promo.nombre}</span>`
    : '';
  const promoFlag = promo
    ? `<div style="position:absolute;top:-3px;left:-3px;background:#fbbf24;color:#000;padding:2px 5px;border-radius:6px;font-size:9px;font-weight:700;letter-spacing:0.3px;z-index:3;line-height:1;border:2px solid var(--brand-surface)">🎁</div>`
    : '';
  const promoClass = promo ? ' has-promo' : '';
  const promoPriceMain = promo ? formatPrice(promo.precio_final) : prices.main;
  const promoPriceOrig = promo ? formatPrice(p.precio) : prices.orig;
  const badgesHtml = (promo || badges)
    ? `<div class="card-badges">${promoBadge}${badges || ''}</div>`
    : '';
  // v1.11 · dot NUEVO sull'angolo top-right della foto (sostituisce bordo verde animato)
  const nuevoDot = isNew && !p.agotado
    ? `<div class="card-nuevo-dot" title="${getLang('nuevo')}"></div>`
    : '';
  // v1.11 · layout Strada C · nome+prezzo top, descrizione 2 righe sotto
  return `
    <div class="product-card${p.agotado?' agotado':''}${isNew?' nuevo-highlight':''}${promoClass}" data-id="${p.id}" onclick="openDetail('${p.id}')">
      <div class="card-img-wrap">${imgHtml}${promoFlag}${nuevoDot}</div>
      <div class="card-body">
        <div class="card-top-row">
          <div class="card-name${p.agotado?' agotado-text':''}">${toTitleCase(p.nombre)}</div>
          <div class="card-price"${promo?' style="color:#d97706;font-weight:600"':''}>
            ${promoPriceOrig ? `<span class="card-price-orig">${promoPriceOrig}</span>` : ''}${promoPriceMain}
          </div>
        </div>
        ${p.descripcion ? `<div class="card-desc">${p.descripcion}</div>` : ''}
        ${badgesHtml}
      </div>
      ${p.agotado ? `<div class="agotado-overlay"><span class="agotado-label">${getLang('agotado')}</span></div>` : ''}
    </div>`;
}

function openDetail(id){
  const p = ALL_PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  trackProductView(p);
  // v1.11 · Nella scheda dettaglio (NON nelle card list) reintroduco simbolo $ per chiarezza.
  // Il prezzo qui è isolato e grande · disambiguazione utile, niente sovraccarico visivo.
  const prices = ACTIVE_MEMBER && p.precio_member
    ? { main: formatPriceWithSymbol(p.precio_member), orig: formatPriceWithSymbol(p.precio) }
    : { main: formatPriceWithSymbol(p.precio), orig: null };
  const badges  = buildBadges(p, true);
  const cat     = ALL_CATEGORIES.find(c=>c.id===p.categoria);
  const catEmoji= cat?.emoji || '🍽️';
  const imgHtml = p.imagen
    ? `<div class="sheet-img"><img src="${p.imagen}" alt="${p.nombre}" onerror="this.style.display='none';this.parentElement.style.background='${_catColor(p.categoria)}'"></div>`
    : `<div class="sheet-img-ph" style="background:${_catColor(p.categoria)}">${catEmoji}</div>`;
  const upsellIds = (p.upsell_ids||'').split(',').map(x=>x.trim()).filter(Boolean);
  const upsellProds = upsellIds.map(id=>ALL_PRODUCTS.find(x=>x.id===id)).filter(Boolean);
  let upsellHtml = '';
  if(upsellProds.length > 0){
    upsellHtml = `
      <div id="upsellSection" class="show">
        <div class="upsell-title">${getLang('upsell_title')}</div>
        <div class="upsell-scroll">
          ${upsellProds.map(u=>`
            <div class="upsell-card" onclick="openDetail('${u.id}')">
              ${u.imagen
                ? `<div class="upsell-img"><img src="${u.imagen}" alt="${u.nombre}" loading="lazy"></div>`
                : `<div class="upsell-img-ph">${ALL_CATEGORIES.find(c=>c.id===u.categoria)?.emoji||'🍽️'}</div>`}
              <div class="upsell-info">
                <div class="upsell-name">${u.nombre}</div>
                <div class="upsell-price">${formatPrice(ACTIVE_MEMBER&&u.precio_member?u.precio_member:u.precio)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
  }
  document.getElementById('sheetContent').innerHTML = `
    ${imgHtml}
    <div class="sheet-body">
      ${badges ? `<div class="sheet-badges">${badges}</div>` : ''}
      <div class="sheet-name">${toTitleCase(p.nombre)}</div>
      <div class="sheet-desc">${p.descripcion}</div>
      <div class="sheet-price-row">
        <div>
          ${prices.orig ? `<span class="sheet-price-orig">${prices.orig}</span>` : ''}
          <span class="sheet-price">${prices.main}</span>
        </div>
        ${!p.agotado ? `
          <button class="card-call-btn" style="width:48px;height:48px;font-size:22px"
                  onclick="closeDetail();setTimeout(()=>onCallWaiterForProduct('${p.id}'),320)"
                  aria-label="Llamar mesero">🔔</button>
        ` : ''}
      </div>
      ${!p.agotado && MESA_ID ? `
        <div style="text-align:center;font-size:12px;color:var(--brand-text-muted);margin:-8px 0 16px;letter-spacing:0.3px">
          Toca 🔔 para llamar mesero por este producto
        </div>
      ` : ''}
      </div>
      ${upsellHtml}
    </div>`;
  document.getElementById('detailOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('detailSheet').classList.add('open'), 10);
  document.body.style.overflow = 'hidden';
}

function closeDetail(){
  document.getElementById('detailSheet').classList.remove('open');
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

let touchStartY = 0;
document.getElementById('detailSheet').addEventListener('touchstart',e=>{ touchStartY=e.touches[0].clientY; },{passive:true});
document.getElementById('detailSheet').addEventListener('touchmove',e=>{
  const dy = e.touches[0].clientY - touchStartY;
  if(dy > 80) closeDetail();
},{passive:true});

/* ════════════════════════════════════════════════════
   v1.11 · SEARCH OVERLAY full-screen
   ══════════════════════════════════════════════════════
   ─ Aperto da #headerSearchBtn (lente in header)
   ─ Chiuso da ← back button, ESC key, o search-overlay-back tap
   ─ Risultati live filtrati mentre l'utente digita
   ─ Tap su un risultato → chiude overlay + scrolla alla card del prodotto */
window.addEventListener('resize', updateStickyTops);

function setupSearch(){
  const inp = document.getElementById('searchInput');
  if(!inp) return;
  inp.placeholder = getLang('search_placeholder');
  inp.addEventListener('input', e=>{
    SEARCH_QUERY = e.target.value.toLowerCase().trim();
    document.getElementById('searchClear').classList.toggle('show', SEARCH_QUERY.length > 0);
    renderSearchOverlayResults();
    // v1.11 · NON chiamiamo più renderMenu() qui · la search vive isolata nell'overlay,
    // il menu di sotto resta filtrato solo da macro-group/cat/ritmo/faja.
  });
  // ESC chiude overlay
  inp.addEventListener('keydown', e=>{
    if(e.key === 'Escape') closeSearchOverlay();
  });
}

function clearSearch(){
  const inp = document.getElementById('searchInput');
  if(inp) inp.value = '';
  SEARCH_QUERY = '';
  const clr = document.getElementById('searchClear');
  if(clr) clr.classList.remove('show');
  renderSearchOverlayResults();
  inp && inp.focus();
}

function openSearchOverlay(){
  const ov = document.getElementById('searchOverlay');
  if(!ov) return;
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';
  // Auto-focus + tastiera mobile
  setTimeout(()=>{
    const inp = document.getElementById('searchInput');
    if(inp) inp.focus();
  }, 80);
  // Render iniziale (lista vuota o ultima query)
  renderSearchOverlayResults();
}

function closeSearchOverlay(){
  const ov = document.getElementById('searchOverlay');
  if(!ov) return;
  ov.classList.remove('open');
  document.body.style.overflow = '';
  // v1.11 · NON resettiamo SEARCH_QUERY · resta in memoria così se riapre
  //         l'utente ritrova quello che stava cercando.
}

// retrocompat: vecchi onClick "focusSearch()" presenti in altri punti del DOM
// (in v1.10 era usato dalla bnav-btn Buscar) → ridiretti all'overlay nuovo.
function focusSearch(){
  openSearchOverlay();
}

function renderSearchOverlayResults(){
  const wrap = document.getElementById('searchOverlayResults');
  if(!wrap) return;
  if(!SEARCH_QUERY){
    // Stato iniziale · nessuna query
    wrap.innerHTML = `
      <div class="search-overlay-empty">
        <div class="search-overlay-empty-emoji">⌕</div>
        <div>${getLang('search_placeholder')}</div>
      </div>`;
    return;
  }
  const q = SEARCH_QUERY;
  const matches = ALL_PRODUCTS.filter(p => {
    if(p.agotado) return false;
    return p.nombre.toLowerCase().includes(q) ||
           (p.descripcion||'').toLowerCase().includes(q) ||
           (p.badges||'').toLowerCase().includes(q);
  }).slice(0, 30); // hard cap a 30 risultati

  if(matches.length === 0){
    wrap.innerHTML = `
      <div class="search-overlay-empty">
        <div class="search-overlay-empty-emoji">🔍</div>
        <div>${getLang('search_empty')} "<strong>${escapeHtml(q)}</strong>"</div>
      </div>`;
    return;
  }

  wrap.innerHTML = matches.map(p => {
    const cat = ALL_CATEGORIES.find(c=>c.id===p.categoria);
    const catEmoji = cat?.emoji || '🍽️';
    const imgHtml = p.imagen
      ? `<img src="${p.imagen}" alt="" loading="lazy" onerror="this.outerHTML='<span class=\\'search-overlay-result-img-ph\\'>${catEmoji}</span>'">`
      : `<span class="search-overlay-result-img-ph">${catEmoji}</span>`;
    const prices = getDisplayPrice(p);
    const nameHi = highlightMatch(toTitleCase(p.nombre), q);
    const descHi = p.descripcion ? highlightMatch(p.descripcion, q) : '';
    return `
      <div class="search-overlay-result-item" onclick="onSearchResultTap('${p.id}')">
        <div class="search-overlay-result-img">${imgHtml}</div>
        <div class="search-overlay-result-info">
          <div class="search-overlay-result-name">${nameHi}</div>
          ${descHi ? `<div class="search-overlay-result-desc">${descHi}</div>` : ''}
        </div>
        <div class="search-overlay-result-price">${prices.main}</div>
      </div>`;
  }).join('');
}

function highlightMatch(text, query){
  if(!query) return escapeHtml(text);
  const safe = escapeHtml(text);
  const safeQ = escapeHtml(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp('('+safeQ+')', 'ig'), '<mark class="search-match">$1</mark>');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function onSearchResultTap(id){
  // 1. Chiudi overlay (ma SEARCH_QUERY resta, non resettiamo)
  closeSearchOverlay();
  // 2. Apri direttamente la scheda dettaglio del prodotto
  setTimeout(()=>openDetail(id), 220);
}

  drop.innerHTML = Object.entries(LANG_LABELS).map(([code,name])=>`
    <div class="lang-option${code===LANG_CODE?' active':''}" onclick="setLang('${code}')">
      <span class="flag">${TRANSLATIONS[code]?.flag||'🌐'}</span>
      ${name}

function toggleLangMenu(){
  document.getElementById('langDropdown').classList.toggle('open');
}

document.addEventListener('click', e=>{
  if(!e.target.closest('#langBtn') && !e.target.closest('#langDropdown'))
    document.getElementById('langDropdown').classList.remove('open');
});

function setLang(code){
  LANG_CODE = code;
  // v1.10 · Chiave nuova 'menu_lang_user_choice': scelta esplicita utente.
  // La chiave vecchia 'menu_lang' è stata rimossa al boot (purgeOldLangKey).
  try { localStorage.setItem('menu_lang_user_choice', code); } catch(e){}
  document.getElementById('langDropdown').classList.remove('open');
  document.documentElement.lang = code;
  applyLang();
  buildLangMenu();
  if(typeof renderFajas === 'function' && ALL_CATEGORIES.length > 0){
    renderFajas();
    renderGroups();
    renderCatTabs();
    renderMenu();
    setupSearch();
    // v1.10 · aggiorna chip ritmo + bottone toggle se siamo in dark mode (BKS)
    if(document.body.classList.contains('theme-dark')) renderRhythmBar();
  } else {
    // Su error state, aggiorna i testi i18n dell'errore
    if(document.getElementById('errorState').classList.contains('show')){
      document.getElementById('esTitle').textContent = getLang('err_title');
      document.getElementById('esSubtitle').textContent = getLang('err_subtitle');
      document.getElementById('esBtn').textContent = getLang('err_retry');
    }
  }
}

function applyLang(){
  // v1.10 · langCode rimosso dal DOM (era ridondante con la bandiera)
  document.getElementById('langFlag').textContent = TRANSLATIONS[LANG_CODE]?.flag || '🌐';
  document.getElementById('ldText').textContent = getLang('loading');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    el.textContent = getLang(k);
  });
}

/* RITMOS + PROMOS (v1.6 invariati) */
async function loadRitmos(){
  if(!BRAND.gas_url) return;
  try {
    const url = `${BRAND.gas_url}?action=getRitmos&local=${LOCAL_ID}&t=${Date.now()}`;
    const r = await fetch(url);
    const data = await r.json();
    if(!data.ok) return;
    const prevRitmoId = RITMO_ACTUAL ? RITMO_ACTUAL.id : null;
    RITMO_ACTUAL = data.ritmo_actual || null;
    RITMOS_DISP  = data.ritmos_disponibles || [];
    const newRitmoId = RITMO_ACTUAL ? RITMO_ACTUAL.id : null;
    if(prevRitmoId !== newRitmoId){
      console.log('[v1.10] Ritmo cambiato:', prevRitmoId, '→', newRitmoId);
    }
    renderRhythmBar();
    renderMenu();
  } catch(e){ console.warn('[v1.10] loadRitmos failed:', e.message); }
}

async function loadPromos(){
  if(!BRAND.gas_url) return;
  try {
    const url = `${BRAND.gas_url}?action=getPromos&local=${LOCAL_ID}&t=${Date.now()}`;
    const r = await fetch(url);
    const data = await r.json();
    if(!data.ok) return;
    PROMOS_ACTIVAS = data.promos_activas || [];
    PROD_TO_PROMO = {};
    PROMOS_ACTIVAS.forEach(p => {
      (p.prod_ids || []).forEach(pid => { PROD_TO_PROMO[pid] = p; });
    });
    renderGroups();
    renderMenu();
  } catch(e){ console.warn('[v1.10] loadPromos failed:', e.message); }
}

function startRhythmPolling(){
  if(!document.body.classList.contains('theme-dark')) return;
  if(RITMO_POLL_TIMER) return;
  loadRitmos();
  loadPromos();
  RITMO_POLL_TIMER = setInterval(() => { loadRitmos(); loadPromos(); }, 60000);
  console.log('[v1.10] Rhythm polling attivo (60s) per', LOCAL_ID);
}

function stopRhythmPolling(){
  if(RITMO_POLL_TIMER){ clearInterval(RITMO_POLL_TIMER); RITMO_POLL_TIMER = null; }
}

function renderRhythmBar(){
  if(!document.body.classList.contains('theme-dark')) return;
  const fajaBar = document.getElementById('fajaBar');
  if(!fajaBar) return;
  let chipBar = document.getElementById('rhythmChipBar');
  if(!chipBar){
    chipBar = document.createElement('div');
    chipBar.id = 'rhythmChipBar';
    // v1.10 microbar · padding compatto · respiro sopra al waveform
    chipBar.style.cssText = 'padding:10px 16px 4px;max-width:480px;margin:0 auto';
    const wf = fajaBar.querySelector('.rhythm-waveform');
    if(wf) fajaBar.insertBefore(chipBar, wf);
    else fajaBar.appendChild(chipBar);
  }

  // v1.10 · CASO A: nessun ritmo attivo (fuori finestre orarie definite)
  if(!RITMO_ACTUAL){
    // v1.11 iter 2 · linea decorativa rossa elegante invece di waveform spento (sembrava bug)
    // Il waveform sotto resta nel DOM ma viene nascosto via CSS quando non c'è RITMO_ACTUAL
    chipBar.innerHTML = `
      <div style="font-size:9px;color:rgba(255,255,255,0.5);letter-spacing:3px;text-transform:uppercase;font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:6px">
        <span style="width:6px;height:6px;border-radius:50%;background:var(--brand-accent);box-shadow:0 0 8px var(--brand-accent);display:inline-block"></span>
        <span>♪ BKS Rhythm</span>
      </div>
      <div style="font-size:12px;color:rgba(255,255,255,0.55);letter-spacing:0.3px;font-style:italic;line-height:1.4">
        ${getLang('rhythm_none')}
      </div>
      <div style="margin-top:8px;height:1px;background:linear-gradient(90deg, transparent, var(--brand-accent-line) 30%, var(--brand-accent-line-strong) 50%, var(--brand-accent-line) 70%, transparent);opacity:0.7"></div>`;
    // Nascondi waveform spento
    const wf = fajaBar.querySelector('.rhythm-waveform');
    if(wf) wf.style.display = 'none';
  } else {
    // v1.10 · CASO B microbar V1: Comandante DJ sx · slogan corsivo …puntini… centro · BPM dx
    // (NO toggle ALL · v1.10 finale: filtro ritmo è unica realtà · curatela del momento sempre attiva)
    const r = RITMO_ACTUAL;
    // v1.12 · S5 · Slogan ritmo da Sheet RITMOS.Mensaje_Cliente (controllo editoriale JL)
    // Fallback chain: Sheet > hardcoded cilenismi DNA brand > nome ritmo
    const sheetMsg = (r.mensaje_cliente || '').trim();
    const slogan = sheetMsg || RHYTHM_SLOGANS_BKS[r.id] || r.nombre || r.id;
    const sloganStripped = slogan.replace(/\.$/, ''); // rimuovo punto finale per puntini sospensivi
    const djName = (CURRENT_DJ_BKS && CURRENT_DJ_BKS.nombre) ? CURRENT_DJ_BKS.nombre : '';

    chipBar.innerHTML = `
      <div style="font-size:9px;color:rgba(255,255,255,0.45);letter-spacing:3px;text-transform:uppercase;font-weight:500;margin-bottom:8px">♪ BKS Rhythm</div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:nowrap">
        <!-- Sx · Comandante DJ con disco rotante · v1.10 · "Comandante DJ" è il nome del curatore della serata · TODO-S4-02 sostituito da DJ reale quando suona -->
        <div style="display:flex;align-items:center;gap:7px;flex-shrink:0;min-width:0">
          <div class="dj-disc" aria-hidden="true"></div>
          <div style="line-height:1.2;min-width:0">
            <div style="font-size:8px;color:rgba(255,255,255,0.4);letter-spacing:1.5px;text-transform:uppercase;font-weight:600">DJ</div>
            <div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px">${djName}</div>
          </div>
        </div>
        <!-- Centro · slogan in corsivo coi puntini sospensivi -->
        <div style="flex:1;text-align:center;font-size:12px;color:rgba(255,255,255,0.55);font-style:italic;letter-spacing:0.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          … ${sloganStripped} …
        </div>
        <!-- Dx · BPM micro firma · battito vivo -->
        <div style="flex-shrink:0">
          <span style="font-family:'Consolas',ui-monospace,monospace;font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1px;font-weight:500">${r.bpm} BPM</span>
        </div>
      </div>`;
  }

  // v1.10 · Waveform animazione a BPM reale · stagger ricalibrato per 20 barre
  const wf = fajaBar.querySelector('.rhythm-waveform');
  if(wf){
    if(RITMO_ACTUAL){
      // v1.11 iter 2 · ripristina display flex (caso A lo nasconde)
      wf.style.display = '';
    }
    const bpm = RITMO_ACTUAL ? RITMO_ACTUAL.bpm : 0;
    if(bpm > 0){
      const dur = (60 / bpm).toFixed(3) + 's';
      wf.querySelectorAll('.wf-bar').forEach((bar, i) => {
        bar.style.animationDuration = dur;
        bar.style.animationDelay = (i * (60/bpm) / 20).toFixed(3) + 's';
      });
    } else {
      wf.querySelectorAll('.wf-bar').forEach(bar => {
        bar.style.animationDuration = '3s';
        bar.style.animationDelay = '';
      });
    }
  }
  updateStickyTops();
}

// v1.10 · toggleRhythmFilter() RIMOSSA · decisione di prodotto: il filtro per ritmo è
// l'unica realtà che il cliente vede. Niente bottone ALL/Filtro nel UI cliente.
// La curatela del momento è la curatela del momento, punto.
// Se un cliente vuole un prodotto specifico fuori dalla curatela, il JL lo abilita
// dal pannello di amministrazione (futuro · S5+).
// La variabile globale RITMO_FILTER_ON resta = true definitivamente.

/* MEMBER */
async function loadMember(memberId){
  if(!BRAND.gas_url) return;
  try {
    const resp = await fetch(`${BRAND.gas_url}?action=getMember&id=${memberId}`);
    const data = await resp.json();
    if(data.ok){
      ACTIVE_MEMBER = data;
      const banner = document.getElementById('memberBanner');
      banner.textContent = `${getLang('hi_member')} ${data.nombre} · ${data.nivel} · ${data.tokens} ${getLang('tokens')}`;
      banner.classList.add('show');
      renderMenu();
    }
  } catch(e){ console.warn('Member load failed', e); }
}

/* TRACKING */
function trackView(){
  if(!BRAND.gas_url || !MESA_ID) return;
  const body = { action:'trackView', local:LOCAL_ID, mesa:MESA_ID, member:MEMBER_ID, ts:Date.now() };
  navigator.sendBeacon(BRAND.gas_url, JSON.stringify(body));
}

function trackProductView(p){
  if(!BRAND.gas_url) return;
  const body = { action:'trackProduct', local:LOCAL_ID, prod_id:p.id, mesa:MESA_ID, ts:Date.now() };
  navigator.sendBeacon(BRAND.gas_url, JSON.stringify(body));
}

/* TOAST */
function addItem(id){
  const p = ALL_PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  showToastMsg(`${p.nombre} · ${getLang('add')}`);
}

let toastTimer;
function showToastMsg(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2500);
}

function scrollToTop(){ window.scrollTo({top:0, behavior:'smooth'}); }

/* LLAMAR MESERO (v1.7 invariato) */
let CONFIRM_PAYLOAD = null;

function openConfirmSheet({title, subtitle, payload, okLabel}){
  CONFIRM_PAYLOAD = payload;
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmSubtitle').textContent = subtitle;
  const okBtn = document.getElementById('confirmOkBtn');
  okBtn.textContent = okLabel || getLang('confirm_call') || 'Sí, llamar';
  okBtn.onclick = () => {
    const payloadCopy = CONFIRM_PAYLOAD;
    closeConfirmSheet();
    notifyWaiter(payloadCopy);
  };
  document.getElementById('confirmOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('confirmSheet').classList.add('open'), 10);
  document.body.style.overflow = 'hidden';
}

function closeConfirmSheet(){
  document.getElementById('confirmSheet').classList.remove('open');
  document.getElementById('confirmOverlay').classList.remove('open');
  document.body.style.overflow = '';
  CONFIRM_PAYLOAD = null;
}

function onCallWaiterForProduct(prodId){
  if(!MESA_ID){
    showToastMsg(getLang('call_no_mesa') || 'Acércate a un mesero para ordenar');
    return;
  }
  const p = ALL_PRODUCTS.find(x=>x.id===prodId);
  if(!p) return;
  openConfirmSheet({
    title:    `¿Llamar mesero por ${toTitleCase(p.nombre)}?`,
    subtitle: `${getLang('mesa')} ${MESA_ID} · ${getLang('call_subtitle') || 'El mesero verá lo que quieres pedir'}`,
    payload:  { tipo_llamada:'por_producto', prod_id: prodId },
    okLabel:  getLang('confirm_call') || 'Sí, llamar',
  });
}

function onPedirDirecto(prodId){
  console.log('[v1.10] onPedirDirecto · gancio Fase 2 · prod_id=', prodId);
  showToastMsg(getLang('coming_soon'));
}

function onCallWaiterGeneric(){
  if(!MESA_ID){
    showToastMsg(getLang('call_no_mesa') || 'Acércate a un mesero para ordenar');
    return;
  }
  openConfirmSheet({
    title:    getLang('call_generic_title') || '¿Llamar mesero?',
    subtitle: `${getLang('mesa')} ${MESA_ID} · ${getLang('call_generic_subtitle') || 'El mesero llegará a tu mesa en breve'}`,
    payload:  { tipo_llamada :'generica', prod_id: null },
    okLabel:  getLang('confirm_call') || 'Sí, llamar',
  });
}

function notifyWaiter(payload){
  if(!BRAND.gas_url || !MESA_ID){
    showToastMsg(getLang('call_send_error'));
    return;
  }
  const body = {
    action:         'notifyWaiter',
    local:          LOCAL_ID,
    mesa:           MESA_ID,
    ritmo_attivo:   RITMO_ACTUAL ? RITMO_ACTUAL.id : '',
    tipo_llamada:   payload.tipo_llamada || 'generica',
    prod_id_intent: payload.prod_id || '',
    ts:             Date.now(),
  };
  try {
    navigator.sendBeacon(BRAND.gas_url, JSON.stringify(body));
    showToastMsg(getLang('call_sent') || '🔔 Mesero llamado · llega pronto');
  } catch(e) {
    console.warn('[v1.10] notifyWaiter failed:', e);
    showToastMsg(getLang('call_retry_error'));
  }
}
