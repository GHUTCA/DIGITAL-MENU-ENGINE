  v0.1 = LEGGE E MOSTRA (famiglie, categorie, griglia, scheda grande, carrello) · v0.2 = la carta di adesso dal tick del bordo ·
  v0.3 = la scheda aperta del mockup · v0.4 = L'INVIO e LA CAMPANELLA (AUT-0749), dietro la leva `menu_vero_envio_on` della config:

  v0.7 = L'INIZIO E LA CONVERSIONE (Alberto 29-ott: «oggi l'inizio e la conversione, il conto domani; il cervello per ora sono io»):
  il palco coi video (si avanza a fine video, la pagina di chiusura vende), i destacados sotto, il fondo con le strelitzie, «Otra vez»,

<style>
:root{
  /* il tema del mockup è il default; una config di locale lo può cambiare con le chiavi tema_* (bozza per 🚚 MIGRA) */
  --bg:#0A0806;--sup:#14100C;--card:#1A1510;--txt:#F3EDE4;--suave:rgba(243,237,228,.62);
  --linea:rgba(255,140,80,.18);--linea2:rgba(255,140,80,.36);--acc:#FF6A1F;--oro:#FFC53D;
  --ok:#8B9E4F;--ok-txt:#14180A;--ok-chiaro:#A9BE68;--male:#FF6B5E;
  /* v0.9 · i pezzi che avevano il colore scritto a mano: la testa, i veli sotto le strisce, la casetta, il segno di versione, il riquadro senza foto, la nota */
  --testa:linear-gradient(rgba(10,8,6,.92),rgba(10,8,6,.8));--velo:rgba(7,6,5,.55);--casa:rgba(243,237,228,.82);--sutil:rgba(243,237,228,.3);
  --tgbg:#1b140a;--notabg:#24201a;--fondo-op:.71;
  --cdbordo:rgba(243,237,228,.08);--addbordo:rgba(169,190,104,.35);   /* v0.9.8 la scheda pastel (DESIGN V33): bordi spenti, la foto parla */
  color-scheme:dark;
}
/* ═══ v0.9 · IL GIORNO (Alberto 30-ott «fondo beige per il giorno … come oggi»): la sabbia del vestito di menu_digital (#EFE2CF, r.542-557),
   le strelitzie chiare a opacità .57. Il blocco cambia SOLO token: nessuna regola sotto nomina il giorno. La notte è :root.
   L'oro del giorno è più scuro di quello del vestito (#C98A2E): sui prezzi piccoli in crema #C98A2E non si legge. */
body.dia{
  --bg:#EFE2CF;--sup:#F8F1E6;--card:#FFFBF5;--txt:#241A14;--suave:#6B5A4F;
  --linea:rgba(36,26,20,.10);--linea2:rgba(36,26,20,.18);--acc:#E0561A;--oro:#A8701F;
  --ok-chiaro:#5E7030;--male:#C0392B;
  --testa:linear-gradient(rgba(248,241,230,.94),rgba(248,241,230,.84));--velo:rgba(248,241,230,.72);--casa:rgba(36,26,20,.75);--sutil:rgba(36,26,20,.3);
  --tgbg:#F3E6CF;--notabg:#FFFBF5;--fondo-op:.57;
  --cdbordo:rgba(36,26,20,.10);--addbordo:rgba(94,112,48,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Outfit,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.app{height:var(--alto,100dvh);display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* la riga in alto: una famiglia sola, stessa altezza, un solo pieno (mockup v1.1) */
.z1{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--linea);min-height:50px;background:var(--testa)}
.casa{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:transparent;border:0;color:var(--casa);display:flex;align-items:center;justify-content:center;cursor:pointer}
.chi{flex:1;min-width:0;line-height:1.15}
.chi b{display:block;font-size:14px}
/* v0.9.9 (Alberto in prova: «il numero di mesa è insignificante, e il BKS anche»): il locale come marca (Fraunces, spaziato, come la .lg del mockup)
   e il posto come una pillola leggibile. Senza posto (solo vetrina) la riga resta la frase piccola di prima. */
.chi b.mrc{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:20px;letter-spacing:3px;line-height:1.05}
.chi em.ati{display:inline-block;margin-left:7px;font-style:normal;font-size:11.5px;color:var(--suave);white-space:nowrap}
.chi em.ati b{color:var(--txt)}
.chi .msal strong{font-weight:800}
.chi .msal.mhola{cursor:default}   /* v0.10.16: non <b>, che in .chi è display:block e spezzava la pillola */
.chi .msal{display:inline-block;margin-left:7px;padding:2px 9px;border:1px solid var(--suave);border-radius:999px;background:none;color:var(--txt);font:inherit;font-size:11.5px;white-space:nowrap;cursor:pointer}
.chi span.pst{display:inline-block;margin-top:4px;font-size:12px;font-weight:800;color:var(--txt);border:1px solid var(--linea2);border-radius:99px;padding:1px 9px;letter-spacing:.05em;text-transform:uppercase;max-width:100%}
.chi span{display:block;font-size:11px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.z3{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
/* v0.9.9 (Alberto in prova: «la barra di scroll a destra deve sparire»): si scorre col dito, la barra non serve. Vale per ogni pannello che scorre. */
.z3,.det,.pal-dj,.ped{scrollbar-width:none}
.z3::-webkit-scrollbar,.det::-webkit-scrollbar,.pal-dj::-webkit-scrollbar,.ped::-webkit-scrollbar{width:0;height:0}
/* la griglia da 12, con foto (mockup: .sei.fotos) */
/* minmax(0,1fr): tre colonne SEMPRE uguali. Con 1fr un nome lungo su una riga (la card VER) allargava la sua colonna e stringeva le altre */
.sei{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;align-content:start}
/* poche card: si appoggiano al fondo, nell'arco del pollice (mockup, Alberto 21-ott) */
.z3.basso{display:flex;flex-direction:column}
.z3.basso>*{margin-top:auto}   /* non justify-content:flex-end: se il contenuto cresce, l'eccedenza deve restare scorrevole */
.cd{display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--cdbordo);border-radius:12px;padding:5px;min-height:176px;cursor:pointer;text-align:left;color:var(--txt)}
.cd .th{width:100%;height:auto;aspect-ratio:4/3;border-radius:8px;object-fit:cover;object-position:center 60%;background:var(--sup)}
.cd .tg{width:100%;height:auto;aspect-ratio:4/3;   /* v0.9.12 (Alberto: «le card della stessa misura anche senza foto»): come .th */
  border-radius:8px;background:var(--tgbg);color:var(--oro);display:flex;align-items:center;justify-content:center;
  text-align:center;padding:4px;font-family:Fraunces,Georgia,serif;font-size:12px;line-height:1.15}
.cd .nm{font-size:14px;font-weight:400;line-height:1.22;   /* v0.10.15 · la A (Alberto 13-nov): 12,5→14 */ overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.cd .pz{font-size:14px;font-weight:700;color:var(--oro);font-variant-numeric:tabular-nums}
.addb{margin-top:auto;width:100%;background:transparent;color:var(--ok-chiaro);border:1px solid var(--addbordo);border-radius:8px;font-weight:600;font-size:12.5px;min-height:32px;cursor:pointer;
  /* v0.8.3 (Alberto: in francese «COMMANDER» sfonda il bottone): una riga sola, e se una lingua non ci sta si tronca, mai fuori dalla card */
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.cd.dentro{border-color:var(--ok)}
.pz s{font-weight:600;opacity:.6;margin-right:2px}
.pz .emd{display:block;font-size:10px;font-weight:700;color:var(--ok-chiaro);letter-spacing:.02em;margin-top:1px}
.pz .emd.e2{font-size:12px;font-weight:800}
.pz .b2x1{display:block;margin:1px 0 0;padding:0;border:0;background:transparent;color:var(--ok-chiaro);font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.02em;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:left}   /* v0.10.31: il 2x1 si vede ed è un tasto · v0.10.60 (Alberto 20-nov, proposta B del MOCKUP_CHIP_2X1): una riga verde senza bordo, come «En Menú del día» e come l'icona della sala, non più una pillola che spinge il prezzo */
.mini .cd .pz .b2x1{margin:0 0 1px}
.mini .cd .pz .emd.e2{margin:0 0 4px;line-height:1.3}   /* v0.10.61 (Alberto 20-nov, screenshot del Daiquiri): «2x1 · pagas 1 · llevas 2» stava a 1 px dal prezzo e il 🎁, più alto della riga, ci finiva sopra */
.prep.p2{border-style:dashed}   /* v0.10.61 · la 2ª del 2x1: stesso disegno delle domande, il bordo dice che è il regalo */
.det .b2x1G{grid-column:1/-1;justify-self:start;margin:7px 0 1px;padding:7px 12px;border:0;border-radius:10px;background:rgba(127,150,70,.14);background:color-mix(in srgb,var(--ok-chiaro) 14%,transparent);color:var(--ok-chiaro);font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;text-align:left}   /* v0.10.60: nella scheda grande il 2x1 non sta accanto al prezzo (sforava a destra): è un tasto sotto la descrizione che dice cosa succede */
.bdb{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 13px 8px;min-height:44px;border:0;border-radius:11px;background:var(--ok);color:var(--ok-txt);font-family:inherit;font-weight:800;font-size:15px;letter-spacing:.03em;cursor:pointer}
.bdb[hidden]{display:none}
.bdb.off{background:transparent;color:var(--suave);border:1px dashed var(--linea2);font-size:12.5px;font-weight:700;cursor:default}
.bdb.st{justify-content:space-between;padding:0 5px;background:var(--card);color:var(--txt);border:1px solid var(--ok)}
.bdb.st i{width:40px;height:34px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;font-weight:800;border-radius:8px;background:var(--ok);color:var(--ok-txt);cursor:pointer}
.bdb.st u{text-decoration:none;font-size:14px}
.det .pz .emd{font-size:12px;margin-top:3px}
.cd.agot{opacity:.55;filter:grayscale(1);pointer-events:none}
.cd .agl{margin-top:auto;font-size:11px;font-weight:800;color:#ff8a7a}
.cd.fh .agl{color:var(--oro)}
.qn{display:flex;align-items:center;justify-content:space-between;margin-top:auto;background:var(--ok);color:var(--ok-txt);border-radius:8px;min-height:30px;font-weight:800}
.qn i{font-style:normal;width:34px;text-align:center;font-size:17px;cursor:pointer}
/* ═══ la scheda aperta (mockup V8-V9, 21/23-ott): META SOPRA vende, META SOTTO le sei per continuare a viaggiare ═══
   La foto prende lo spazio che il testo non usa; nome e descrizione si fermano a due righe; sotto, pagine di SEI
   che scattano DI LATO (il pollice fa un arco orizzontale). Il piatto aperto resta dove l'hai toccato: il legame
   col pannello lo dice il segno «VER ▲» in oro, non la posizione. */
.z3.aperta{overflow:hidden}
.split{display:flex;flex-direction:column;height:100%}
/* con le domande la foto cede spazio (fino a 60px) e, se ancora non basta, la metà alta scorre: le scelte stanno sempre nello schermo */
.det{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow-y:auto}
/* la foto grande prende TUTTA la larghezza (Alberto 28-ott: «sembra troncata»): riempie da bordo a bordo l'altezza che resta
   fra la testa e la striscia sotto, e non supera mai il 4:3 della foto. Dove l'altezza manca, il taglio è sopra e sotto, mai ai lati. */
.det .fo{flex:1 1 auto;width:100%;max-height:min(75vw,420px);min-height:60px;background:#000;position:relative;overflow:hidden}
.det .fo::before,.det .fo::after{content:'';position:absolute;inset:0;z-index:0;background-image:var(--f);background-position:center var(--fy,55%);background-repeat:no-repeat}
/* v0.5.9 (Alberto 28-ott, Caipirisima tagliata sotto): dove l'altezza manca si taglia di più SOPRA che sotto. Il piatto e il
   bicchiere stanno nella metà bassa della foto (il tavolo), il cielo della foto è il fondo del bar. Default 60%; una foto nostra
   può dichiarare il suo punto in fotos.json ({"f":"x.webp","y":70}). */
.det .fo::before{background-size:cover;filter:blur(16px) brightness(.45);transform:scale(1.1)}
.det .fo::after{background-size:contain}   /* v0.10.2 (Alberto 11-nov, Chardonnay Sour tagliato): il prodotto si vede INTERO; ai lati e sopra/sotto resta la stessa foto sfocata del ::before */
.det .fo.tg::before,.det .fo.tg::after{content:none}
.det .fo>*{position:relative;z-index:1}
.det .fo.tg{display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:300;font-size:25px;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,rgba(255,197,61,.18),#0b0906 65%)}
.det .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font-size:16px;cursor:pointer}
/* v0.6.2: nome e prezzo sulla stessa riga, la descrizione sotto: ~40px restituiti alla foto */
.det .bd{flex:0 0 auto;padding:6px 13px 7px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n p" "d d";column-gap:10px;align-items:baseline}
.det .bd h2{grid-area:n}.det .bd .pz{grid-area:p;text-align:right}.det .bd .ds{grid-area:d}
.det h2{font-family:Fraunces,Georgia,serif;font-weight:300;font-size:24px;margin:0;letter-spacing:-.3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.det .ds{font-size:13px;font-weight:500;color:var(--suave);line-height:1.4;   /* v0.10.2 (Alberto 11-nov: «troppo sottile»): 12→13px, 400→500 */ margin:3px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.det .pz{font-size:22px;font-weight:800;color:var(--oro);font-variant-numeric:tabular-nums}
.mini{flex:0 0 auto;border-top:1px solid var(--linea2);background:var(--velo);padding:9px 8px 5px;display:flex;gap:8px;
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-inline:8px}
.mini::-webkit-scrollbar{height:0}
.mini .pag{flex:0 0 100%;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:7px 6px;scroll-snap-align:start}
.split.conq .mini .pag{grid-template-rows:minmax(0,1fr)}   /* v0.10.16: una riga sola con le domande */
.det .incl{margin:2px 13px 8px;font-size:13px;color:var(--suave)} .det .incl b{color:var(--txt)}   /* v0.10.25 · i pezzi inclusi del menú */
.split.conq .det .fo{min-height:min(42vw,235px)}   /* e la foto ha un pavimento: mai più una striscia */
/* v0.10.59 (Alberto 20-nov, dal PC: «non si riesce a ordinare un prodotto che ha un elige»): 42vw e 75vw sono la FINESTRA, non la colonna
   (.app max 560px). Su un PC largo 1852 px il pavimento della foto era 778 px, più alto della scheda: nome, domande e PEDIR finivano sotto,
   fuori vista. Il tetto è il 42% / 75% di 560 px: sotto i 560 px di finestra (i telefoni) il calcolo è identico a prima. */
.split.cont .det .fo{flex:0 0 auto;min-height:0;height:min(30vw,150px);max-height:none}   /* v0.10.24 (Alberto 13-nov, mesa 999: «le domande con i prodotti sono ancora nascoste»): un menú-contenitore non ha una foto che vende, ha 13+8 scelte. Il disegno resta, basso, e le domande salgono */
.mini .cd{min-height:108px;height:auto;   /* v0.10.15: 96→108 per nome e prezzo a 14 · v0.10.19: 108 è il pavimento, non il tetto: nome di due righe + «En Menú del día» non esce dalla card, e la griglia porta tutte le card della pagina all'altezza della più alta */ padding:7px;gap:3px;position:relative}
/* v0.6.3 (Alberto: «la seconda riga viene tagliata»): il nome non si schiaccia mai, chi cede è il riquadro «Con opciones» */
.mini .cd .nm{-webkit-line-clamp:2;font-size:14px;line-height:1.2;min-height:0;flex:0 0 auto}
.mini .cd .pz{flex:0 0 auto}
.mini .cd .opc{font-size:9.5px;line-height:1.15;padding:3px 3px;flex:0 1 auto;min-height:0;overflow:hidden}
.mini .cd .pz{font-size:14px}
/* v0.10.19 (Alberto 12-nov, foto della mesa 54: «allinea testi e bottoni, prezzo sempre in basso»): il nome sta in alto, il prezzo scende
   sopra il bottone, e «En Menú del día» sale SOPRA il prezzo ⇒ prezzo e bottone alla stessa altezza in ogni card, con nome di una o due righe */
.mini .cd .pz{margin-top:auto;display:flex;flex-direction:column-reverse}
.mini .cd .pz .emd{margin:0 0 1px}
.mini .cd .addb{min-height:30px;font-size:12.5px;margin-top:2px}
.mini .cd .qn{min-height:30px;margin-top:2px}
.mini .cd .opc{margin-top:2px}
/* v0.10.20 (Alberto 15:11, foto mesa 54: «il prezzo va in basso, ma sopra ORDINA o PEDIR, così rimane sempre tutto ordinato»): anche nella card
   scelta (VER ▲) il prezzo, che nell'HTML viene DOPO il bottone, sale subito sopra «＋ PEDIR». Nome · prezzo · bottone, in ogni card della striscia. */
.mini .cd.ver .vnm{order:0}
.mini .cd.ver .vsc{order:1}
.mini .cd.ver .vpz{order:2;margin-top:auto;font-size:14px}
.mini .cd.ver .vpd,.mini .cd.ver .vst{order:3;margin-top:2px}
.mini .cd.ver .vpd{height:30px;min-height:30px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}   /* anche «Elige arriba ↑»: stessa altezza di «＋ ORDINA», o il prezzo sale */
.mini .cd.ver.dentro .vst{margin-top:auto}
.mini .cd.ora.ver{padding-bottom:6px}   /* misurato: col 4 px della card d'oro prezzo e bottone stavano 2 px sotto le vicine */
/* la card del piatto aperto: il tasto stesso, in oro, col segno VER a cavallo del bordo (la linea si interrompe) */
.mini .cd.ora{overflow:visible;background:rgba(255,197,61,.20);border:2.5px solid var(--oro);box-shadow:0 0 0 3px rgba(255,197,61,.22),0 6px 18px rgba(0,0,0,.45);
  justify-content:center;align-items:stretch;text-align:center;gap:3px;padding:9px 6px 4px}
.mini .cd.ora::before{content:"VER ▲";position:absolute;top:-7px;left:50%;transform:translateX(-50%);padding:0 6px;background:var(--bg);line-height:12px;white-space:nowrap;
  font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--oro)}
.ver .vnm{font-size:14px;   /* v0.10.15 (🎨 14-nov): come la griglia, 10,5→14 */ font-weight:700;color:var(--suave);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ver .vpd{background:var(--ok);color:var(--ok-txt);border-radius:9px;font-weight:800;font-size:13px;letter-spacing:.03em;padding:6px 4px}

.pal-split .det{flex:1 1 auto;min-height:0}
.pal{position:relative;flex:1 1 auto;min-height:0;background-size:cover;background-position:center;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;touch-action:pan-y;user-select:none;overflow:hidden}
.pal::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(10,8,6,0) 35%,rgba(10,8,6,.92) 100%)}
.pal-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.pal-tx,.pal-dots{z-index:2}
.pal-tx{position:relative;padding:12px 14px 26px}
.pal-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--oro);margin-bottom:4px}
.pal-t{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:22px;line-height:1.15;color:#fff;text-wrap:balance}
.pal-s{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:3px}
.pal-cta{display:inline-block;margin-top:9px;background:var(--ok);color:var(--ok-txt);border:0;border-radius:99px;padding:7px 14px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}
.pal-cta-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.pal-x{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:700;margin-top:9px;cursor:pointer}
.pal-fin{cursor:default}
.pal-fin::before{background:none}   /* v0.10.54 (Alberto 18-nov: «la qualità piena deve rimanere anche alla chiusura»): nessun velo sulla foto */
.pal-fin .pal-t,.pal-fin .pal-s,.pal-fin .pal-tag{text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.65)}
.pal-fin .pal-x{background:rgba(0,0,0,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pal-ss-w{background:#000}
.pal-ss{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;opacity:0;animation:ssin 2.5s ease-out forwards}
@keyframes ssin{0%{opacity:0;transform:scale(1.08)}20%{opacity:1}100%{opacity:1;transform:scale(1)}}
.pal-dots{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center}
.pal-dots i{position:relative;width:22px;height:26px;cursor:pointer;display:block}
.pal-dots i::after{content:"";position:absolute;left:8px;top:12px;width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.45)}
.pal-dots i.on::after{left:3px;width:16px;background:var(--oro)}
.destit{flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;padding:7px 10px 3px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--oro);border-top:1px solid var(--linea2);background:var(--velo)}
.destit span{color:var(--suave);font-weight:700;letter-spacing:0;text-transform:none}
.destrip{flex:0 0 auto;display:flex;gap:7px;overflow-x:auto;padding:6px 10px 9px;background:var(--velo);scroll-snap-type:x mandatory}
.destrip::-webkit-scrollbar{height:0}
.dsw{position:relative;flex:0 0 108px;scroll-snap-align:start}
.destrip .cd{height:150px;min-height:0;padding:5px;gap:2px;border-radius:10px}
.destrip .cd .th{aspect-ratio:auto;height:58px;border-radius:7px;flex:0 0 auto}
.destrip .cd .tg{height:58px;flex:0 0 auto;font-size:11px}
.destrip .cd .nm{font-size:11px;line-height:1.2;min-height:27px;flex:0 0 auto}
.destrip .cd .pz{font-size:12px;flex:0 0 auto}
.destrip .cd .addb,.destrip .cd .qn{min-height:28px;height:28px;font-size:11px}
.destrip .cd .opc{font-size:9.5px;padding:3px}
.dbadge{position:absolute;top:-5px;right:-3px;z-index:3;background:var(--oro);color:#1a1206;font-size:9px;font-weight:800;border-radius:99px;padding:2px 6px;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
/* ═══ v0.7 · «Otra vez» (mockup 23-ott): le ultime cose già chieste, uguali, a un tocco ═══ */
.rip{padding:8px 10px 0}
.z3.basso>.rip+.sei{margin-top:0}   /* con poche card «Otra vez» scende INSIEME alla griglia, attaccata sopra */
.rip-t{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--oro);margin-bottom:5px}
.rip-l{display:flex;gap:6px;overflow-x:auto}
.rip-l::-webkit-scrollbar{height:0}
.rip-c{flex:0 0 auto;display:flex;align-items:center;gap:7px;max-width:210px;padding:5px 8px 5px 5px;border-radius:12px;border:1.5px solid rgba(255,197,61,.45);background:rgba(255,197,61,.08);color:var(--txt);font-family:inherit;text-align:left;cursor:pointer}
.rip-c img{width:34px;height:34px;border-radius:8px;object-fit:cover}
.rip-c span{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.rip-c b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rip-c i{font-style:normal;font-size:10.5px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rip-c.tus{border-style:dashed;background:transparent}
.tusw{padding:10px 10px 14px}
.tusc{position:relative}
.tusq{position:absolute;top:-5px;left:-3px;z-index:3;background:var(--ok);color:var(--ok-txt);font-size:10px;font-weight:800;border-radius:99px;padding:1px 7px}
.miniw{position:relative;flex:0 0 auto}
.mfr{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:30px;height:52px;border:0;border-radius:10px;background:rgba(10,8,6,.62);color:#FFC53D;font-size:26px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mfr[hidden]{display:none}
.mfr.l{left:2px}.mfr.r{right:2px}
.app>.giu,.giu{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:6;pointer-events:none;width:38px;height:38px;border-radius:50%;background:rgba(10,8,6,.62);color:#FFC53D;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;animation:giuRespira 1.6s ease-in-out infinite}
.giu[hidden]{display:none}
.giu span{transform:translateY(-3px)}
@keyframes giuRespira{0%,100%{transform:translate(-50%,0);opacity:.85}50%{transform:translate(-50%,5px);opacity:1}}
.rip-c em{font-style:normal;font-weight:800;color:var(--oro);font-size:18px}
/* ═══ v0.7 · la pillola che chiama (mockup 22-ott: «non ho saputo dove cliccare per enviar») ═══ */
.cartp{position:relative}
.cartp.llama{animation:llamaPulse 1.4s ease-out infinite}
.cartbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:46px;margin:0 0 7px;padding:0 14px;border:0;border-radius:14px;background:var(--ok);color:var(--ok-txt);font-family:inherit;cursor:pointer}
.cartbar span{font-size:12.5px;font-weight:700;opacity:.85;white-space:nowrap}
.cartbar b{font-size:14.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartbar.llama{animation:llamaPulse 1.4s ease-out infinite}
/* il fumetto non sta DENTRO la riga (che scorre di lato e lo taglierebbe): è una riga sua, sopra la barra, allineata a destra */
.z2 .llamah{position:absolute;right:10px;bottom:calc(100% + 6px);white-space:nowrap;background:var(--oro);color:#1a1206;font-size:12px;font-weight:800;border-radius:9px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none}
.z2{position:relative}
@keyframes llamaPulse{0%{box-shadow:0 0 0 0 rgba(139,158,79,.8)}70%{box-shadow:0 0 0 12px rgba(139,158,79,0)}100%{box-shadow:0 0 0 0 rgba(139,158,79,0)}}
/* ═══ v0.7 · il regalo a otra mesa (mockup v1.4-v1.5) ═══ */
.dono-in{display:block;grid-column:1/-1;width:100%;margin-top:8px;padding:9px 12px;border-radius:12px;cursor:pointer;text-align:left;background:rgba(255,197,61,.08);border:1.5px dashed rgba(255,197,61,.55);color:var(--oro);font-family:inherit;font-size:13px;font-weight:800}
.prq{font-size:13px;font-weight:800;margin:10px 0 6px}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{flex:0 0 auto;background:var(--card);border:1.5px solid var(--linea2);color:var(--txt);border-radius:10px;padding:10px 10px;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.pchip.on{border-color:var(--ok);background:var(--ok);color:var(--ok-txt)}   /* v0.9.27: pieno, non velato — il velo si confondeva col fondo */
/* v0.9.27 · il pago express */
.ped.pgx{justify-content:flex-start}
.pgx .rcv{margin-bottom:16px}
.sgs{display:flex;gap:6px}
.sg{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;background:var(--card);border:1.5px solid var(--linea2);color:var(--txt);border-radius:11px;padding:8px 4px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
.sg small{font-size:11.5px;font-weight:700;color:var(--suave);font-variant-numeric:tabular-nums}
.sg.on{background:var(--ok);border-color:var(--ok);color:var(--ok-txt)}
.sg.on small{color:var(--ok-txt);opacity:.85}
.stp{display:flex;align-items:center;justify-content:space-between;margin-top:6px;background:var(--card);border:1.5px solid var(--linea2);border-radius:11px;padding:4px}
.stp button{width:46px;height:40px;border:0;border-radius:8px;background:var(--ok);color:var(--ok-txt);font-size:22px;font-weight:800;cursor:pointer}
.stp button:disabled{opacity:.3;cursor:default}
.stp span{font-size:14px}
.pgpie{position:sticky;bottom:0;z-index:2;margin:14px -14px -12px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--sup);border-top:1px solid var(--linea2);box-shadow:0 -10px 24px rgba(0,0,0,.18)}
.pgsum{display:flex;flex-direction:column;gap:4px;margin:2px 2px 4px;font-variant-numeric:tabular-nums}
.pgsum>div{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;color:var(--txt)}
.pgsum>div span{font-weight:600}
.pgsum>div b{font-weight:800}
.pgsum>.t{border-top:1.5px solid var(--linea2);padding-top:6px;margin-top:2px;font-size:20px}
.pgsum>.t span{font-weight:800}
.pgx .rcv-n{font-size:14px;font-weight:800;color:#2A2118;background:#F1E7D3;border-radius:6px;padding:7px 8px}   /* «pagas 1 de 4: $7.083» si legge */
.pgx .envG em{font-style:normal}
/* v0.9.30 · il foglio della mesa si tocca */
.rsel{width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.rsel:disabled{cursor:default}
.rcv-l .rck{flex:0 0 auto;width:18px;height:18px;border:2px solid #B7A896;border-radius:4px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;transform:translateY(3px)}
.rsel.on .rck{background:#5F7A1F;border-color:#5F7A1F}
.rsel:not(.on) .rn,.rsel:not(.on) .rp,.rsel:not(.on) .rq{color:#A89A88}
.rpg{flex-wrap:wrap}.rpg .rck{background:#B7A896;border-color:#B7A896}
.rpg .rn,.rpg .rp,.rpg .rq{color:#A89A88;text-decoration:line-through}
.rpg em{flex-basis:100%;font-style:normal;font-size:11px;font-weight:800;color:#5F7A1F;letter-spacing:.08em;text-transform:uppercase;padding-left:26px}
.rqq{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11.5px;color:#7A6A5C;margin-bottom:4px}
.rqq button,.rstp .rdiv{font:inherit;border:0;background:none;color:#5F7A1F;font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 0}
.rcv-r{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 0;font-variant-numeric:tabular-nums}
.rcv-r.dim{color:#7A6A5C;font-size:13px}
.rcv-r.big{font-size:19px;font-weight:800}
.rcv-dd{border-top:3px double #2A2118;margin:10px 0 8px}
.rprop{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.rprop button{font:inherit;font-size:12px;font-weight:700;border:1.5px solid #B7A896;background:none;color:#7A6A5C;border-radius:4px;padding:3px 6px;cursor:pointer}
.rprop button.on{border-color:#2A2118;background:#2A2118;color:#FFFDF7}
.rpo{margin:4px 0 0}.rpo input{background:#FFFDF7!important;color:#2A2118!important}
.rstp{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#7A6A5C;margin-top:6px}
.rstp>span:last-child{display:flex;align-items:center;gap:10px;color:#2A2118;font-weight:800}
.rstp button:not(.rdiv){font:inherit;width:30px;height:30px;border:1.5px solid #2A2118;background:none;border-radius:4px;cursor:pointer;color:#2A2118;font-size:16px}
.rstp button:disabled{opacity:.3;cursor:default}
.rcv-f{text-align:center;font-size:11px;color:#7A6A5C;margin-top:10px}
.stamp{display:inline-block;border:3px solid #5F7A1F;color:#5F7A1F;font-weight:800;letter-spacing:.2em;padding:4px 12px;transform:rotate(-6deg);border-radius:4px;font-size:18px}
.stamp.ink{border-color:#2A2118;color:#2A2118}
/* il PAGO EXPRESS del 21-ott: bordo d'oro doppio, il battito, «Pago seguro con Fintoc» da solo */
.xpr{background:var(--card);border:3px double var(--oro);border-radius:14px;padding:12px;margin-top:4px}
.xpr .xt{font-size:15.5px;font-weight:800;color:var(--txt);text-align:center;line-height:1.25}
.xpr .xb{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--ok-chiaro)}
.xpr .envG{margin-top:10px}
.xpr .envG.xgo.waspento{background:var(--ok);color:var(--ok-txt);border:0}   /* v0.9.31: niente tratteggio velato */
.xwa input{background:var(--sup)!important}
.xpr .envG.xgo{animation:xgoPulse 2.4s ease-out infinite}
@keyframes xgoPulse{0%{box-shadow:0 0 0 0 rgba(139,158,79,.6)}70%{box-shadow:0 0 0 12px rgba(139,158,79,0)}100%{box-shadow:0 0 0 0 rgba(139,158,79,0)}}
.xsec{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--sup);border:1.5px solid var(--ok);border-left:6px solid var(--ok);border-radius:10px;padding:9px 10px;font-size:14px;color:var(--txt);text-align:left}   /* v0.9.33: evidente, non più grande */
.xsec .xlk{flex:0 0 auto;font-size:18px}
.xsec>span:nth-child(2){flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.xsec b{font-weight:800}
.xsec small{font-size:11.5px;font-weight:600;color:var(--suave);line-height:1.3}
.xinf{flex:0 0 auto;background:var(--card);border:1.5px solid var(--linea2);color:var(--txt);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.xinfo{margin-top:6px;background:var(--card);border:1.5px solid var(--linea2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--txt);text-align:left;line-height:1.4}
.xinfo b{display:block;font-size:13.5px;margin-bottom:4px}
.xinfo p{margin:4px 0 0}
.xwa{margin-top:8px}
.xbol{background:var(--card);border:1.5px solid var(--linea2);border-radius:14px;padding:11px 12px;margin:0 0 10px}   /* v0.9.34: il WhatsApp sopra i due canali */
.xbol .xbt{font-size:14px;font-weight:800;color:var(--txt)}
.xbol .xwak{text-align:left;margin-top:6px;font-size:13px;color:var(--txt)}
.xwak{font-size:12.5px;color:var(--suave);text-align:center;margin-top:9px}
.xwak button{font:inherit;border:0;background:none;color:var(--txt);font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.segui.xno{font-size:11.5px;padding:6px 0 0;opacity:.75}
.ftot{display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px 0 14px}
.ftot b{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ftot small{color:var(--suave);font-size:13px}
.fpm{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--linea2);color:var(--txt);border-radius:12px;padding:15px 14px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;margin-top:7px;text-align:left}
.fpm small{font-size:11px;color:var(--suave);font-weight:700}
.fpm .sp{font-variant-numeric:tabular-nums;color:var(--suave);font-size:13px}
.fpm.dim{opacity:.55}
.fproc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0;font-weight:800;font-size:16px}
.fproc span{font-size:13px;font-weight:600;color:var(--suave)}
.fspin{width:34px;height:34px;border-radius:50%;border:4px solid var(--linea2);border-top-color:var(--ok);animation:fgira .9s linear infinite}
@keyframes fgira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.xpr .envG.xgo,.fspin{animation:none}}
/* v0.9.32 · niente trasparente nei bottoni del pago: i link diventano bottoni pieni, niente veli né opacità */
.pgx .segui{background:var(--card);border:1.5px solid var(--linea2);color:var(--txt);text-decoration:none;border-radius:12px;padding:13px 10px;margin-top:10px;font-size:14px;font-weight:800;opacity:1}
.pgx .segui.xno{background:var(--sup);font-size:12.5px;padding:10px;margin-top:10px}
.pgx .segui:disabled{background:var(--sup);color:var(--suave)}
.pgx .okv{background:var(--card);color:var(--txt)}
.pgx .okv span{color:var(--suave)}
.pgx .fpm.dim{opacity:1;background:var(--sup)}
.pgx .rqq button,.pgx .rstp .rdiv{background:#EFE5D2;border:1.5px solid #CDBFA8;border-radius:5px;padding:4px 8px;text-decoration:none;color:#2A2118;font-size:12px}
.pgx .rprop button{background:#FFFDF7}
.pgx .rprop button.on{background:#2A2118}
.pgx .rstp button:not(.rdiv){background:#FFFDF7}
.pgx .rstp button:disabled{opacity:1;color:#CDBFA8;border-color:#CDBFA8}
.pgx .xwak button{background:var(--sup);border:1.5px solid var(--linea2);border-radius:6px;padding:3px 8px;text-decoration:none}
.fbk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fbk .sg{min-height:46px}
.pgx .envG:disabled,.pgx .segui:disabled{opacity:.4;cursor:default}
/* v0.9.2 · la porta che porta a zero: disponibile, non nascosta, ma più stretta e più scura (Alberto 31-ago, pago.html 2.10) */
.pchips.p210 .pchip{flex:1 1 calc(50% - 6px);display:flex;flex-direction:column;align-items:center;gap:2px}
.pchips.p210 .pchip small{font-size:11px;font-weight:700;opacity:.8}
.pchips.p210 .pnone{flex:0 0 58%;margin:0 auto;padding:8px;font-size:12px;background:var(--sup);color:var(--suave)}
.ckf.potrof{margin-top:8px}
.ckr[hidden]{display:none}
/* ═══ v0.9.3 · la voce del cliente (il disegno di sala_nueva svqApri, girato verso il cliente) ═══ */
.app>.opq.pulito{position:absolute;inset:0;z-index:40;background:var(--bg);align-items:center}
.app>.opq.pulito::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--fondo-op);filter:blur(4px);background:var(--fondo) center center / cover no-repeat}
.app>.opq.pulito .opb{position:relative;z-index:1}
.opq{position:fixed;inset:0;z-index:40;background:rgba(8,6,4,.62);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.opb{width:100%;max-width:520px;background:var(--sup);color:var(--txt);border:1px solid var(--linea2);border-radius:22px;padding:18px 14px 8px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.opb .opt{font-size:17px;font-weight:800;margin-bottom:14px;text-wrap:balance}
.opb .opt2{font-size:15px;margin:14px 0 10px}
.opb .opf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.opb .opf button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-radius:16px;border:1px solid var(--linea2);background:var(--card);color:var(--txt);font-family:inherit;font-size:30px;cursor:pointer}
.opb .opf button i{font-style:normal;font-size:12.5px;font-weight:700;color:var(--suave)}
.opb .opf button.on{border-color:var(--oro);background:rgba(255,197,61,.12)}

  ['Esta cuenta es de la mesa {m}. Para pagarla, pídele la cuenta a tu garzón.', { en: 'This bill belongs to table {m}. To pay it, ask your waiter for the bill.', pt: 'Esta conta é da mesa {m}. Para pagá-la, peça a conta ao seu garçom.', it: 'Questo conto è del tavolo {m}. Per pagarlo, chiedi il conto a chi ti serve.', zh: '这张账单属于{m}号桌。如需付款，请向服务员要账单。', ko: '이 계산서는 {m}번 테이블 것이에요. 결제하려면 직원에게 계산서를 요청해 주세요.', de: 'Diese Rechnung gehört zu Tisch {m}. Zum Bezahlen bitte das Servicepersonal um die Rechnung.', fr: 'Cette addition est celle de la table {m}. Pour la régler, demande l\'addition à ton serveur.', ja: 'このお会計は{m}番テーブルのものです。お支払いはスタッフにお申し付けください。' }],

  ['El total cambió a {t}. Toca de nuevo para pagar.', { en: 'The total changed to {t}. Tap again to pay.', pt: 'O total mudou para {t}. Toque de novo para pagar.', it: 'Il totale è cambiato in {t}. Tocca di nuovo per pagare.', zh: '总额已变为{t}。请再点一次付款。', ko: '총액이 {t}(으)로 바뀌었어요. 결제하려면 다시 눌러 주세요.', de: 'Der Gesamtbetrag ist jetzt {t}. Tippe erneut, um zu bezahlen.', fr: 'Le total est passé à {t}. Touche à nouveau pour payer.', ja: '合計が{t}に変わりました。もう一度タップしてお支払いください。' }],
  ['Pago cancelado. Puedes intentarlo de nuevo o pedir la cuenta a tu mesero.', { en: 'Payment cancelled. You can try again or ask your waiter for the bill.', pt: 'Pagamento cancelado. Você pode tentar de novo ou pedir a conta ao seu garçom.', it: 'Pagamento annullato. Puoi riprovare o chiedere il conto a chi ti serve.', zh: '付款已取消。你可以再试一次，或向服务员要账单。', ko: '결제가 취소되었어요. 다시 시도하거나 직원에게 계산서를 요청해 주세요.', de: 'Zahlung abgebrochen. Du kannst es erneut versuchen oder das Servicepersonal um die Rechnung bitten.', fr: 'Paiement annulé. Tu peux réessayer ou demander l\'addition à ton serveur.', ja: 'お支払いがキャンセルされました。もう一度お試しいただくか、スタッフにお会計をお申し付けください。' }],

  ['si completaste el pago, tu mesero lo verá en su pantalla en unos segundos', { en: 'if you completed the payment, your waiter will see it on their screen in a few seconds', pt: 'se você concluiu o pagamento, seu garçom verá na tela em alguns segundos', it: 'se hai completato il pagamento, chi ti serve lo vedrà sul suo schermo tra pochi secondi', zh: '如果你已完成付款，服务员几秒钟后就会在屏幕上看到', ko: '결제를 완료했다면 몇 초 후 직원 화면에 표시돼요', de: 'wenn du die Zahlung abgeschlossen hast, sieht das Servicepersonal sie in wenigen Sekunden auf dem Bildschirm', fr: 'si tu as terminé le paiement, ton serveur le verra sur son écran dans quelques secondes', ja: 'お支払いが完了していれば、数秒でスタッフの画面に表示されます' }],

  ['Este QR ya no sirve para pagar: pide la cuenta a tu mesero.', { en: 'This QR can no longer be used to pay: ask your waiter for the bill.', pt: 'Este QR não serve mais para pagar: peça a conta ao seu garçom.', it: 'Questo QR non serve più per pagare: chiedi il conto a chi ti serve.', zh: '此二维码已不能用于付款：请向服务员要账单。', ko: '이 QR로는 더 이상 결제할 수 없어요: 직원에게 계산서를 요청해 주세요.', de: 'Mit diesem QR-Code kann nicht mehr bezahlt werden: bitte das Servicepersonal um die Rechnung.', fr: 'Ce QR ne permet plus de payer : demande l\'addition à ton serveur.', ja: 'このQRではお支払いできません。スタッフにお会計をお申し付けください。' }],
  ['Tu cuenta cambió mientras pagabas. Revisa el total y toca de nuevo.', { en: 'Your bill changed while you were paying. Check the total and tap again.', pt: 'Sua conta mudou enquanto você pagava. Confira o total e toque de novo.', it: 'Il tuo conto è cambiato mentre pagavi. Controlla il totale e tocca di nuovo.', zh: '你付款时账单发生了变化。请核对总额后再点一次。', ko: '결제하는 동안 계산서가 바뀌었어요. 총액을 확인하고 다시 눌러 주세요.', de: 'Deine Rechnung hat sich während der Zahlung geändert. Prüfe den Gesamtbetrag und tippe erneut.', fr: 'Ton addition a changé pendant le paiement. Vérifie le total et touche à nouveau.', ja: 'お支払い中にお会計が変わりました。合計を確認して、もう一度タップしてください。' }],
  ['El pago tardó demasiado. Toca de nuevo para pagar.', { en: 'The payment took too long. Tap again to pay.', pt: 'O pagamento demorou demais. Toque de novo para pagar.', it: 'Il pagamento ha impiegato troppo. Tocca di nuovo per pagare.', zh: '付款超时。请再点一次付款。', ko: '결제 시간이 너무 오래 걸렸어요. 다시 눌러 결제해 주세요.', de: 'Die Zahlung hat zu lange gedauert. Tippe erneut, um zu bezahlen.', fr: 'Le paiement a pris trop de temps. Touche à nouveau pour payer.', ja: 'お支払いに時間がかかりすぎました。もう一度タップしてお支払いください。' }],
  ['Ya hay una parte pagada: tu mesero te cobra el resto.', { en: 'Part has already been paid: your waiter will charge you the rest.', pt: 'Já há uma parte paga: seu garçom cobra o restante.', it: 'Una parte è già pagata: il resto te lo fa pagare chi ti serve.', zh: '已支付部分金额：剩余部分由服务员为你结算。', ko: '일부가 이미 결제되었어요: 나머지는 직원이 결제해 드려요.', de: 'Ein Teil ist bereits bezahlt: den Rest kassiert das Servicepersonal.', fr: 'Une partie est déjà réglée : ton serveur t\'encaisse le reste.', ja: '一部はお支払い済みです。残りはスタッフがお会計します。' }],
  ['No pudimos abrir el pago. Intenta de nuevo o pide la cuenta a tu mesero.', { en: 'We couldn\'t open the payment. Try again or ask your waiter for the bill.', pt: 'Não conseguimos abrir o pagamento. Tente de novo ou peça a conta ao seu garçom.', it: 'Non siamo riusciti ad aprire il pagamento. Riprova o chiedi il conto a chi ti serve.', zh: '无法打开付款。请重试，或向服务员要账单。', ko: '결제를 열 수 없었어요. 다시 시도하거나 직원에게 계산서를 요청해 주세요.', de: 'Wir konnten die Zahlung nicht öffnen. Versuche es erneut oder bitte das Servicepersonal um die Rechnung.', fr: 'Impossible d\'ouvrir le paiement. Réessaie ou demande l\'addition à ton serveur.', ja: 'お支払い画面を開けませんでした。もう一度お試しいただくか、スタッフにお会計をお申し付けください。' }],
  ['Pago seguro con Fintoc', { en: 'Secure payment with Fintoc', pt: 'Pagamento seguro com Fintoc', it: 'Pagamento sicuro con Fintoc', zh: '通过 Fintoc 安全付款', ko: 'Fintoc 안전 결제', de: 'Sichere Zahlung mit Fintoc', fr: 'Paiement sécurisé avec Fintoc', ja: 'Fintocで安全にお支払い' }],
  ['nosotros nunca vemos ni guardamos tus datos bancarios', { en: 'we never see or store your bank details', pt: 'nós nunca vemos nem guardamos seus dados bancários', it: 'non vediamo né conserviamo mai i tuoi dati bancari', zh: '我们绝不会查看或保存你的银行信息', ko: '저희는 고객님의 은행 정보를 보거나 저장하지 않아요', de: 'wir sehen und speichern deine Bankdaten nie', fr: 'nous ne voyons ni ne conservons jamais tes données bancaires', ja: '当店が口座情報を見たり保存したりすることはありません' }],
  ['¿Qué es?', { en: 'What is it?', pt: 'O que é?', it: 'Cos\'è?', zh: '这是什么？', ko: '무엇인가요?', de: 'Was ist das?', fr: 'C\'est quoi ?', ja: 'これは？' }],
  ['¿Quién es Fintoc?', { en: 'Who is Fintoc?', pt: 'Quem é a Fintoc?', it: 'Chi è Fintoc?', zh: 'Fintoc 是谁？', ko: 'Fintoc은 어떤 회사인가요?', de: 'Wer ist Fintoc?', fr: 'Qui est Fintoc ?', ja: 'Fintocとは？' }],
  ['Fintoc es la empresa que procesa tu pago. Es la primera iniciadora de pagos de Chile con certificación ISO 27001 (seguridad de la información) y cumple la Ley Fintec.', { en: 'Fintoc is the company that processes your payment. It is Chile\'s first payment initiator certified ISO 27001 (information security) and it complies with Chile\'s Ley Fintec.', pt: 'A Fintoc é a empresa que processa seu pagamento. É a primeira iniciadora de pagamentos do Chile com certificação ISO 27001 (segurança da informação) e cumpre a Ley Fintec.', it: 'Fintoc è l\'azienda che elabora il tuo pagamento. È il primo iniziatore di pagamenti del Cile con certificazione ISO 27001 (sicurezza delle informazioni) e rispetta la Ley Fintec.', zh: 'Fintoc 是处理你付款的公司。它是智利首家获得 ISO 27001（信息安全）认证的支付发起机构，并符合智利《金融科技法》（Ley Fintec）。', ko: 'Fintoc은 결제를 처리하는 회사예요. ISO 27001(정보 보안) 인증을 받은 칠레 최초의 결제 개시 기관이며 칠레 핀테크법(Ley Fintec)을 준수해요.', de: 'Fintoc ist das Unternehmen, das deine Zahlung abwickelt. Es ist Chiles erster Zahlungsauslösedienst mit ISO-27001-Zertifizierung (Informationssicherheit) und erfüllt das chilenische Fintech-Gesetz (Ley Fintec).', fr: 'Fintoc est l\'entreprise qui traite ton paiement. C\'est le premier initiateur de paiement du Chili certifié ISO 27001 (sécurité de l\'information), conforme à la Ley Fintec.', ja: 'Fintocはお支払いを処理する会社です。チリで初めてISO 27001（情報セキュリティ）認証を取得した決済開始事業者で、チリのフィンテック法（Ley Fintec）に準拠しています。' }],
  ['Nosotros no vemos tus datos: tu pago va por un canal separado y a nosotros solo nos llega «mesa pagada».', { en: 'We don\'t see your details: your payment goes through a separate channel and we only receive "table paid".', pt: 'Nós não vemos seus dados: seu pagamento vai por um canal separado e para nós só chega «mesa paga».', it: 'Noi non vediamo i tuoi dati: il pagamento passa da un canale separato e a noi arriva solo «tavolo pagato».', zh: '我们看不到你的信息：你的付款走独立通道，我们只会收到“桌已付款”。', ko: '저희는 고객님의 정보를 볼 수 없어요: 결제는 별도 경로로 처리되고 저희에게는 ‘테이블 결제 완료’만 전달돼요.', de: 'Wir sehen deine Daten nicht: Deine Zahlung läuft über einen eigenen Kanal, und bei uns kommt nur „Tisch bezahlt“ an.', fr: 'Nous ne voyons pas tes données : ton paiement passe par un canal séparé et nous recevons seulement « table payée ».', ja: '当店はお客様の情報を見ることができません。お支払いは別の経路で処理され、当店には「お支払い済み」のみが届きます。' }],
  ['Fintoc no guarda tus credenciales.', { en: 'Fintoc does not store your credentials.', pt: 'A Fintoc não guarda suas credenciais.', it: 'Fintoc non conserva le tue credenziali.', zh: 'Fintoc 不会保存你的登录凭证。', ko: 'Fintoc은 고객님의 로그인 정보를 저장하지 않아요.', de: 'Fintoc speichert deine Zugangsdaten nicht.', fr: 'Fintoc ne conserve pas tes identifiants.', ja: 'Fintocはお客様のログイン情報を保存しません。' }],
  ['Nunca te pediremos tu clave: ni el mesero ni por WhatsApp. Tu clave solo se escribe en el paso de tu banco.', { en: 'We will never ask for your password: not the waiter, not by WhatsApp. You only type your password in your bank\'s step.', pt: 'Nunca vamos pedir sua senha: nem o garçom, nem por WhatsApp. Sua senha só é digitada na etapa do seu banco.', it: 'Non ti chiederemo mai la password: né il cameriere né su WhatsApp. La password si scrive solo nel passaggio della tua banca.', zh: '我们绝不会向你索要密码：服务员不会，WhatsApp 上也不会。密码只在你银行的步骤中输入。', ko: '저희는 절대 비밀번호를 묻지 않아요: 직원도, WhatsApp으로도요. 비밀번호는 은행 단계에서만 입력해요.', de: 'Wir fragen nie nach deinem Passwort: weder das Servicepersonal noch per WhatsApp. Dein Passwort gibst du nur im Schritt deiner Bank ein.', fr: 'Nous ne te demanderons jamais ton mot de passe : ni le serveur, ni par WhatsApp. Ton mot de passe se saisit uniquement à l\'étape de ta banque.', ja: 'パスワードをお尋ねすることは決してありません（スタッフからもWhatsAppでも）。パスワードは銀行の画面でのみ入力してください。' }],
  ['Si pagas por transferencia, en tu cartola aparece «Fintoc».', { en: 'If you pay by transfer, your bank statement will show "Fintoc".', pt: 'Se você pagar por transferência, no seu extrato aparece «Fintoc».', it: 'Se paghi con bonifico, nell\'estratto conto compare «Fintoc».', zh: '如果你通过转账付款，银行流水上会显示“Fintoc”。', ko: '계좌이체로 결제하면 거래 내역에 ‘Fintoc’이 표시돼요.', de: 'Wenn du per Überweisung bezahlst, steht auf deinem Kontoauszug „Fintoc“.', fr: 'Si tu paies par virement, ton relevé indiquera « Fintoc ».', ja: '振込でお支払いの場合、明細には「Fintoc」と表示されます。' }],
  ['Únete a La Lista', { en: 'Join La Lista', pt: 'Entre na La Lista', it: 'Entra in La Lista', zh: '加入 La Lista', ko: 'La Lista 가입하기', de: 'Werde Teil von La Lista', fr: 'Rejoins La Lista', ja: 'La Listaに参加する' }],

     strumento (con il push del JL), non l'orario del prodotto in carta. Bordo muto o nessuno strumento per lui ⇒ l'orario della carta, come prima. */
  if (p.c === 'menu_contenitore') { const sc = strumDelCont(p.id); if (sc) return !!sc.visible; }
  if (p.hf === p.hi) return true;
  const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Santiago' })); const h = d.getHours() + d.getMinutes() / 60;
  return p.hf > p.hi ? (h >= p.hi && h < p.hf) : (h >= p.hi || h < p.hf);
}

function gruppi() {
  let g = {}; try { g = JSON.parse((S.cfg && S.cfg.category_groups) || '{}'); } catch (e) { g = {}; }
  /* v0.10.21 (🟡 di EL GIRO): un menú-contenitore fuori dal suo orario non tiene acceso il chip: a cena il QR non si apre su «Promo»
     col Menú del día grigio. Il chip c'è solo quando almeno un menú si può ordinare adesso (alle 15:00 sparisce da solo, ri-disegno del minuto). */
  const conProd = new Set(S.prod.filter((p) => visibile(p) && (p.c !== 'menu_contenitore' || inOrario(p))).map((p) => p.c));
  /* v0.10.21 (Alberto 13-nov: «il menu del día è nella categoria mojitos, dovrebbe essere in PROMO»): i menú-contenitore (Menú del día,
     Menú 3 Tiempos) non stanno in nessuna famiglia della config ⇒ niente chip. Se la config non li mette da nessuna parte, vanno nel chip
     «Promo», PRIMO della prima famiglia: è quello che vende a pranzo. Il giorno che la config li nomina, vince la config. */
  /* v0.10.24 (Alberto 13-nov: «il chip Promo deve andare nella riga di sopra, insieme a Comer»): non più un chip DENTRO Comer, ma una
     FAMIGLIA sua, prima di tutte, con la categoria «Menús». Le promo da bere (il 2x1) ci entrano col passo dopo (dom 15). */
  const giaDentro = Object.keys(g).some((k) => (g[k].cats || []).indexOf('menu_contenitore') >= 0);
  const fam = Object.keys(g).map((k) => ({ k, emoji: g[k].emoji || '', cats: (g[k].cats || []).filter((c) => conProd.has(c)) }));
  if (!giaDentro && !g.Promo) fam.unshift({ k: 'Promo', emoji: '🏷️', cats: ['menu_contenitore'].filter((c) => conProd.has(c)) });
  // v0.10.31 · il passo «dom 15» anticipato: le promo da bere entrano in Promo come categoria sua, e solo da lì il 2x1 si prende
  if (S.prod.some((p) => visibile(p) && inOrario(p) && promo2x1(p))) { let pf = fam.find((x) => x.k === 'Promo'); if (!pf) { pf = { k: 'Promo', emoji: '🏷️', cats: [] }; fam.unshift(pf); } pf.cats.push(CAT2X1); }
  return fam.filter((x) => x.cats.length);
}

const normB = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

   Ora ogni parola cercata deve essere l'INIZIO di una parola del prodotto, e l'ordine è: il nome comincia con la frase › una parola del
   nome comincia con ogni parola cercata › solo descrizione o categoria. */

/* ═══ v0.10.1 · IL MEMBER DELLA LISTA — 🩹 TAMPONE DICHIARATO (Alberto, mer 11-nov: «QR oggi, member dal GAS come tampone fino a ven 13») ═══
