<!-- DEVICE-CLASS: 1 · cattura in movimento (il telefono del cliente al tavolo) -->
<!--
  ═══ IL MENÙ VERO · scheletro v0.1 · 📖 MENU BKS V32 · mer 28-ott-2026 ═══════════════════════════════════════════════════════════
  Il disegno è il mockup v1.x (ATALAYA/4_CANTIERE_MENU/MOCKUP_MENU_QUATTRO_ZONE_V2_21OTT2026.html), il criterio di chiusura il §⑭ del
  modello: il vero non può essere più povero del mockup. Il perimetro è il §⑮.
  🏢 MULTIEMPRESA DAL PRIMO GIORNO (Alberto, 28-ott): nessun locale scritto qui. Il locale arriva dal QR (?l=), e marca, famiglie,
  catalogo, lingue e pezzi accesi vengono dalla sua config sul bordo. Regola e banco: ARCHITETTURA_MENU_VERO_MULTIEMPRESA_28OTT2026.md.
  🚫 NIENTE GOOGLE: legge solo dal bordo (/estado ?seccion=menu_config e /carta). Se il bordo non risponde lo dice, non ripiega su Google.
  v0.1 = LEGGE E MOSTRA (famiglie, categorie, griglia, scheda grande, carrello) · v0.2 = la carta di adesso dal tick del bordo ·
  v0.3 = la scheda aperta del mockup · v0.4 = L'INVIO e LA CAMPANELLA (AUT-0749), dietro la leva `menu_vero_envio_on` della config:
  vuota = vista previa, nessun pedido parte da qui. I piatti che chiedono una scelta non partono finché non c'è la schermata delle scelte.
-->
<style>
:root{
  /* il tema del mockup è il default; una config di locale lo può cambiare con le chiavi tema_* (bozza per 🚚 MIGRA) */
  --bg:#0A0806;--sup:#14100C;--card:#1A1510;--txt:#F3EDE4;--suave:rgba(243,237,228,.62);
  --linea:rgba(255,140,80,.18);--linea2:rgba(255,140,80,.36);--acc:#FF6A1F;--oro:#FFC53D;
  --ok:#8B9E4F;--ok-txt:#14180A;--ok-chiaro:#A9BE68;--male:#FF6B5E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Outfit,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.app{height:var(--alto,100dvh);display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* la riga in alto: una famiglia sola, stessa altezza, un solo pieno (mockup v1.1) */
.z1{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--linea);min-height:50px;background:linear-gradient(rgba(10,8,6,.92),rgba(10,8,6,.8))}
.casa{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:transparent;border:0;color:rgba(243,237,228,.82);display:flex;align-items:center;justify-content:center;cursor:pointer}
.chi{flex:1;min-width:0;line-height:1.15}
.chi b{display:block;font-size:14px}
.chi span{display:block;font-size:11px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.z3{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
/* la griglia da 12, con foto (mockup: .sei.fotos) */
/* minmax(0,1fr): tre colonne SEMPRE uguali. Con 1fr un nome lungo su una riga (la card VER) allargava la sua colonna e stringeva le altre */
.sei{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;align-content:start}
/* poche card: si appoggiano al fondo, nell'arco del pollice (mockup, Alberto 21-ott) */
.z3.basso{display:flex;flex-direction:column}
.z3.basso>*{margin-top:auto}   /* non justify-content:flex-end: se il contenuto cresce, l'eccedenza deve restare scorrevole */
.cd{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--linea);border-radius:12px;padding:6px;min-height:188px;cursor:pointer;text-align:left;color:var(--txt)}
.cd .th{width:100%;height:auto;aspect-ratio:4/3;border-radius:8px;object-fit:cover;object-position:center 60%;background:var(--sup)}
.cd .tg{width:100%;height:76px;border-radius:8px;background:#1b140a;color:var(--oro);display:flex;align-items:center;justify-content:center;
  text-align:center;padding:4px;font-family:Fraunces,Georgia,serif;font-size:12px;line-height:1.15}
.cd .nm{font-size:12px;font-weight:700;line-height:1.22;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.cd .pz{font-size:12.5px;font-weight:800;color:var(--oro);font-variant-numeric:tabular-nums}
.addb{margin-top:auto;width:100%;background:transparent;color:var(--ok-chiaro);border:1.5px solid rgba(139,158,79,.6);border-radius:8px;font-weight:800;font-size:11px;min-height:30px;cursor:pointer}
.cd.dentro{border-color:var(--ok)}
.pz s{font-weight:600;opacity:.6;margin-right:2px}
.pz .emd{display:block;font-size:10px;font-weight:700;color:var(--ok-chiaro);letter-spacing:.02em;margin-top:1px}
.det .pz .emd{font-size:12px;margin-top:3px}
.cd.agot{opacity:.55;filter:grayscale(1);pointer-events:none}
.cd .agl{margin-top:auto;font-size:11px;font-weight:800;color:#ff8a7a}
.cd.fh .agl{color:var(--oro)}
.qn{display:flex;align-items:center;justify-content:space-between;margin-top:auto;background:var(--ok);color:var(--ok-txt);border-radius:8px;min-height:30px;font-weight:800}
.qn i{font-style:normal;width:34px;text-align:center;font-size:17px;cursor:pointer}
/* ═══ la scheda aperta (mockup V8-V9, 21/23-ott): META SOPRA vende, META SOTTO le sei per continuare a viaggiare ═══
   La foto prende lo spazio che il testo non usa; nome e descrizione si fermano a due righe; sotto, pagine di SEI
   che scattano DI LATO (il pollice fa un arco orizzontale). Il piatto aperto resta dove l'hai toccato: il legame
   col pannello lo dice il segno «VER ▲» in oro, non la posizione. */
.z3.aperta{overflow:hidden}
.split{display:flex;flex-direction:column;height:100%}
/* con le domande la foto cede spazio (fino a 60px) e, se ancora non basta, la metà alta scorre: le scelte stanno sempre nello schermo */
.det{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow-y:auto}
/* la foto grande prende TUTTA la larghezza (Alberto 28-ott: «sembra troncata»): riempie da bordo a bordo l'altezza che resta
   fra la testa e la striscia sotto, e non supera mai il 4:3 della foto. Dove l'altezza manca, il taglio è sopra e sotto, mai ai lati. */
.det .fo{flex:1 1 auto;width:100%;max-height:75vw;min-height:60px;background:#000;position:relative;overflow:hidden}
.det .fo::before,.det .fo::after{content:'';position:absolute;inset:0;z-index:0;background-image:var(--f);background-position:center var(--fy,55%);background-repeat:no-repeat}
/* v0.5.9 (Alberto 28-ott, Caipirisima tagliata sotto): dove l'altezza manca si taglia di più SOPRA che sotto. Il piatto e il
   bicchiere stanno nella metà bassa della foto (il tavolo), il cielo della foto è il fondo del bar. Default 60%; una foto nostra
   può dichiarare il suo punto in fotos.json ({"f":"x.webp","y":70}). */
.det .fo::before{background-size:cover;filter:blur(16px) brightness(.45);transform:scale(1.1)}
.det .fo::after{background-size:cover}
.det .fo.tg::before,.det .fo.tg::after{content:none}
.det .fo>*{position:relative;z-index:1}
.det .fo.tg{display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:300;font-size:25px;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,rgba(255,197,61,.18),#0b0906 65%)}
.det .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font-size:16px;cursor:pointer}
/* v0.6.2: nome e prezzo sulla stessa riga, la descrizione sotto: ~40px restituiti alla foto */
.det .bd{flex:0 0 auto;padding:6px 13px 7px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n p" "d d";column-gap:10px;align-items:baseline}
.det .bd h2{grid-area:n}.det .bd .pz{grid-area:p;text-align:right}.det .bd .ds{grid-area:d}
.det h2{font-family:Fraunces,Georgia,serif;font-weight:300;font-size:20px;margin:0;letter-spacing:-.3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.det .ds{font-size:12px;color:var(--suave);line-height:1.4;margin:3px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.det .pz{font-size:19px;font-weight:800;color:var(--oro);font-variant-numeric:tabular-nums}
.mini{flex:0 0 auto;border-top:1px solid var(--linea2);background:rgba(7,6,5,.55);padding:9px 8px 5px;display:flex;gap:8px;
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-inline:8px}
.mini::-webkit-scrollbar{height:0}
.mini .pag{flex:0 0 100%;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:7px 6px;scroll-snap-align:start}
.mini .cd{min-height:0;height:96px;padding:7px;gap:3px;position:relative}
.mini .cd .nm{-webkit-line-clamp:2;font-size:12px;line-height:1.2;min-height:0}
.mini .cd .pz{font-size:12.5px}
.mini .cd .addb{min-height:30px;font-size:12px;margin-top:auto}
.mini .cd .qn{min-height:30px;margin-top:auto}
/* la card del piatto aperto: il tasto stesso, in oro, col segno VER a cavallo del bordo (la linea si interrompe) */
.mini .cd.ora{overflow:visible;background:rgba(255,197,61,.20);border:2.5px solid var(--oro);box-shadow:0 0 0 3px rgba(255,197,61,.22),0 6px 18px rgba(0,0,0,.45);
  justify-content:center;align-items:stretch;text-align:center;gap:3px;padding:9px 6px 4px}
.mini .cd.ora::before{content:"VER ▲";position:absolute;top:-7px;left:50%;transform:translateX(-50%);padding:0 6px;background:var(--bg);line-height:12px;white-space:nowrap;
  font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--oro)}
.ver .vnm{font-size:10.5px;font-weight:700;color:var(--suave);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ver .vpd{background:var(--ok);color:var(--ok-txt);border-radius:9px;font-weight:800;font-size:13px;letter-spacing:.03em;padding:6px 4px}
.ver .vpz{font-size:13px;font-weight:800;color:var(--oro);font-variant-numeric:tabular-nums}
.ver .vst{display:flex;gap:6px;align-items:center}
.ver .vst i{flex:1;height:34px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;font-weight:800;background:var(--ok);color:var(--ok-txt);border-radius:9px;cursor:pointer}
.ver .vst u{text-decoration:none;font-size:15px;font-weight:800;min-width:18px}
@keyframes lampoVer{0%{box-shadow:0 0 0 0 rgba(255,197,61,.85);background:rgba(255,197,61,.28)}100%{box-shadow:0 0 0 10px rgba(255,197,61,0)}}
.mini .cd.ora.lampo{animation:lampoVer .6s ease-out 1}
.punti{flex:0 0 auto;display:flex;justify-content:center;gap:5px;padding:0 0 6px;background:rgba(7,6,5,.55)}
.punti i{width:6px;height:6px;border-radius:3px;background:var(--linea2);transition:width .15s}
.punti i.on{width:16px;background:var(--oro)}
.pedir{padding:4px 14px 14px}
.envG{width:100%;background:var(--ok);color:var(--ok-txt);border:0;border-radius:13px;padding:13px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.envG b{font-size:15px;font-weight:800}
.envG span{font-size:11.5px;font-weight:700;opacity:.8}
.envG.spento{background:transparent;color:var(--suave);border:2px dashed rgba(139,158,79,.6);cursor:default}
/* la barra in basso: famiglie + categorie + la porta del pedido */
.z2{flex:0 0 auto;border-top:1px solid var(--linea);background:var(--sup);padding:6px 8px 8px}
.r{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.r::-webkit-scrollbar{height:0}
.fam,.cat{flex:0 0 auto;border:1px solid var(--linea2);background:transparent;color:var(--txt);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.fam.on{background:var(--card);border-color:var(--oro)}
.cat.on{background:var(--oro);color:#1a1408;border-color:var(--oro)}
.cartp{flex:0 0 auto;margin-left:auto;border:0;border-radius:99px;background:var(--ok);color:var(--ok-txt);padding:7px 12px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap}
/* il pedido */
/* il pedido, la conferma e la campanella partono dal BASSO, dove sta il pollice (mockup 21-ott) */
.ped{padding:12px 14px;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.pedtit{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:19px;letter-spacing:-.2px;margin-bottom:9px}
.pedx{background:transparent;border:0;color:var(--suave);font-size:18px;cursor:pointer}
.lin{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--linea)}
.lin img,.lin .lth{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--sup);flex:0 0 auto}
.lin .lnm{flex:1;min-width:0;font-size:13px;font-weight:700}
.lin .lpz{font-weight:800;color:var(--oro);font-variant-numeric:tabular-nums}
.lin .lq{display:flex;align-items:center;gap:6px}
.lin .lq i{font-style:normal;width:28px;height:28px;border-radius:8px;border:1px solid var(--linea2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin:12px 0 4px}
.vuoto{color:var(--suave);font-size:13px;padding:18px 0}
/* l'invio, la conferma, la campanella (mockup 21/23-ott) */
/* le domande nella scheda grande (mockup: «¿Cómo la quieres?» sotto il prezzo, chip; il sovrapprezzo sul chip) */
.prep{flex:0 0 auto;margin:0 13px 10px;padding:9px 10px;border:1px solid var(--linea2);border-radius:12px;background:var(--card)}
.prep .q{font-size:13px;font-weight:800;margin-bottom:7px}
.prep .q .mreq{font-size:10.5px;font-weight:800;color:var(--oro);margin-left:4px}
.prep .op{display:flex;flex-wrap:wrap;gap:6px}
.prep .op button{border:1.5px solid var(--linea2);background:transparent;color:var(--txt);border-radius:99px;padding:8px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.prep .op button b{color:var(--oro);font-weight:800}
.prep .op button.on{background:var(--ok);border-color:var(--ok);color:var(--ok-txt)}
.prep .op button.on b{color:var(--ok-txt)}
.ver .vsc{font-size:11px;font-weight:800;color:var(--ok-chiaro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addb.chiede{border-style:dashed}
.lin .lsc{display:block;font-size:11px;font-weight:600;color:var(--ok-chiaro)}
.opc{margin-top:auto;font-size:10.5px;font-weight:700;color:var(--suave);border:1px dashed var(--linea2);border-radius:8px;padding:6px 4px;text-align:center}
.ver .vpd.off{background:transparent;color:var(--suave);border:1px dashed var(--linea2);font-size:11px}
.envG{position:relative;overflow:hidden;margin-top:8px}
.envG.hold{background:var(--sup);color:var(--txt);border:2px solid var(--ok)}
.envG.hold span{opacity:.75}
.envG .barra{position:absolute;left:0;bottom:0;height:4px;background:var(--ok);width:var(--da);animation:vacia linear forwards}
@keyframes vacia{from{width:var(--da)}to{width:0}}
.segui{display:block;width:100%;background:transparent;border:0;color:var(--suave);font-size:13px;font-weight:700;padding:10px;margin-top:2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.avv{margin-top:10px;font-size:13px;font-weight:700;color:var(--oro);line-height:1.35}
.avvs{margin-top:6px;font-size:12px;color:var(--suave)}
.okv{background:rgba(139,158,79,.14);border:1px solid var(--ok);color:var(--ok-chiaro);border-radius:12px;padding:12px;font-size:16px;font-weight:800;margin:4px 0 10px}
.okv span{display:block;font-size:12px;font-weight:600;color:var(--suave);margin-top:3px}
.okr{font-size:13px;padding:5px 0;border-top:1px solid var(--linea)}
.okr b{color:var(--oro);font-variant-numeric:tabular-nums}
.sigue2{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:10px 10px 10px 8px;cursor:pointer;background:var(--card);border:1px solid var(--linea2);border-radius:14px;color:var(--txt);text-align:left}
.sigue2 .s2f{display:flex;flex:0 0 auto}
.sigue2 .s2f img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);margin-left:-12px}
.sigue2 .s2f img:first-child{margin-left:0}
.sigue2 .s2t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sigue2 .s2t b{font-size:14.5px;line-height:1.2}
.sigue2 .s2t small{font-size:11.5px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sigue2 .s2v{flex:0 0 auto;background:var(--oro);color:#1a1408;font-weight:800;font-size:13px;padding:8px 12px;border-radius:999px}
/* Buscar: la lente resta ancorata a destra mentre le categorie scorrono; aperta, il campo nasce dentro la barra */
.cat.lupa{position:sticky;right:0;z-index:2;background:var(--sup);border-color:var(--linea2);box-shadow:-8px 0 10px -6px var(--sup)}
.rbusca{align-items:center;gap:7px;overflow:visible}
.rbusca .lup{flex:0 0 auto;font-size:14px}
.rbusca .bin{flex:1;min-width:0;background:var(--card);border:1px solid var(--linea2);color:var(--txt);border-radius:10px;padding:9px 11px;font:inherit;font-size:16px;min-height:38px}
.rbusca .bin::placeholder{color:var(--suave)}
.rbusca .bin::-webkit-search-cancel-button{display:none}
.rbusca .bx{flex:0 0 auto;background:transparent;border:0;color:var(--suave);font-size:16px;padding:6px 6px;cursor:pointer;min-height:38px}
.bell{flex:0 0 auto;width:36px;height:34px;border-radius:50%;border:0;background:var(--oro);font-size:16px;cursor:pointer}
.cmp{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--linea);border-radius:12px;padding:11px 12px;margin-top:7px;color:var(--txt);cursor:pointer}
.cmp .sn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cmp .sn b{font-size:14px}
.cmp .sn i{font-style:normal;font-size:11.5px;color:var(--suave)}
.cmp .sp{color:var(--oro);font-size:18px;font-weight:800}
.nota{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:88%;background:#24201a;color:var(--txt);border:1px solid var(--linea2);
  border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;z-index:9}
.nota.vai{animation:notaV 4.5s ease forwards}
@keyframes notaV{0%{opacity:0;transform:translate(-50%,8px)}8%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
/* stati */
.msg{padding:40px 22px;text-align:center;color:var(--suave);font-size:14px;line-height:1.45}
.msg b{display:block;color:var(--txt);font-size:18px;margin-bottom:6px}
#ver{position:fixed;right:6px;bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:9px;color:rgba(243,237,228,.3);pointer-events:none}
</style></head>

<script>
'use strict';
/* ═══ la sorgente: SOLO il bordo. Il token è quello pubblico di lettura che il menù vivo usa già (sola lettura). ═══ */
const BORDO = 'https://pinsita-borde.alberto-agostini.workers.dev';
const TOKEN_LETTURA = '7QvreCN5fzM40GW2Me8vfvNwIwcA9RDnTceXMwgZ';

/* ═══ la carta: lo stesso CSV del menù vivo, servito dal bordo ═══ */
function parseCSV(t) {
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n') { r.push(c.replace(/\r$/, '')); rows.push(r); r = []; c = ''; }
    else c += ch;
  }
  if (c || r.length) { r.push(c); rows.push(r); }
  return rows;
}
const prezzo = (s) => Number(String(s || '').replace(/[^0-9]/g, '')) || 0;
const oraDec = (s, def) => { const m = String(s || '').trim().match(/^(\d{1,2})\s*:?\s*(\d{1,2})?/); return m ? (+m[1]) + (m[2] ? (+m[2]) / 60 : 0) : def; };
function prodotti(csv) {
  const rows = parseCSV(csv); const h = rows[0] || []; const ix = (n) => h.indexOf(n);
  const dCol = ix('Descripcion_' + LANG.toUpperCase());
  return rows.slice(1).filter((r) => r[ix('ID_Producto')]).map((r) => ({
    id: r[ix('ID_Producto')], n: r[ix('Nombre')], c: String(r[ix('Categoria')] || '').toLowerCase(),
    d: (dCol >= 0 && r[dCol]) ? r[dCol] : r[ix('Descripcion')], p: prezzo(r[ix('Precio')]), img: r[ix('Imagen_URL')] || '',
    activo: r[ix('Activo')] === 'TRUE', agotado: r[ix('Agotado')] === 'TRUE', visible: r[ix('Menu_Visible')] !== 'FALSE',
    hi: oraDec(r[ix('Hora_Inicio')], 0), hf: oraDec(r[ix('Hora_Fin')], 24),
    sm: String(r[ix('Solo_Member')] || '').trim(),
    // le scelte che la carta porta già: il testo dei modificadores («Sola/Chelada +$1.500») e il badge della carne (→ término)
    mt: String(r[ix('Modificadores')] || '').trim(), carne: /\bcarne\b/i.test(r[ix('Badges')] || ''),
  // Solo_Member: il piatto non esiste per nessuno tranne chi porta quel tag (come il vivo). Rientra col member, passo dopo.
  })).filter((p) => p.activo && p.visible && p.p > 0 && !p.sm);
}

/* ═══ il tick: la stessa foto che il menù vivo chiede a Google ogni 60", qui letta dal bordo (sec menu_tick) ═══
   Porta: i prezzi di fascia (reglas), i nascosti (ocultos), gli agotados di adesso, le stazioni chiuse.
   Senza tick (bordo che non risponde) la carta resta quella del CSV: prezzo base, nessun nascosto. */
const tickP = () => (S.tick && S.tick.precios) || {};
const tickA = () => (S.tick && S.tick.agotados) || {};
// v0.5.2 (Alberto 28-ott): un prodotto in 86 NON si vede affatto, niente card grigia «Se acabó por hoy»
function visibile(p) { return (tickP().ocultos || []).indexOf(p.id) < 0 && !esaurito(p); }
/* MENÚ DEL DÍA (Alberto, 28-ott): il prezzo del menú NON è il prezzo del piatto. Il piatto ordinato da solo costa il suo
   prezzo, a qualsiasi ora; a pranzo sotto il piatto c'è solo l'informazione «En Menú del día» (senza prezzo, senza clic).
   Il menú si vende dal carosello e dalle promo, come prodotto a sé. ⇒ la regla `almuerzo` non riprezza il piatto. */
const inMenuDia = (p) => ((tickP().reglas || {})[p.id] || {}).tipo === 'almuerzo';
function prezzoOra(p) {
  const r = inMenuDia(p) ? null : (tickP().reglas || {})[p.id];
  // priorità del vivo: regla-fascia > base; il barrato solo se la regola ABBASSA
  if (r && r.precio > 0 && r.precio !== p.p) return { v: r.precio, orig: r.precio < p.p ? p.p : 0 };
  return { v: p.p, orig: 0 };
}
function chiusa(p) {
  const a = tickA(); const est = a.estaciones; if (!est) return '';
  if ((a.salvo_ids || []).indexOf(p.id) >= 0) return '';
  const e = (a.barra_cats || []).indexOf(p.c) >= 0 ? 'barra' : 'cocina';
  return est[e] && est[e].abierta === false ? e : '';
}
const esaurito = (p) => p.agotado || (tickA().ids || []).indexOf(p.id) >= 0 || S.agotLoc.indexOf(p.id) >= 0;
/* ═══ LE SCELTE (v0.5) · le stesse domande del menù vivo, dalla carta pubblica (nessuna lettura di Google) ═══
   ① il término, se il piatto porta il badge «carne» e la config ha `termino_opciones` · ② «¿Cómo lo quieres?» dal testo
   `Modificadores` della carta, opzioni separate da «/»; un'opzione sola ⇒ si antepone «Como viene», che non si scrive;
   le opzioni che ripetono il término non si chiedono due volte (stessa regola del vivo, genere normalizzato).
   💰 Il sovrapprezzo scritto nell'opzione («Chelada +$1.500») SI SOMMA al prezzo della riga (il vivo lo lascia etichetta
   sui piatti fuori dal vocabolario: è un buco, non un contratto). ⚠️ Resta FUORI il menú-contenitore (3 Tiempos): le sue
   domande vivono nel vocabolario dei modificatori, che il bordo serve solo allo staff (leva MODS2_BORDE_ON, di 🎛 BKP). */
/* v0.5.1 (D-419 ③, Alberto 28-ott «vai»): LE SCELTE SONO SPENTE finché il bordo non serve al cliente i modificatori di Postgres
   (lettura pubblica di 🎛 BKP). La colonna `Modificadores` della carta e `termino_opciones` nascono dal foglio: non si leggono.
   Chi ha domande ⇒ «Con opciones · pronto», mai il ripiego su Google. Si riaccende cambiando la SORGENTE di domande(), non questa riga. */
const SCELTE_ON = false;
const chiedeScelta = (p) => p.c === 'menu_contenitore' || (!SCELTE_ON && !!(p.mt || p.carne));
const normT = (s) => String(s || '').trim().toLowerCase().replace(/[oa]$/, '');
function parseOp(s) { const m = String(s).match(/^(.*?)\s*\+\s*\$?\s*([\d.]+)\s*$/); return m ? { o: m[1].trim(), d: prezzo(m[2]) } : { o: String(s).trim(), d: 0 }; }
function domande(p) {
  if (!SCELTE_ON) return [];
  const out = [], TO = String((S.cfg && S.cfg.termino_opciones) || '').split(',').map((s) => s.trim()).filter(Boolean);
  if (p.carne && TO.length) out.push({ k: 't', tit: 'El término de tu carne', ops: TO.map((o) => ({ o, d: 0 })) });
  if (p.mt) {
    let ops = p.mt.split('/').map((s) => s.trim()).filter(Boolean).map(parseOp);
    if (p.carne && TO.length) { const ts = TO.map(normT); ops = ops.filter((x) => ts.indexOf(normT(x.o)) < 0); }
    if (ops.length === 1) ops = [{ o: 'Como viene', d: 0 }].concat(ops);
    if (ops.length >= 2) out.push({ k: 'm', tit: '¿Cómo lo quieres?', ops });
  }

}
/* il carrello: una riga = un piatto CON le sue scelte (chiave `id§término§modo`): due filetes a término diverso = due righe */
const chiave = (p, t, m) => p.id + '§' + (t || '') + '§' + (m || '');
function righe() { return Object.keys(S.cart).map((k) => { const [id, t, m] = k.split('§'); const p = S.prod.find((x) => x.id === id);
  const dq = p ? domande(p) : [], g = dq.find((x) => x.k === 'm'), d = (g && (g.ops.find((x) => x.o === m) || {}).d) || 0;
  return { k, p, t, m: m === 'Como viene' ? '' : m, q: S.cart[k], d }; }).filter((r) => r.p); }
const qtyDi = (p) => righe().filter((r) => r.p.id === p.id).reduce((s, r) => s + r.q, 0);
const prezzoRiga = (r) => prezzoOra(r.p).v + r.d;
const nomeRiga = (r) => r.p.n + (r.m ? ' · ' + r.m : '') + (r.t ? ' · ' + r.t : '');
// la scelta in corso del piatto aperto: completa quando ogni domanda ha una risposta
const selDi = (p) => (S.sel[p.id] = S.sel[p.id] || {});
const sceltaCompleta = (p) => domande(p).every((q) => selDi(p)[q.k]);
const chiaveSel = (p) => chiave(p, selDi(p).t, selDi(p).m);
/* LA LEVA DELL'INVIO (AUT-0749): `menu_vero_envio_on` nella config del locale. Vuota = spento (vista previa).
   "1" = tutte le mesas · altrimenti l'elenco delle mesas ammesse («998» per la prova). Spegne anche la campanella. */
function envioOn() {
  const v = String((S.cfg && S.cfg.menu_vero_envio_on) || '').trim().toLowerCase();
  if (!v || !MESA) return false;
  if (v === '1' || v === 'true') return true;
  return v.split(/[\s,;]+/).indexOf(String(MESA).toLowerCase()) >= 0;
}
const barraCats = () => tickA().barra_cats || String((S.cfg && S.cfg.kds_barra_cats) || '').split(',').map((s) => s.trim().toLowerCase()).filter(Boolean);
function adove(prods) {
  const bc = barraCats(); const d = new Set(prods.map((p) => (p && bc.indexOf(p.c) >= 0 ? 'barra' : 'cocina')));
  return d.has('cocina') && d.has('barra') ? 'a cocina y barra' : d.has('barra') ? 'a barra' : 'a cocina';
}
/* la finestra oraria del prodotto, anche oltre la mezzanotte (la stessa regola del menù vivo, productInFaja) */
function inOrario(p) {
  if (p.hf === p.hi) return true;
  const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Santiago' })); const h = d.getHours() + d.getMinutes() / 60;
  return p.hf > p.hi ? (h >= p.hi && h < p.hf) : (h >= p.hi || h < p.hf);

const hhmm = (x) => String(Math.floor(x)).padStart(2, '0') + ':' + String(Math.round((x % 1) * 60)).padStart(2, '0');

/* ═══ i gruppi (famiglie) dalla config del locale ═══ */
function gruppi() {
  let g = {}; try { g = JSON.parse((S.cfg && S.cfg.category_groups) || '{}'); } catch (e) { g = {}; }
  const conProd = new Set(S.prod.filter(visibile).map((p) => p.c));
  return Object.keys(g).map((k) => ({ k, emoji: g[k].emoji || '', cats: (g[k].cats || []).filter((c) => conProd.has(c)) })).filter((x) => x.cats.length);
}

/* ═══ il disegno ═══ */
function z1() {

// la card. `lista` = la griglia intera (con foto); senza = la riga sotto la scheda (niente foto: la foto sta sopra)
function card(p, lista) {

  if (!lista && p.id === S.abierta && !esaurito(p) && !chiusa(p) && inOrario(p)) return verCard(p);
  const foto = !lista ? '' : p.img ? '<img class="th" loading="lazy" src="' + esc(p.img) + '" alt="">' : '<div class="tg">' + esc(p.n) + '</div>';
  if (esaurito(p)) return '<div class="cd agot">' + foto + '<div class="nm">' + esc(p.n) + '</div><div class="agl">Se acabó por hoy</div></div>';
  const ch = chiusa(p);
  if (ch) return '<div class="cd agot">' + foto + '<div class="nm">' + esc(p.n) + '</div><div class="agl">' + (ch === 'barra' ? 'La barra ya cerró' : 'La cocina ya cerró') + '</div></div>';
  if (!inOrario(p)) return '<div class="cd agot fh">' + foto + '<div class="nm">' + esc(p.n) + '</div><div class="agl">Desde las ' + hhmm(p.hi) + '</div></div>';
  return '<div class="cd' + (q ? ' dentro' : '') + '" data-a="abre" data-k="' + esc(p.id) + '">' + foto + '<div class="nm">' + esc(p.n) + '</div><div class="pz">' + pzHTML(p) + '</div>' +
    (!MESA ? '' : chiedeScelta(p) ? '<div class="opc">Con opciones · pronto</div>'
      // chi chiede una scelta non mette dalla griglia: apre la scheda, dove si sceglie (il ＋ promette che aggiunge)

      : q ? '<div class="qn"><i data-a="meno" data-k="' + esc(chiave(p)) + '">−</i>' + q + '<i data-a="mas" data-k="' + esc(p.id) + '">+</i></div>'
      : '<button class="addb" data-a="mas" data-k="' + esc(p.id) + '">＋ PEDIR</button>') + '</div>';
}
const ordinabile = (p) => !!(p && MESA && !chiedeScelta(p) && !esaurito(p) && !chiusa(p) && inOrario(p));
// la card VER: il tasto stesso. Sopra c'è già tutto (foto, nome, prezzo, le domande): sotto il dito dice cosa succede se tocchi
function verCard(p) {

  if (chiedeScelta(p)) return '<div class="cd ora ver">' + vnm + '<div class="vpd off">Con opciones · pronto</div><div class="vpz">' + clp(prezzoOra(p).v) + '</div></div>';

  // la card conta la SCELTA fatta sopra, non il piatto: «1 A punto» e poi «Jugoso» sono due righe
  const ks = chiaveSel(p), q = S.cart[ks] || 0, s = selDi(p);
  const r = { p, t: s.t, m: s.m === 'Como viene' ? '' : s.m, d: (((dq.find((x) => x.k === 'm') || { ops: [] }).ops.find((x) => x.o === s.m)) || {}).d || 0 };

/* BUSCAR (mockup 21-ott, Alberto: «il buscar non toglierlo, lo uso moltissimo»): la lente sta in fondo alla riga delle
   categorie e si apre LÌ DENTRO come campo. Cerca su tutta la carta visibile (nome, descrizione, categoria), senza accenti

const normB = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const cercando = () => S.busca !== null && S.busca !== undefined && normB(S.busca).length > 0;
function risultati() {
  const q = normB(S.busca), parole = q.split(/\s+/).filter(Boolean);
  const testo = (p) => normB(p.n + ' ' + (p.d || '') + ' ' + nomeCat(p.c));
  return S.prod.filter((p) => visibile(p) && parole.every((w) => testo(p).indexOf(w) >= 0))
    .sort((a, b) => (normB(b.n).startsWith(q) - normB(a.n).startsWith(q)) || a.n.localeCompare(b.n)).slice(0, 36);
}
const daMostrare = () => cercando() ? risultati() : S.prod.filter((x) => x.c === S.cat && visibile(x));

function pzHTML(p) { const z = prezzoOra(p); return (z.orig ? '<s>' + clp(z.orig) + '</s> ' : '') + clp(z.v) + (inMenuDia(p) ? '<span class="emd">En Menú del día</span>' : ''); }
/* ═══ il passo dopo (mockup 23-ott): chi ha chiesto dalla prima famiglia (il cibo) atterra sull'ultima (il dolce);

function dopoQuesto(prods) {

  for (const att of [0, 600, 1500]) {

    try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) return r; err = new Error('http ' + r.status); } catch (e) { err = e; }
  }
  throw err;
}
// il tick non rompe mai la carta: se non risponde resta quello di prima (o nessuno)
async function leggiTick() {
  try { const j = await (await leggi(BORDO + '/estado/' + LOCAL + '?seccion=menu_tick&t=' + TOKEN_LETTURA)).json();
    const x = j && j.datos && j.datos.datos; if (x && x.ok !== false) S.tick = x; } catch (e) { /* resta il tick di prima */ }
}
// un giro ogni 60", come il vivo, e solo col telefono in mano (sostituisce il poll a Google, non se ne aggiunge uno)
setInterval(async () => { if (!LOCAL || !S.prod.length || document.visibilityState !== 'visible') return; await leggiTick(); pinta(); }, 60000);
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && LOCAL && S.prod.length) { await leggiTick(); pinta(); } });
/* LE NOSTRE FOTO (v0.5.3, Alberto 28-ott): vivono in questo repo, `fotos/<LOCAL>/<id>.webp`, elencate in `fotos/fotos.json`
   ({"BKS":{"BKS-BAR-002":"BKS-BAR-002.webp"}}), e vincono sulla `Imagen_URL` della carta. Mai su Google.
   ⏳ TAMPONE dichiarato: lo uccide il catalogo nativo in Postgres (AUT-0752, seme sab 31-ott), dove la foto è una colonna del prodotto.
   Senza manifesto o con un errore: la foto della carta, come prima. */
async function fotoNostre() {
  try { const r = await fetch('fotos/fotos.json', { cache: 'no-cache' }); if (!r.ok) return {};
    const m = (await r.json())[LOCAL] || {}, out = {};
    Object.keys(m).forEach((id) => { const v = m[id], f = typeof v === 'string' ? v : (v && v.f), y = v && typeof v === 'object' ? Number(v.y) : NaN;
      if (/^[\w.-]+\.(webp|jpe?g|png)$/i.test(f || '')) out[id] = { img: 'fotos/' + LOCAL + '/' + f, fy: (y >= 0 && y <= 100) ? y : null }; });
    return out; } catch (e) { return {}; }
}
(async function avvio() {
  if (!LOCAL) { document.getElementById('z3').innerHTML = '<div class="msg"><b>Escanea el QR de tu mesa</b>Así sabemos dónde estás y qué carta mostrarte.</div>'; return; }
  try {
    const [rc, rk, ff] = await Promise.all([
      leggi(BORDO + '/estado/' + LOCAL + '?seccion=menu_config&t=' + TOKEN_LETTURA),
      leggi(BORDO + '/carta/' + LOCAL + '?t=' + TOKEN_LETTURA),
      fotoNostre(),
    ]);
    const jc = await rc.json();
    S.cfg = (jc && jc.datos && jc.datos.datos && jc.datos.datos.config) || {};
    S.prod = prodotti(await rk.text());
    S.prod.forEach((p) => { if (ff[p.id]) { p.img = ff[p.id].img; p.fy = ff[p.id].fy; } });
    await leggiTick();
    if (S.cfg.brand_name) document.title = S.cfg.brand_name;
    const g = gruppi()[0];
    if (!g) throw new Error('carta vacía');
    S.fam = g.k; S.cat = g.cats[0];
    pinta();
  } catch (e) {
    // nessun ripiego su Google: si dice che cosa manca
    document.getElementById('z3').innerHTML = '<div class="msg"><b>No pudimos abrir la carta</b>Revisa tu conexión y vuelve a intentar.<br><small>(' + esc(LOCAL) + ' · ' + esc(e.message) + ')</small></div>';
  }
})();
